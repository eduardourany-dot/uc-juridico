<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UC Jurídico · Urany de Castro Advocacia</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UC Jurídico">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="description" content="Urany de Castro Advocacia · Suite jurídica para gestão e análise de processos. 100% local.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<script type="module" src="api.js"></script>
<script type="module" src="messaging.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --uc-black:#0a0a0a; --uc-graphite:#1f1f1f; --uc-warm-gray:#6b6b68; --uc-soft-gray:#9b9b96;
  --uc-paper:#fafaf7; --uc-cream:#f4f1e8; --uc-line:#d4cfc0; --uc-line-soft:#e8e3d4;
  --uc-gold:#8a6f3d; --uc-gold-soft:#c9b687; --uc-gold-pale:#f0e9d6;
  --uc-red:#a8472d; --uc-red-soft:#f3d8cf; --uc-amber:#b87f1c; --uc-amber-soft:#f5e3c4;
  --uc-green:#4a7c4a; --uc-green-soft:#d4e8d4;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04); --shadow-md:0 4px 12px rgba(0,0,0,0.06); --shadow-lg:0 12px 30px rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --uc-black:#f5f3ee; --uc-graphite:#d4d0c8; --uc-warm-gray:#a8a39a; --uc-soft-gray:#6b6b66;
  --uc-paper:#16140f; --uc-cream:#221f18; --uc-line:#3a3528; --uc-line-soft:#2a2620;
  --uc-gold:#c9b687; --uc-gold-soft:#8a6f3d; --uc-gold-pale:#2a2418;
  --uc-red-soft:#4a2418; --uc-amber-soft:#3a2c14; --uc-green-soft:#1f3522;
}
*{font-family:'Inter',system-ui,-apple-system,sans-serif;box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--uc-paper);color:var(--uc-graphite);font-size:15px;-webkit-font-smoothing:antialiased}
.font-serif{font-family:'EB Garamond','Times New Roman',serif}
.smallcaps{font-variant:small-caps;letter-spacing:0.08em}

.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
@media(max-width:768px){.app-shell{grid-template-columns:1fr;padding-bottom:70px}.sidebar{display:none !important}.mobile-nav{display:flex !important}}
.sidebar{background:white;border-right:1px solid var(--uc-line);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
[data-theme="dark"] .sidebar{background:#1c1a14}
.sidebar-logo{padding:0 20px 20px;border-bottom:1px solid var(--uc-line-soft);margin-bottom:16px}
.sidebar-logo img{width:100%;max-width:180px}
[data-theme="dark"] .sidebar-logo img{filter:invert(1) brightness(0.95)}
.nav-section{padding:8px 12px 4px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--uc-warm-gray)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--uc-graphite);text-decoration:none;border-left:3px solid transparent;transition:all 0.15s;cursor:pointer;font-size:14px}
.nav-item:hover{background:var(--uc-cream)}
.nav-item.active{background:var(--uc-cream);border-left-color:var(--uc-gold);color:var(--uc-black);font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--uc-red);color:white;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600}
.nav-badge.amber{background:var(--uc-amber)} .nav-badge.gray{background:var(--uc-warm-gray)}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--uc-line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,0.05)}
[data-theme="dark"] .mobile-nav{background:#1c1a14}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--uc-warm-gray);padding:6px 4px;flex:1;min-width:0;text-align:center;cursor:pointer;border-radius:8px;transition:all 0.15s}
.mobile-nav-item.active{color:var(--uc-gold);background:var(--uc-cream)}
.mobile-nav-item svg{width:20px;height:20px}
.mobile-nav-item span{font-size:10px;font-weight:500}

.main-content{padding:24px 32px 60px;max-width:1400px;margin:0 auto;width:100%}
@media(max-width:768px){.main-content{padding:16px 16px 30px}}

.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--uc-line)}
.page-title{font-family:'EB Garamond',serif;font-size:28px;font-weight:600;color:var(--uc-black);margin:0;line-height:1.2}
.page-title .smallcaps-prefix{font-variant:small-caps;letter-spacing:0.06em;color:var(--uc-gold);margin-right:8px}
.page-subtitle{font-family:'EB Garamond',serif;font-style:italic;color:var(--uc-warm-gray);font-size:15px;margin:4px 0 0}

.card{background:white;border:1px solid var(--uc-line);border-radius:8px;padding:20px;transition:all 0.2s}
[data-theme="dark"] .card{background:#1c1a14}
.card-hover:hover{border-color:var(--uc-gold);box-shadow:var(--shadow-md);transform:translateY(-2px);cursor:pointer}
.card-elevated{box-shadow:var(--shadow-md)}
.card-gold-border{border-top:3px solid var(--uc-gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;font-variant:small-caps;letter-spacing:0.06em}
.btn-primary{background:var(--uc-black);color:white;border-color:var(--uc-black)}
.btn-primary:hover{background:var(--uc-graphite)}
[data-theme="dark"] .btn-primary{color:#0a0a0a}
.btn-secondary{background:var(--uc-gold);color:white;border-color:var(--uc-gold)}
.btn-secondary:hover{background:#6f5930}
.btn-outline{background:white;color:var(--uc-graphite);border-color:var(--uc-line)}
.btn-outline:hover{border-color:var(--uc-gold);color:var(--uc-black)}
[data-theme="dark"] .btn-outline{background:transparent}
.btn-ghost{background:transparent;color:var(--uc-graphite)}
.btn-ghost:hover{background:var(--uc-cream)}
.btn-danger{background:var(--uc-red);color:white;border-color:var(--uc-red)}
.btn-danger:hover{filter:brightness(0.9)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-icon-only{padding:8px}
.btn-full{width:100%}
.btn:disabled{opacity:0.5;cursor:not-allowed}

.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--uc-line);border-radius:6px;background:white;color:var(--uc-graphite);font-size:14px;font-family:inherit}
[data-theme="dark"] .input,[data-theme="dark"] .select,[data-theme="dark"] .textarea{background:#221f18}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--uc-gold);box-shadow:0 0 0 3px var(--uc-gold-pale)}
.label{display:block;font-weight:600;font-size:13px;color:var(--uc-black);margin-bottom:6px}
.help-text{font-size:12px;color:var(--uc-warm-gray);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;font-variant:small-caps;letter-spacing:0.06em}
.badge-gold{background:var(--uc-gold-pale);color:var(--uc-gold);border:1px solid var(--uc-gold-soft)}
.badge-red{background:var(--uc-red-soft);color:var(--uc-red)}
.badge-amber{background:var(--uc-amber-soft);color:var(--uc-amber)}
.badge-green{background:var(--uc-green-soft);color:var(--uc-green)}
.badge-gray{background:var(--uc-cream);color:var(--uc-warm-gray);border:1px solid var(--uc-line)}
.badge-flagship{background:var(--uc-black);color:var(--uc-gold-soft)}
[data-theme="dark"] .badge-flagship{background:var(--uc-gold);color:#0a0a0a}

.stat-card{background:var(--uc-cream);border:1px solid var(--uc-line);border-radius:8px;padding:16px}
.stat-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--uc-warm-gray);margin-bottom:4px}
.stat-value{font-family:'EB Garamond',serif;font-size:28px;font-weight:600;color:var(--uc-black);line-height:1}
.stat-meta{font-size:12px;color:var(--uc-warm-gray);margin-top:4px}

.gold-divider{height:2px;background:linear-gradient(90deg,transparent,var(--uc-gold),transparent);margin:24px 0}

.drop-zone{border:2px dashed var(--uc-line);background:white;border-radius:8px;padding:32px 16px;text-align:center;cursor:pointer;transition:all 0.2s}
[data-theme="dark"] .drop-zone{background:#1c1a14}
.drop-zone.dragover{border-color:var(--uc-gold);background:var(--uc-cream)}

.spinner{border:3px solid var(--uc-line);border-top-color:var(--uc-gold);border-radius:50%;width:22px;height:22px;animation:spin 1s linear infinite}
.spinner-mini{display:inline-block;border:2px solid var(--uc-line);border-top-color:var(--uc-gold);border-radius:50%;width:12px;height:12px;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.15s}
.modal{background:var(--uc-paper);border:1px solid var(--uc-line);border-top:3px solid var(--uc-gold);border-radius:8px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
[data-theme="dark"] .modal{background:#1c1a14}
.modal-title{font-family:'EB Garamond',serif;font-size:20px;font-weight:600;color:var(--uc-black);margin:0 0 16px}

.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 40px)}
.toast{background:white;border:1px solid var(--uc-line);border-left:3px solid var(--uc-gold);border-radius:6px;padding:12px 16px;box-shadow:var(--shadow-md);max-width:360px;animation:fadeIn 0.2s}
[data-theme="dark"] .toast{background:#1c1a14}
.toast.success{border-left-color:var(--uc-green)}
.toast.error{border-left-color:var(--uc-red)}
.toast-title{font-weight:600;font-size:13px;color:var(--uc-black);margin-bottom:2px}
.toast-msg{font-size:12px;color:var(--uc-warm-gray)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--uc-cream);border-radius:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--uc-warm-gray);cursor:pointer;border:none;background:transparent;font-variant:small-caps;letter-spacing:0.06em}
.tab.active{background:white;color:var(--uc-black);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .tab.active{background:#1c1a14}

.process-card{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.process-card .process-cnj{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:var(--uc-warm-gray)}
.process-card .process-name{font-family:'EB Garamond',serif;font-size:18px;font-weight:600;color:var(--uc-black);line-height:1.3}
.process-card .process-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--uc-warm-gray)}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--uc-line)}
.timeline-event{position:relative;padding-bottom:16px;padding-left:8px;cursor:pointer}
.timeline-event::before{content:'';position:absolute;left:-22px;top:6px;width:12px;height:12px;background:var(--uc-gold);border-radius:50%;border:2px solid var(--uc-paper)}
.timeline-event.has-note::before{background:var(--uc-red)}

.deadline-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--uc-line);border-radius:6px;background:white;gap:12px;margin-bottom:8px}
[data-theme="dark"] .deadline-row{background:#1c1a14}
.deadline-row.urgent{border-left:4px solid var(--uc-red);background:var(--uc-red-soft)}
.deadline-row.warning{border-left:4px solid var(--uc-amber);background:var(--uc-amber-soft)}
.deadline-row.safe{border-left:4px solid var(--uc-green)}
.deadline-row.expired{border-left:4px solid var(--uc-red);opacity:0.7}
.deadline-row.done{border-left:4px solid var(--uc-soft-gray);opacity:0.55;text-decoration:line-through}

.tool-card{display:flex;flex-direction:column;gap:8px;padding:16px;cursor:pointer}
.tool-icon{width:36px;height:36px;background:var(--uc-cream);border:1px solid var(--uc-line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--uc-graphite)}
.tool-icon-gold{background:var(--uc-gold);color:white;border-color:var(--uc-gold)}
.tool-name{font-family:'EB Garamond',serif;font-size:16px;font-weight:600;color:var(--uc-black)}
.tool-desc{font-size:12px;color:var(--uc-warm-gray);line-height:1.4}

.diff-add{background:var(--uc-green-soft);color:var(--uc-green)}
.diff-del{background:var(--uc-red-soft);color:var(--uc-red);text-decoration:line-through}
.diff-line{padding:2px 8px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}

.empty-state{text-align:center;padding:48px 24px}
.empty-state-title{font-family:'EB Garamond',serif;font-size:20px;color:var(--uc-graphite);margin-bottom:8px}
.empty-state-msg{color:var(--uc-warm-gray);font-size:14px;max-width:400px;margin:0 auto 16px}

.scroll-thin::-webkit-scrollbar{width:6px;height:6px}
.scroll-thin::-webkit-scrollbar-thumb{background:var(--uc-line);border-radius:3px}
.scroll-thin::-webkit-scrollbar-track{background:transparent}

.hidden{display:none !important}
.fade-in{animation:fadeIn 0.3s ease}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-action{background:white;border:1px solid var(--uc-line);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.15s;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
[data-theme="dark"] .quick-action{background:#1c1a14}
.quick-action:hover{border-color:var(--uc-gold)}
.quick-action:active{transform:scale(0.98)}
.quick-action .qa-icon{font-size:32px}
.quick-action .qa-label{font-family:'EB Garamond',serif;font-weight:600;color:var(--uc-black);font-size:15px}

.detail-tabs{display:flex;border-bottom:1px solid var(--uc-line);margin-bottom:20px;overflow-x:auto}
.detail-tab{padding:10px 16px;border:none;background:transparent;cursor:pointer;color:var(--uc-warm-gray);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px;font-variant:small-caps;letter-spacing:0.06em}
.detail-tab.active{color:var(--uc-black);border-bottom-color:var(--uc-gold)}

.backup-banner{background:var(--uc-amber-soft);border:1px solid var(--uc-amber);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px}

.note-item{background:var(--uc-cream);border:1px solid var(--uc-line);border-radius:6px;padding:12px;margin-bottom:8px}
.note-meta{font-size:11px;color:var(--uc-warm-gray);margin-bottom:4px}

.progress-wrap{margin:12px 0}
.progress-bar-bg{height:6px;background:var(--uc-cream);border-radius:3px;overflow:hidden}
.progress-bar-fg{height:100%;background:var(--uc-gold);width:0;transition:width 0.3s}

@media(min-width:769px){.show-mobile{display:none !important}}
@media(max-width:768px){.show-desktop{display:none !important}}
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Urany de Castro Advocacia">
    </div>

    <div class="nav-section">Carteira</div>
    <a class="nav-item" data-route="dashboard">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Início</span>
    </a>
    <a class="nav-item" data-route="processes">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Processos</span>
      <span id="navProcessCount" class="nav-badge gray hidden">0</span>
    </a>
    <a class="nav-item" data-route="clientes">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span>Clientes</span>
      <span id="navClienteCount" class="nav-badge gray hidden">0</span>
    </a>
    <a class="nav-item" data-route="deadlines">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Prazos</span>
      <span id="navDeadlineCount" class="nav-badge hidden">0</span>
    </a>
    <a class="nav-item" data-route="agenda">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span>Agenda</span>
      <span id="navAgendaCount" class="nav-badge gray hidden">0</span>
    </a>
    <a class="nav-item" data-route="financeiro">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Financeiro</span>
    </a>
    <a class="nav-item" data-route="relatorio">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Relatório</span>
    </a>

    <div class="nav-section" style="margin-top:16px;">Operacional</div>
    <a class="nav-item" data-route="modelos">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Modelos</span>

const DB_NAME = 'uc-juridico';
const DB_VERSION = 2;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('processes')) {
        const s = d.createObjectStore('processes', { keyPath: 'id' });
        s.createIndex('cnj', 'cnj', { unique: false });
        s.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
      if (!d.objectStoreNames.contains('events')) {
        const s = d.createObjectStore('events', { keyPath: 'id' });
        s.createIndex('processId', 'processId', { unique: false });
      }
      if (!d.objectStoreNames.contains('deadlines')) {
        const s = d.createObjectStore('deadlines', { keyPath: 'id' });
        s.createIndex('processId', 'processId', { unique: false });
        s.createIndex('deadlineDate', 'deadlineDate', { unique: false });
        s.createIndex('status', 'status', { unique: false });
      }
      if (!d.objectStoreNames.contains('notes')) {
        const s = d.createObjectStore('notes', { keyPath: 'id' });
        s.createIndex('processId', 'processId', { unique: false });
      }
      if (!d.objectStoreNames.contains('jurisprudence')) {
        const s = d.createObjectStore('jurisprudence', { keyPath: 'id' });
        s.createIndex('processId', 'processId', { unique: false });
      }
      if (!d.objectStoreNames.contains('pdfs')) {
        d.createObjectStore('pdfs', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('prompts')) {
        d.createObjectStore('prompts', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('history')) {
        const s = d.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
        s.createIndex('timestamp', 'timestamp', { unique: false });
      }
      // DJEN: publications fetched (for dedup) and full data stored locally
      if (!d.objectStoreNames.contains('djen_publications')) {
        const s = d.createObjectStore('djen_publications', { keyPath: 'hash' });
        s.createIndex('cnj', 'cnj', { unique: false });
        s.createIndex('processId', 'processId', { unique: false });
        s.createIndex('dataDisponibilizacao', 'dataDisponibilizacao', { unique: false });
        s.createIndex('importedAt', 'importedAt', { unique: false });
        s.createIndex('status', 'status', { unique: false });
      }
    };
  });
}

function dbPromise(storeName, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let result;
    try { result = fn(store); } catch(e) { reject(e); return; }
    tx.oncomplete = () => resolve(result?.result !== undefined ? result.result : result);
    tx.onerror = () => reject(tx.error);
  });
}

const DB = {
  // Processes
  async getAllProcesses() { return await dbPromise('processes', 'readonly', s => new Promise(res => { const r = s.getAll(); r.onsuccess = () => res(r.result); })); },
  async getProcess(id) { return await dbPromise('processes', 'readonly', s => new Promise(res => { const r = s.get(id); r.onsuccess = () => res(r.result); })); },
  async saveProcess(p) {
    p.updatedAt = Date.now();
    if (!p.createdAt) p.createdAt = p.updatedAt;
    await dbPromise('processes', 'readwrite', s => s.put(p));
    addHistory('process_saved', { processId: p.id, name: p.name });
    return p;
  },
  async deleteProcess(id) {
    await dbPromise('processes', 'readwrite', s => s.delete(id));
    // Cascade delete
    for (const store of ['events', 'deadlines', 'notes', 'jurisprudence']) {
      const items = await dbPromise(store, 'readonly', s => new Promise(res => { const r = s.index('processId').getAll(id); r.onsuccess = () => res(r.result); }));
      for (const item of items) await dbPromise(store, 'readwrite', s => s.delete(item.id));
    }
  },

  // Events
  async getEventsByProcess(pid) { return await dbPromise('events', 'readonly', s => new Promise(res => { const r = s.index('processId').getAll(pid); r.onsuccess = () => res(r.result); })); },
  async saveEvent(e) { await dbPromise('events', 'readwrite', s => s.put(e)); return e; },

  // Deadlines

  // Notes

  // Jurisprudence

  async saveJurisprudence(j) { await dbPromise('jurisprudence', 'readwrite', s => s.put(j)); return j; },

  // PDFs (Blob storage)
  async getPdf(id) { return await dbPromise('pdfs', 'readonly', s => new Promise(res => { const r = s.get(id); r.onsuccess = () => res(r.result); })); },
  async savePdf(pdf) { await dbPromise('pdfs', 'readwrite', s => s.put(pdf)); return pdf; },
  async deletePdf(id) { await dbPromise('pdfs', 'readwrite', s => s.delete(id)); },

  // Prompts
  async getAllPrompts() { return await dbPromise('prompts', 'readonly', s => new Promise(res => { const r = s.getAll(); r.onsuccess = () => res(r.result); })); },
  async savePrompt(p) { await dbPromise('prompts', 'readwrite', s => s.put(p)); return p; },
  async deletePrompt(id) { await dbPromise('prompts', 'readwrite', s => s.delete(id)); },

  // Settings
  async getSetting(key, defaultVal = null) {
    const r = await dbPromise('settings', 'readonly', s => new Promise(res => { const r = s.get(key); r.onsuccess = () => res(r.result); }));
    return r ? r.value : defaultVal;
  },
  async setSetting(key, value) { await dbPromise('settings', 'readwrite', s => s.put({ key, value })); },

  // History
  async getHistory(limit = 50) {
    return await dbPromise('history', 'readonly', s => new Promise(res => {
      const items = []; const r = s.index('timestamp').openCursor(null, 'prev');
      r.onsuccess = (e) => { const c = e.target.result; if (c && items.length < limit) { items.push(c.value); c.continue(); } else res(items); };
    }));
  },
  async addHistoryEntry(action, data) {
    await dbPromise('history', 'readwrite', s => s.add({ timestamp: Date.now(), action, data }));
  },

  // ====== Clientes (stub IndexedDB — sobrescrito por UC_RemoteDB no boot) ======
  async getAllClientes() { return []; },

  async deleteCliente(_id) {},

function navigate(route, params = {}) {
  state.currentRoute = route;
  Object.assign(state, params);
  // Update nav highlighting
  document.querySelectorAll('[data-route]').forEach(el => {
    el.classList.toggle('active', el.dataset.route === (route === 'process' ? 'processes' : route));
  });
  // Update URL hash
  let hash;
  if (route === 'process') hash = `#process/${params.currentProcessId}`;
  else if (route === 'clienteDetalhe') hash = `#cliente/${params.currentClienteId}`;
  else hash = `#${route}`;
  if (location.hash !== hash) history.pushState(null, '', hash);
  // Render
  if (routes[route]) routes[route]();
  // Scroll to top
  window.scrollTo(0, 0);
}

function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('process/')) {
    return { route: 'process', currentProcessId: h.slice(8) };
  }
  if (h.startsWith('cliente/')) {
    return { route: 'clienteDetalhe', currentClienteId: h.slice(8) };
  }
  return { route: h || 'dashboard' };
}

window.addEventListener('popstate', () => {
  const { route, ...params } = parseHash();
  state.currentRoute = route;
  Object.assign(state, params);
  if (routes[route]) routes[route]();
});

const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatBytes(b) {
  if (!b) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return parseFloat((b / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDate(d, opts = {}) {
  if (!d) return '—';
  const date = d instanceof Date ? d : new Date(d);
  if (isNaN(date)) return '—';
  if (opts.relative) {
    const diff = Date.now() - date.getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'hoje';
    if (days === 1) return 'ontem';
    if (days < 7) return `há ${days} dias`;
    if (days < 30) return `há ${Math.floor(days/7)} semanas`;
    if (days < 365) return `há ${Math.floor(days/30)} meses`;
    return `há ${Math.floor(days/365)} anos`;
  }
  return date.toLocaleDateString('pt-BR');
}

function formatDateTime(d) {
  if (!d) return '—';
  const date = new Date(d);
  return date.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function toast(title, msg = '', type = 'info') {
  const c = $('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<div class="toast-title">${escapeHtml(title)}</div>${msg ? `<div class="toast-msg">${escapeHtml(msg)}</div>` : ''}`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function showModal(title, fields, options = {}) {
  return new Promise(resolve => {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal scroll-thin">
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        ${options.intro ? `<p class="help-text" style="margin-bottom: 16px;">${options.intro}</p>` : ''}
        <div class="space-y-4 mb-5">
          ${fields.map((f, i) => renderModalField(f, i)).join('')}
        </div>
        <div class="flex gap-2">
          ${options.cancelLabel === null ? '' : `<button class="btn btn-outline" id="_modalCancel" style="flex:1">${escapeHtml(options.cancelLabel || 'Cancelar')}</button>`}
          <button class="btn btn-primary" id="_modalConfirm" style="flex:1">${escapeHtml(options.confirmLabel || 'Confirmar')}</button>
        </div>
      </div>`;
    $('modalContainer').appendChild(modal);
    const cleanup = () => modal.remove();

    // Helpers de acesso pra callbacks dinâmicos (onChange).
    const getField = idx => document.getElementById('_mf_' + idx);
    const getValue = idx => {
      const el = getField(idx);
      if (!el) return null;
      return el.type === 'checkbox' ? el.checked : el.value;
    };
    const setValue = (idx, val) => {
      const el = getField(idx);
      if (!el) return;
      if (el.type === 'checkbox') el.checked = !!val;
      else el.value = val == null ? '' : val;
    };
    const findByName = name => fields.findIndex(f => f.name === name);
    const getByName = name => {
      const idx = findByName(name);
      return idx >= 0 ? getValue(idx) : null;
    };
    const setByName = (name, val) => {
      const idx = findByName(name);
      if (idx >= 0) setValue(idx, val);
    };

    // Liga onChange por campo (suporta callback async). Reagentes:
    //   - select/checkbox: evento 'change'
    //   - text/number/etc: evento 'change' (dispara quando blur com valor diferente)
    fields.forEach((f, i) => {
      if (typeof f.onChange !== 'function') return;
      const el = getField(i);
      if (!el) return;
      el.addEventListener('change', async () => {
        try {
          await f.onChange(getValue(i), { getValue, setValue, getByName, setByName });
        } catch (e) {
          console.warn('Modal onChange error', e);
        }
      });
    });

    // Liga onInput por campo (callback síncrono que retorna o valor formatado).
    // Útil pra máscaras dinâmicas (CPF, telefone) e transformações em tempo real
    // (uppercase, lowercase). Preserva aproximadamente a posição do cursor.
    fields.forEach((f, i) => {
      if (typeof f.onInput !== 'function') return;
      const el = getField(i);
      if (!el || el.type === 'checkbox' || el.tagName === 'SELECT') return;
      el.addEventListener('input', () => {
        try {
          const oldValue = el.value;
          const oldCursor = el.selectionStart || 0;
          const newValue = f.onInput(oldValue, { getValue, setValue, getByName, setByName });
          if (newValue == null || newValue === oldValue) return;
          el.value = newValue;
          // Tenta preservar cursor: ajusta pelo delta de length (heurística)
          try {
            const delta = newValue.length - oldValue.length;
            const newPos = Math.max(0, Math.min(newValue.length, oldCursor + delta));
            el.setSelectionRange(newPos, newPos);
          } catch (_) {}
        } catch (e) {
          console.warn('Modal onInput error', e);
        }
      });
    });

    const cancelBtn = $('_modalCancel');
    if (cancelBtn) cancelBtn.onclick = () => { cleanup(); resolve(null); };
    $('_modalConfirm').onclick = () => {
      const values = fields.map((f, i) => getValue(i));
      cleanup(); resolve(values);
    };
    document.getElementById('_mf_0')?.focus();
  });
}

function renderModalField(f, i) {
  const id = '_mf_' + i;
  if (f.type === 'select') {
    return `<div><label class="label">${escapeHtml(f.label)}</label>${f.help ? `<p class="help-text" style="margin-bottom: 6px;">${f.help}</p>` : ''}<select class="select" id="${id}">${f.options.map(o => `<option value="${escapeHtml(o.value)}" ${o.value === f.default ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>`;
  }
  if (f.type === 'checkbox') {
    return `<div style="display: flex; gap: 8px; align-items: flex-start;"><input type="checkbox" id="${id}" ${f.default ? 'checked' : ''} style="margin-top: 3px;"><div><label for="${id}" style="font-weight: 500; cursor: pointer;">${escapeHtml(f.label)}</label>${f.help ? `<p class="help-text">${f.help}</p>` : ''}</div></div>`;
  }
  if (f.type === 'textarea') {
    return `<div><label class="label">${escapeHtml(f.label)}</label>${f.help ? `<p class="help-text" style="margin-bottom: 6px;">${f.help}</p>` : ''}<textarea class="textarea" id="${id}" rows="${f.rows || 4}" ${f.readOnly ? 'readonly' : ''} ${f.placeholder ? `placeholder="${escapeHtml(f.placeholder)}"` : ''} style="font-family: ${f.mono === false ? 'inherit' : 'ui-monospace, Menlo, Consolas, monospace'}; font-size: ${f.mono === false ? '13px' : '12px'};">${escapeHtml(f.default || '')}</textarea></div>`;
  }
  return `<div><label class="label">${escapeHtml(f.label)}</label>${f.help ? `<p class="help-text" style="margin-bottom: 6px;">${f.help}</p>` : ''}<input type="${f.type || 'text'}" class="input" id="${id}" value="${escapeHtml(f.default || '')}" ${f.placeholder ? `placeholder="${escapeHtml(f.placeholder)}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''} ${f.step !== undefined ? `step="${f.step}"` : ''}></div>`;
}

function confirmDialog(title, message, danger = false) {
  return new Promise(resolve => {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal">
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        <p style="color: var(--uc-graphite); font-size: 14px; margin-bottom: 20px;">${escapeHtml(message)}</p>
        <div class="flex gap-2">
          <button class="btn btn-outline" id="_cd_no" style="flex:1">Cancelar</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="_cd_yes" style="flex:1">Confirmar</button>
        </div>
      </div>`;
    $('modalContainer').appendChild(modal);
    $('_cd_no').onclick = () => { modal.remove(); resolve(false); };
    $('_cd_yes').onclick = () => { modal.remove(); resolve(true); };
  });
}

// Resolve o tema efetivo. 'auto' lê a preferência do SO via matchMedia.
function _resolverTema(pref) {
  if (pref === 'auto' || !pref) {
    if (typeof window.matchMedia === 'function') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return 'light';
  }
  return pref === 'dark' ? 'dark' : 'light';
}

function applyTheme(theme) {
  const efetivo = _resolverTema(theme);
  document.documentElement.setAttribute('data-theme', efetivo);
  state.settings.theme = theme || 'light';
}

// Quando user escolhe 'auto', escutamos mudanças do SO em tempo real
(function _bindAutoTema() {
  if (typeof window.matchMedia !== 'function') return;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const handler = () => {
    if (state.settings?.theme === 'auto') {
      applyTheme('auto');
      if (typeof _updateThemeQuickToggleLabel === 'function') _updateThemeQuickToggleLabel();
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', handler);
  else if (mq.addListener) mq.addListener(handler);  // fallback Safari < 14
})();

function renderDeadlineRowMini(d, processes) {
  const proc = processes.find(p => p.id === d.processId);
  const today = new Date(); today.setHours(0,0,0,0);
  const deadlineDate = new Date(d.deadlineDate);
  const daysLeft = Math.ceil((deadlineDate - today) / 86400000);
  let cls = 'safe', label = `${daysLeft} dias`;
  if (daysLeft < 0) { cls = 'expired'; label = `vencido há ${Math.abs(daysLeft)}d`; }
  else if (daysLeft === 0) { cls = 'urgent'; label = 'HOJE'; }
  else if (daysLeft <= 3) { cls = 'urgent'; label = `${daysLeft}d`; }
  else if (daysLeft <= 7) { cls = 'warning'; label = `${daysLeft}d`; }
  return `
    <div class="deadline-row ${cls}" style="margin-bottom: 6px; padding: 10px;" onclick="navigate('process', { currentProcessId: '${d.processId}' })">
      <div style="min-width: 0; flex: 1;">
        <div style="font-weight: 500; font-size: 13px; color: var(--uc-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(proc?.name || 'Processo')}</div>
        <div style="font-size: 11px; color: var(--uc-warm-gray);">${escapeHtml(d.description || d.type)} · ${formatDate(deadlineDate)}</div>
      </div>
      <span class="badge ${cls === 'urgent' || cls === 'expired' ? 'badge-red' : cls === 'warning' ? 'badge-amber' : 'badge-green'}">${label}</span>
    </div>
  `;
}

function updateNavBadges() {

// Normaliza nome pra dedup (trim + lowercase + collapse de espaços)
function _normalizeNomeCliente(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

// Busca cliente em cache por nome (case-insensitive). Retorna null se não achar.
function _findClienteByNome(clientes, nome) {
  if (!nome) return null;
  const norm = _normalizeNomeCliente(nome);
  return clientes.find(c => _normalizeNomeCliente(c.nome) === norm) || null;
}

// Migração lazy: se processo tem `client` string mas não tem `clienteId`,
// cria/vincula cliente correspondente. Idempotente. Roda em background.
// Pode ser desligada via setting `migracaoClientesDesligada` (true) — útil
// quando Eduardo limpa clientes migrados e quer cadastrar manualmente.
async function _migrarProcessosParaClientes() {
  try {
    const desligada = await DB.getSetting('migracaoClientesDesligada', false);
    if (desligada) return 0;

    const processos = await DB.getAllProcesses();
    const semCliente = processos.filter(p => p.client && !p.clienteId);
    if (semCliente.length === 0) return 0;

    const clientes = await DB.getAllClientes();
    let criados = 0, vinculados = 0;
    const cacheNovo = clientes.slice();

    for (const p of semCliente) {
      let cli = _findClienteByNome(cacheNovo, p.client);
      if (!cli) {
        cli = {
          id: uid(),
          nome: p.client.trim(),
          tipoPessoa: 'PJ',
          cpfCnpj: p.clientDoc || null,
          email: null,
          telefone: p.clientContact || null,
          endereco: null,
          observacoes: null,
          ativo: true,
          createdAt: Date.now()
        };
        await DB.saveCliente(cli);
        cacheNovo.push(cli);
        criados++;
      }
      p.clienteId = cli.id;
      await DB.saveProcess(p);
      vinculados++;
    }

    if (criados > 0 || vinculados > 0) {
      console.log(`[clientes] migração: ${criados} novo(s) cliente(s), ${vinculados} processo(s) vinculado(s)`);
      if (typeof toast === 'function' && (criados > 0)) {
        toast(`${criados} cliente(s) criados pela migração`, `${vinculados} processo(s) vinculado(s)`, 'success');
      }
    }
    return criados;
  } catch (e) {
    console.warn('Migração de clientes falhou', e);
    return 0;
  }
}

// Validação simples de CPF/CNPJ (formato, não dígitos verificadores)
function _validarCpfCnpj(s) {
  if (!s) return true;
  const limpo = String(s).replace(/\D/g, '');
  return limpo.length === 11 || limpo.length === 14;
}

// Máscara progressiva CPF/CNPJ.
// CPF (≤11 dígitos): 000.000.000-00
// CNPJ (12-14 dígitos): 00.000.000/0000-00
function _maskCpfCnpj(s) {
  const v = String(s || '').replace(/\D/g, '').slice(0, 14);
  if (v.length === 0) return '';
  if (v.length <= 11) {
    // CPF
    return v
      .replace(/^(\d{3})(\d)/, '$1.$2')
      .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
      .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
  }
  // CNPJ
  return v
    .replace(/^(\d{2})(\d)/, '$1.$2')
    .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3/$4')
    .replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, '$1.$2.$3/$4-$5');
}

// Máscara progressiva de telefone BR.
// Fixo (10 dígitos):  (00) 0000-0000
// Celular (11 díg.):  (00) 00000-0000
function _maskTelefone(s) {
  const v = String(s || '').replace(/\D/g, '').slice(0, 11);
  if (v.length === 0) return '';
  if (v.length <= 2) return '(' + v;
  if (v.length <= 6) return '(' + v.slice(0, 2) + ') ' + v.slice(2);
  if (v.length <= 10) {
    // Fixo: (00) 0000-0000
    return '(' + v.slice(0, 2) + ') ' + v.slice(2, 6) + '-' + v.slice(6);
  }
  // Celular: (00) 00000-0000
  return '(' + v.slice(0, 2) + ') ' + v.slice(2, 7) + '-' + v.slice(7);
}
function _validarEmail(s) {
  if (!s) return true;
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
}

// Busca endereço pelo CEP via API ViaCEP (gratuita, CORS habilitado).
// Retorna {logradouro, bairro, cidade, estado} ou null em erro/inexistente.
async function _buscarCep(cep) {
  const limpo = String(cep || '').replace(/\D/g, '');
  if (limpo.length !== 8) return null;
  try {
    const resp = await fetch(`https://viacep.com.br/ws/${limpo}/json/`);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (data.erro) return null;
    return {
      logradouro: data.logradouro || '',
      bairro: data.bairro || '',
      cidade: data.localidade || '',
      estado: data.uf || ''
    };
  } catch (e) {
    console.warn('ViaCEP falhou', e);
    return null;
  }
}

// Compose endereco como string única (compat com clientes antigos que tinham
// só endereco string). Útil pra buscar e exibir.
function _composeEndereco(c) {
  if (!c) return '';
  const parts = [];
  if (c.logradouro) parts.push(c.logradouro + (c.numero ? ', ' + c.numero : ''));
  if (c.complemento) parts.push(c.complemento);
  if (c.bairro) parts.push(c.bairro);
  if (c.cidade) parts.push(c.cidade + (c.estado ? '/' + c.estado : ''));
  if (c.cep) parts.push('CEP ' + c.cep);
  return parts.join(' · ');
}

async function _formClienteFlow(clienteAtual) {
  const isEdit = !!clienteAtual;
  // Compat: clientes antigos podem ter só `endereco` string (sem cep/logradouro/etc).
  // Mantém o valor legado num placeholder mas oferece os campos novos vazios.
  const enderecoLegacy = clienteAtual?.endereco && !clienteAtual?.logradouro
    ? clienteAtual.endereco : null;

  const fields = [
    { label: 'Nome (razão social ou nome completo) — sempre em CAIXA ALTA', name: 'nome',
      default: (clienteAtual?.nome || '').toUpperCase(),
      onInput: v => String(v || '').toUpperCase() },
    { label: 'Tipo de pessoa', name: 'tipoPessoa', type: 'select', default: clienteAtual?.tipoPessoa || 'PJ', options: [
      { value: 'PJ', label: 'Pessoa Jurídica' },
      { value: 'PF', label: 'Pessoa Física' }
    ]},
    { label: 'CPF/CNPJ', name: 'cpfCnpj',
      default: _maskCpfCnpj(clienteAtual?.cpfCnpj || ''),
      placeholder: 'CPF: 000.000.000-00 · CNPJ: 00.000.000/0000-00',
      onInput: v => _maskCpfCnpj(v) },
    { label: 'Email', name: 'email', default: clienteAtual?.email || '', placeholder: 'opcional' },
    { label: 'Telefone', name: 'telefone',
      default: _maskTelefone(clienteAtual?.telefone || ''),
      placeholder: 'Fixo: (00) 0000-0000 · Celular: (00) 00000-0000',
      onInput: v => _maskTelefone(v) },

    // Bloco de endereço — CEP dispara busca ViaCEP automática
    { label: 'CEP', name: 'cep', default: clienteAtual?.cep || '', placeholder: '00000-000 — preenche automaticamente os demais',
      onChange: async (val, ctx) => {
        const dados = await _buscarCep(val);
        if (dados) {
          ctx.setByName('logradouro', dados.logradouro);
          ctx.setByName('bairro', dados.bairro);
          ctx.setByName('cidade', dados.cidade);
          ctx.setByName('estado', dados.estado);
          if (typeof toast === 'function') toast('Endereço encontrado', dados.cidade + '/' + dados.estado, 'success');
        } else if (String(val || '').replace(/\D/g, '').length === 8) {
          if (typeof toast === 'function') toast('CEP não encontrado', 'Preencha manualmente', 'info');
        }
      }
    },
    { label: 'Logradouro (rua/av)', name: 'logradouro', default: clienteAtual?.logradouro || '', placeholder: 'preenchido pelo CEP' },
    { label: 'Número', name: 'numero', default: clienteAtual?.numero || '', placeholder: 'manual' },
    { label: 'Complemento', name: 'complemento', default: clienteAtual?.complemento || '', placeholder: 'manual (sala, bloco, andar, etc.)' },
    { label: 'Bairro', name: 'bairro', default: clienteAtual?.bairro || '', placeholder: 'preenchido pelo CEP' },
    { label: 'Cidade', name: 'cidade', default: clienteAtual?.cidade || '', placeholder: 'preenchido pelo CEP' },
    { label: 'Estado (UF)', name: 'estado', default: clienteAtual?.estado || '', placeholder: 'preenchido pelo CEP', maxlength: 2 },

    { label: 'Observações', name: 'observacoes', default: clienteAtual?.observacoes || '' },
    { label: 'Ativo', name: 'ativo', type: 'checkbox', default: clienteAtual ? clienteAtual.ativo !== false : true }
  ];

  const intro = enderecoLegacy
    ? `Endereço legado (string única): <em>${escapeHtml(enderecoLegacy)}</em><br>Re-preencha pelos campos novos pra organizar.`
    : 'Digite o CEP primeiro — logradouro, bairro, cidade e estado preenchem automaticamente.';

  const r = await showModal(isEdit ? 'Editar cliente' : 'Novo cliente', fields, {
    confirmLabel: isEdit ? 'Salvar' : 'Cadastrar',
    intro
  });
  if (!r) return;
  const [nome, tipoPessoa, cpfCnpj, email, telefone, cep, logradouro, numero, complemento, bairro, cidade, estado, observacoes, ativo] = r;

  if (!nome?.trim()) { toast('Nome obrigatório', '', 'error'); return; }
  if (!_validarCpfCnpj(cpfCnpj)) { toast('CPF/CNPJ inválido', 'Use 11 dígitos pra CPF ou 14 pra CNPJ.', 'error'); return; }
  if (!_validarEmail(email)) { toast('Email inválido', '', 'error'); return; }

  // Dedup por nome (case-insensitive). Se editando, ignora o próprio.
  const clientes = await DB.getAllClientes();
  const dup = _findClienteByNome(clientes, nome.trim());
  if (dup && (!isEdit || dup.id !== clienteAtual.id)) {
    const ok = await confirmDialog('Cliente com nome similar já existe',
      `Já existe um cliente "${escapeHtml(dup.nome)}". Cadastrar mesmo assim como duplicata?`, true);
    if (!ok) return;
  }

  const cliente = {
    id: clienteAtual?.id || uid(),
    nome: nome.trim().toUpperCase(),
    tipoPessoa: tipoPessoa || 'PJ',
    cpfCnpj: _maskCpfCnpj((cpfCnpj || '').trim()) || null,
    email: (email || '').trim() || null,
    telefone: _maskTelefone((telefone || '').trim()) || null,
    cep: (cep || '').trim() || null,
    logradouro: (logradouro || '').trim() || null,
    numero: (numero || '').trim() || null,
    complemento: (complemento || '').trim() || null,
    bairro: (bairro || '').trim() || null,
    cidade: (cidade || '').trim() || null,
    estado: ((estado || '').trim() || null)?.toUpperCase() || null,
    observacoes: (observacoes || '').trim() || null,
    ativo: !!ativo,
    createdAt: clienteAtual?.createdAt || Date.now()
  };
  // Compat: gera endereco string composto pra quem ainda lê o campo antigo
  cliente.endereco = _composeEndereco(cliente) || null;

  await DB.saveCliente(cliente);
  toast(isEdit ? 'Cliente atualizado' : 'Cliente cadastrado', cliente.nome, 'success');
  renderClientesList();
}

async function removerCliente(id) {
  const [clientes, processos, honorarios] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses(), DB.getAllHonorarios()
  ]);
  const c = clientes.find(x => x.id === id);
  if (!c) return;
  const temProc = processos.some(p => p.clienteId === id);
  const temHon = honorarios.some(h => h.clienteId === id);
  if (temProc || temHon) {
    toast('Cliente vinculado', `${temProc ? 'tem processos' : ''}${temProc && temHon ? ' e ' : ''}${temHon ? 'tem honorários' : ''}. Marque como inativo em vez de remover.`, 'error');
    return;
  }
  const ok = await confirmDialog('Remover cliente?', `${escapeHtml(c.nome)} será apagado. Ação irreversível.`, true);
  if (!ok) return;
  await DB.deleteCliente(id);
  renderClientesList();
}

async function novaComunicacaoFlow(opts) {
  if (typeof opts === 'string') opts = { clienteIdFixo: opts };
  const { clienteIdFixo, processoIdFixo } = opts || {};
  const [clientes, processos] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses()
  ]);
  if (clientes.length === 0) {
    toast('Cadastre um cliente primeiro', '', 'error');
    return;
  }

  const cliOpts = clientes.filter(c => c.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'))
    .map(c => ({ value: c.id, label: c.nome }));

  const me = (window.UC_Auth?.getUser?.() || {}).email || '';
  const meuNome = defaultAdvogado(me) || '';

  const procsDoCli = clienteIdFixo
    ? processos.filter(p => p.clienteId === clienteIdFixo)
    : [];
  const procOpts = [
    { value: '', label: '— sem processo específico —' },
    ...procsDoCli.map(p => ({
      value: p.id, label: (p.cnj ? p.cnj + ' · ' : '') + (p.name || '—')
    }))
  ];

  const agora = new Date();
  agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
  const agoraISO = agora.toISOString().slice(0, 16); // datetime-local format

  const fields = [
    ...(clienteIdFixo ? [] : [
      { label: 'Cliente', name: 'clienteId', type: 'select', default: '',
        options: [{ value: '', label: '— escolher —' }, ...cliOpts] }
    ]),
    { label: 'Tipo', name: 'tipo', type: 'select', default: 'telefone',
      options: COMUNICACAO_TIPOS.map(t => ({ value: t.value, label: t.icon + ' ' + t.label })) },
    { label: 'Direção', name: 'direcao', type: 'select', default: 'bidirecional',
      options: COMUNICACAO_DIRECOES.map(d => ({ value: d.value, label: d.icon + ' ' + d.label })) },
    { label: 'Data e hora', name: 'dataHora', type: 'datetime-local', default: agoraISO },
    { label: 'Responsável (advogado)', name: 'responsavel', type: 'select', default: meuNome,
      options: [{ value: '', label: '— não atribuído —' }, ...ADVOGADOS.map(n => ({ value: n, label: n }))] },
    { label: 'Processo vinculado (opcional)', name: 'processoId', type: 'select', default: processoIdFixo || '', options: procOpts },
    { label: 'Resumo (uma linha)', name: 'resumo', placeholder: 'Ex: Negociação parcelamento · Dúvida sobre prazo · Confirmação documentos' },
    { label: 'Conteúdo / detalhes', name: 'conteudo', type: 'textarea', rows: 5, placeholder: 'O que foi tratado em detalhes…' },
    { label: 'Próxima ação (opcional)', name: 'proximaAcao', placeholder: 'Ex: Enviar minuta · Ligar pra confirmar · Reunião dia X' },
    { label: 'Data da próxima ação', name: 'proximaAcaoData', type: 'date', default: '' }
  ];

  const intro = clienteIdFixo
    ? `Cliente: <strong>${escapeHtml((clientes.find(c => c.id === clienteIdFixo) || {}).nome || '—')}</strong>`
    : 'Vincule a comunicação a um cliente. Histórico fica visível no dashboard do cliente.';

  const r = await showModal('Nova comunicação', fields, { confirmLabel: 'Registrar', intro });
  if (!r) return;

  let clienteId, tipo, direcao, dataHora, responsavel, processoId, resumo, conteudo, proximaAcao, proximaAcaoData;
  if (clienteIdFixo) {
    [tipo, direcao, dataHora, responsavel, processoId, resumo, conteudo, proximaAcao, proximaAcaoData] = r;
    clienteId = clienteIdFixo;
  } else {
    [clienteId, tipo, direcao, dataHora, responsavel, processoId, resumo, conteudo, proximaAcao, proximaAcaoData] = r;
  }

  if (!clienteId) { toast('Escolha um cliente', '', 'error'); return; }
  if (!resumo?.trim()) { toast('Resumo obrigatório', '', 'error'); return; }

  const cli = clientes.find(c => c.id === clienteId);
  await DB.saveComunicacao({
    id: uid(),
    clienteId,
    clienteNome: cli?.nome || '',
    tipo: tipo || 'outro',
    direcao: direcao || 'bidirecional',
    dataHora: dataHora ? new Date(dataHora).toISOString() : new Date().toISOString(),
    responsavel: responsavel || null,
    processoId: processoId || null,
    resumo: resumo.trim(),
    conteudo: (conteudo || '').trim(),
    proximaAcao: (proximaAcao || '').trim() || null,
    proximaAcaoData: proximaAcaoData || null,
    proximaAcaoFeita: false,
    createdAt: Date.now()
  });
  toast('Comunicação registrada', resumo.trim().slice(0, 60), 'success');

  if (state.currentRoute === 'clienteDetalhe') renderClienteDetalhe();
  else if (state.currentRoute === 'process') {
    state._processView.honorarios = await DB.getHonorariosByProcess(state.currentProcessId);
    renderProcessTabContent();
  }
}

      options: COMUNICACAO_TIPOS.map(t => ({ value: t.value, label: t.icon + ' ' + t.label })) },
    { label: 'Direção', name: 'direcao', type: 'select', default: c.direcao || 'bidirecional',
      options: COMUNICACAO_DIRECOES.map(d => ({ value: d.value, label: d.icon + ' ' + d.label })) },
    { label: 'Data e hora', name: 'dataHora', type: 'datetime-local', default: dataHoraLocal },
    { label: 'Responsável', name: 'responsavel', type: 'select', default: c.responsavel || '',
      options: [{ value: '', label: '— não atribuído —' }, ...ADVOGADOS.map(n => ({ value: n, label: n }))] },
    { label: 'Processo vinculado', name: 'processoId', type: 'select', default: c.processoId || '', options: procOpts },
    { label: 'Resumo', name: 'resumo', default: c.resumo || '' },
    { label: 'Conteúdo / detalhes', name: 'conteudo', type: 'textarea', rows: 5, default: c.conteudo || '' },
    { label: 'Próxima ação', name: 'proximaAcao', default: c.proximaAcao || '' },
    { label: 'Data da próxima ação', name: 'proximaAcaoData', type: 'date', default: c.proximaAcaoData || '' }
  ], { confirmLabel: 'Salvar' });
  if (!r) return;
  const [tipo, direcao, dataHora, responsavel, processoId, resumo, conteudo, proximaAcao, proximaAcaoData] = r;
  if (!resumo?.trim()) { toast('Resumo obrigatório', '', 'error'); return; }
  Object.assign(c, {
    tipo, direcao,
    dataHora: dataHora ? new Date(dataHora).toISOString() : c.dataHora,
    responsavel: responsavel || null,
    processoId: processoId || null,
    resumo: resumo.trim(),
    conteudo: (conteudo || '').trim(),
    proximaAcao: (proximaAcao || '').trim() || null,
    proximaAcaoData: proximaAcaoData || null
  });
  await DB.saveComunicacao(c);
  toast('Comunicação atualizada', '', 'success');
  if (state.currentRoute === 'clienteDetalhe') renderClienteDetalhe();
}

async function marcarProximaAcaoFeita(id) {
  const comunicacoes = await DB.getAllComunicacoes();
  const c = comunicacoes.find(x => x.id === id);
  if (!c) return;
  c.proximaAcaoFeita = true;
  c.proximaAcaoFeitaEm = Date.now();
  await DB.saveComunicacao(c);
  toast('Próxima ação marcada como feita', '', 'success');
  if (state.currentRoute === 'clienteDetalhe') renderClienteDetalhe();
}

async function reabrirProximaAcao(id) {
  const comunicacoes = await DB.getAllComunicacoes();
  const c = comunicacoes.find(x => x.id === id);
  if (!c) return;
  c.proximaAcaoFeita = false;
  delete c.proximaAcaoFeitaEm;
  await DB.saveComunicacao(c);
  toast('Ação reaberta', '', 'info');
  if (state.currentRoute === 'clienteDetalhe') renderClienteDetalhe();
}

async function removerComunicacao(id) {
  const ok = await confirmDialog('Remover comunicação?', 'Ação irreversível.', true);
  if (!ok) return;
  await DB.deleteComunicacao(id);
  if (state.currentRoute === 'clienteDetalhe') renderClienteDetalhe();
}

// Renderiza HTML da seção "Comunicações" pra um cliente.
// Usado dentro de renderClienteDetalhe.
function renderClienteComunicacoesSection(cli, comunicacoes, processos) {
  const procById = {}; processos.forEach(p => procById[p.id] = p);
  const hoje = new Date().toISOString().slice(0, 10);

  // Pendentes: tem proximaAcao + não foi feita ainda
  const pendentes = comunicacoes.filter(c => c.proximaAcao && !c.proximaAcaoFeita)
    .sort((a, b) => (a.proximaAcaoData || '9999').localeCompare(b.proximaAcaoData || '9999'));

  // Ordena cronologicamente desc por dataHora
  const ordenadas = [...comunicacoes]
    .sort((a, b) => (b.dataHora || '').localeCompare(a.dataHora || ''));

  return `
    <div class="card mb-3">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-serif text-lg font-semibold smallcaps" style="color: var(--uc-black);">Comunicação</h3>
        <button class="btn btn-primary btn-sm" onclick="novaComunicacaoFlow({ clienteIdFixo: '${cli.id}' })">+ Nova comunicação</button>
      </div>

      ${pendentes.length > 0 ? `
        <div style="background: var(--uc-amber-soft, #f5e3c4); border-left: 3px solid var(--uc-amber); padding: 10px 12px; border-radius: 4px; margin-bottom: 12px;">
          <p class="text-xs smallcaps" style="color: var(--uc-amber); margin: 0 0 6px; font-weight: 600;">🔔 ${pendentes.length} próxima(s) ação(ões) pendente(s)</p>
          ${pendentes.slice(0, 5).map(c => {
            const venceu = c.proximaAcaoData && c.proximaAcaoData < hoje;
            return `
              <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px;">
                <div style="flex: 1; min-width: 0;">
                  <strong>${escapeHtml(c.proximaAcao)}</strong>
                  ${c.proximaAcaoData ? `<span style="color: ${venceu ? 'var(--uc-red)' : 'var(--uc-warm-gray)'}; margin-left: 6px;">${venceu ? '⚠ vencida ' : ''}${formatDate(c.proximaAcaoData)}</span>` : ''}
                  ${c.responsavel ? `<span style="color: var(--uc-warm-gray); margin-left: 6px;">· ${escapeHtml(c.responsavel.split(' ')[0])}</span>` : ''}
                </div>
                <button class="btn btn-ghost btn-sm" onclick="marcarProximaAcaoFeita('${c.id}')" style="padding: 2px 8px; font-size: 11px;">✓ feita</button>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}

      ${ordenadas.length === 0 ? `
        <p class="help-text">Nenhuma comunicação registrada com este cliente. Use o botão acima para registrar email, ligação, reunião, etc.</p>
      ` : `
        <div style="display: flex; flex-direction: column; gap: 8px;">
          ${ordenadas.slice(0, 30).map(c => {
            const tipo = _comTipoMeta(c.tipo);
            const dir = _comDirecaoMeta(c.direcao);
            const proc = c.processoId ? procById[c.processoId] : null;
            const isVencida = c.proximaAcao && !c.proximaAcaoFeita && c.proximaAcaoData && c.proximaAcaoData < hoje;
            return `
              <div class="card" style="background: var(--uc-cream); padding: 12px; border-left: 3px solid ${isVencida ? 'var(--uc-red)' : 'var(--uc-line-soft)'};">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px;">
                  <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 11px; color: var(--uc-warm-gray); margin-bottom: 2px;">
                      <span title="${escapeHtml(tipo.label)}">${tipo.icon} ${escapeHtml(tipo.label)}</span>
                      <span style="margin: 0 6px;" title="${escapeHtml(dir.label)}">${dir.icon}</span>
                      · ${formatDateTime(c.dataHora)}
                      ${c.responsavel ? ` · <strong>${escapeHtml(c.responsavel.split(' ')[0])}</strong>` : ''}
                      ${proc ? ` · <a onclick="navigate('process', { currentProcessId: '${proc.id}' })" style="cursor: pointer; color: var(--uc-gold);">${escapeHtml(proc.cnj || proc.name || 'processo')}</a>` : ''}
                    </div>
                    <div style="font-weight: 600; color: var(--uc-black);">${escapeHtml(c.resumo)}</div>
                    ${c.conteudo ? `<details style="margin-top: 6px;"><summary style="font-size: 11px; color: var(--uc-warm-gray); cursor: pointer;">📝 ler detalhes</summary><div style="font-size: 12px; color: var(--uc-graphite); padding: 6px 0; white-space: pre-wrap; line-height: 1.5;">${escapeHtml(c.conteudo)}</div></details>` : ''}
                    ${c.proximaAcao ? `
                      <div style="margin-top: 6px; padding: 6px 8px; background: ${c.proximaAcaoFeita ? 'var(--uc-green-soft)' : 'var(--uc-paper)'}; border-radius: 3px; font-size: 12px;">
                        <span style="color: ${c.proximaAcaoFeita ? 'var(--uc-green)' : 'var(--uc-amber)'};">
                          ${c.proximaAcaoFeita ? '✓' : '🔔'} <strong>Próxima ação:</strong> ${escapeHtml(c.proximaAcao)}
                          ${c.proximaAcaoData ? `<span style="margin-left: 4px; color: ${isVencida ? 'var(--uc-red)' : 'var(--uc-warm-gray)'};">${isVencida ? '(vencida ' : '('}${formatDate(c.proximaAcaoData)})</span>` : ''}
                        </span>
                        ${c.proximaAcaoFeita
                          ? `<button class="btn btn-ghost btn-sm" onclick="reabrirProximaAcao('${c.id}')" style="padding: 1px 6px; font-size: 10px; margin-left: 6px;">↶ reabrir</button>`
                          : `<button class="btn btn-ghost btn-sm" onclick="marcarProximaAcaoFeita('${c.id}')" style="padding: 1px 6px; font-size: 10px; margin-left: 6px;">✓ feita</button>`
                        }
                      </div>
                    ` : ''}
                  </div>
                  <div style="display: flex; gap: 2px; flex-shrink: 0;">
                    <button class="btn btn-ghost btn-sm" onclick="editarComunicacao('${c.id}')" title="Editar" style="padding: 2px 6px;">✎</button>
                    <button class="btn btn-ghost btn-sm" onclick="removerComunicacao('${c.id}')" title="Remover" style="padding: 2px 6px;">🗑</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
          ${ordenadas.length > 30 ? `<p class="help-text">Mostrando 30 mais recentes de ${ordenadas.length} · futura paginação</p>` : ''}
        </div>
      `}
    </div>
  `;
}

async function renderClienteDetalhe() {
  const cid = state.currentClienteId;
  if (!cid) { navigate('clientes'); return; }
  const [clientes, processos, honorarios, transacoes] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses(), DB.getAllHonorarios(), DB.getAllTransacoes()
  ]);
  // Comunicações: resiliente — se rules não foram deployadas ainda,
  // get falha com PERMISSION_DENIED. Aí mostra seção vazia + warn no console.
  let comunicacoes = [];
  try {
    comunicacoes = await DB.getComunicacoesByCliente(cid);
  } catch (e) {
    console.warn('[comunicacoes] falha ao buscar:', e?.message || e);
    if (typeof toast === 'function') {
      toast('Comunicações indisponíveis', 'Rode firebase deploy --only firestore:rules', 'error');
    }
  }
  let compromissosCli = [];
  try {
    compromissosCli = await DB.getCompromissosByCliente(cid);
  } catch (e) {
    console.warn('[compromissos] falha ao buscar:', e?.message || e);
  }
  const cli = clientes.find(c => c.id === cid);
  if (!cli) {
    toast('Cliente não encontrado', '', 'error');

    return;

    .sort((a, b) => (b.createdAt || b.criadoEm || 0) - (a.createdAt || a.criadoEm || 0));

// Limpeza em massa — apaga TODOS os clientes + desvincula clienteId de
// todos os processos. Util quando a migração lazy criou registros que
// não condizem com a realidade (ex.: 'A definir', strings vazias).
// Liga setting migracaoClientesDesligada=true pra não recriar no
// próximo abre.
async function limparClientesEDesligarMigracao() {
  const [clientes, processos, honorarios] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses(), DB.getAllHonorarios()
  ]);
  if (clientes.length === 0) {
    toast('Nada a limpar', 'Não há clientes cadastrados.', 'info');
    return;
  }
  const procsVinculados = processos.filter(p => p.clienteId).length;
  const honsVinculados = honorarios.filter(h => h.clienteId).length;

  const aviso = `
    Esta ação vai:
    <ul style="margin: 8px 0 8px 20px;">
      <li>Apagar <strong>${clientes.length} cliente(s)</strong></li>
      <li>Desvincular <strong>${procsVinculados} processo(s)</strong> (campo clienteId)</li>
      ${honsVinculados > 0 ? `<li>⚠ <strong>${honsVinculados} honorário(s)</strong> ficam órfãos (clienteId apaga, mas o honorário fica)</li>` : ''}
      <li>Desligar a migração automática para não recriar no próximo abre</li>
    </ul>
    Use para limpar dados ruins da migração lazy. Cadastre os clientes reais manualmente depois.
    Continuar?
  `;
  const ok = await confirmDialog('Limpar todos os clientes?', aviso, true);
  if (!ok) return;

  let apagadosClientes = 0, processosLimpos = 0, honorariosLimpos = 0, erros = 0;

  // 1. Limpa clienteId dos processos
  for (const p of processos.filter(x => x.clienteId)) {
    try {
      delete p.clienteId;
      await DB.saveProcess(p);
      processosLimpos++;
    } catch (e) { console.warn('falha ao limpar processo', p.id, e); erros++; }
  }

  // 2. Limpa clienteId dos honorários (mas mantém o honorário)
  for (const h of honorarios.filter(x => x.clienteId)) {
    try {
      delete h.clienteId;
      await DB.saveHonorario(h);
      honorariosLimpos++;
    } catch (e) { console.warn('falha ao limpar honorário', h.id, e); erros++; }
  }

  // 3. Apaga todos os clientes
  for (const c of clientes) {
    try {
      await DB.deleteCliente(c.id);
      apagadosClientes++;
    } catch (e) { console.warn('falha ao apagar cliente', c.id, e); erros++; }
  }

  // 4. Desliga migração automática
  await DB.setSetting('migracaoClientesDesligada', true);

  toast('Limpeza concluída',
    `${apagadosClientes} cliente(s) apagado(s) · ${processosLimpos} processo(s) desvinculado(s)${erros > 0 ? ' · ' + erros + ' erro(s)' : ''}`,
    erros > 0 ? 'error' : 'success');

  // Re-render onde estiver
  if (state.currentRoute === 'clientes') renderClientesList();
  else if (state.currentRoute === 'settings') renderSettings();
}

// Reabilita a migração automática (desfaz o efeito de limparClientesEDesligarMigracao).
// Disponível em window pra poder chamar do console; também acessível via UI.
async function reabilitarMigracaoClientes() {
  await DB.setSetting('migracaoClientesDesligada', false);
  toast('Migração reabilitada', 'Próximo abre de /clientes vai recriar clientes a partir de processos sem vínculo.', 'success');
  if (state.currentRoute === 'settings') renderSettings();
}

    const cleanup = () => modal.remove();
    document.getElementById('_npCancel').onclick = () => { cleanup(); resolve(null); };

      const name = document.getElementById('newProcessName').value.trim();
      const cnj = document.getElementById('newProcessCnj').value.trim();
      const clienteId = document.getElementById('newProcessClienteId').value;
      // Resolve nome do cliente via lookup (snapshot pra compat com código que ainda lê p.client)
      const cliEscolhido = clientesAtivos.find(c => c.id === clienteId)
        || (await DB.getAllClientes()).find(c => c.id === clienteId);
      const client = cliEscolhido?.nome || '';
      const court = document.getElementById('newProcessCourt').value.trim();
      const area = document.getElementById('newProcessArea').value;
      const type = document.getElementById('newProcessType').value.trim();
      const polo = document.getElementById('newProcessPolo').value;

      const advogadoSuplente = document.getElementById('newProcessSuplente').value.trim();
      const risco = document.getElementById('newProcessRisk').value;

      if (!name) {
        toast('Nome obrigatório', 'Informe ao menos o nome do processo.', 'error');
        return;
      }

      // Prevenção de duplicata: por CNJ (se houver) ou por nome
      const candidate = { name, cnj: cnj || null };
      const candidateKey = processDedupKey(candidate);
      const existing = (await DB.getAllProcesses()).find(x => processDedupKey(x) === candidateKey);
      if (existing) {
        const labelExist = existing.cnj
          ? `Já existe um processo com o CNJ <strong>${escapeHtml(existing.cnj)}</strong>: <em>${escapeHtml(existing.name)}</em>.`
          : `Já existe um processo com nome <em>${escapeHtml(existing.name)}</em>.`;
        const action = await new Promise(resolve => {
          const m = document.createElement('div');
          m.className = 'modal-backdrop';
          m.innerHTML = `
            <div class="modal">
              <h3 class="modal-title">Possível duplicata</h3>
              <p style="color: var(--uc-graphite); font-size: 14px; margin-bottom: 16px;">${labelExist}</p>
              <p class="help-text" style="margin-bottom: 16px;">O que deseja fazer?</p>
              <div class="flex flex-col gap-2">
                <button class="btn btn-primary" id="_dupOpen">Abrir o existente</button>
                <button class="btn btn-outline" id="_dupCreate">Criar duplicata mesmo assim</button>
                <button class="btn btn-ghost" id="_dupCancel">Cancelar</button>
              </div>
            </div>`;
          document.body.appendChild(m);
          m.querySelector('#_dupOpen').onclick = () => { m.remove(); resolve('open'); };
          m.querySelector('#_dupCreate').onclick = () => { m.remove(); resolve('create'); };
          m.querySelector('#_dupCancel').onclick = () => { m.remove(); resolve('cancel'); };
        });
        if (action === 'cancel') return;
        if (action === 'open') {
          cleanup();
          navigate('process', { currentProcessId: existing.id });
          resolve(existing);
          return;
        }
        // 'create' segue o fluxo abaixo
      }

      const p = {
        id: uid(),
        name,
        cnj: cnj || null,
        clienteId: clienteId || null,
        client: client || null,                    // snapshot do nome (compat)
        court: court || null,
        area,
        type: type || null,
        polo,
        advogadoResponsavel: advogadoResponsavel || null,
        advogadoSuplente: advogadoSuplente || null,
        risco: risco || null,
        status: 'active',
        eventCount: 0,
        noteCount: 0,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      // Se tem dados do DataJud carregados na sessão, anexa
      if (cnj && datajudCache.has(cnj.replace(/\D/g, ''))) {
        const dj = datajudCache.get(cnj.replace(/\D/g, ''));
        p.datajudLastSync = Date.now();
        p.datajudData = {
          classe: dj.classe,
          assuntos: dj.assuntos,
          valorCausa: dj.valorCausa,
          dataAjuizamento: dj.dataAjuizamento,
          sistema: dj.sistema,
          grau: dj.grau,
          formato: dj.formato,
          movimentos: dj.movimentos
        };
      }

      await DB.saveProcess(p);

      // Se tem dados do DataJud, cria eventos automaticamente das movimentações
      if (p.datajudData && p.datajudData.movimentos) {
        for (const mov of p.datajudData.movimentos.slice(0, 30)) {
          const event = {
            id: uid(),
            processId: p.id,
            eventNumber: 'DJ-' + (mov.data || ''),
            type: mov.nome,
            date: mov.data ? formatDate(mov.data) : '',
            startPage: 0, endPage: 0, pageCount: 0,
            sourceFile: 'DataJud',
            datajudCodigo: mov.codigo,
            complemento: mov.complemento,
            addedAt: Date.now()
          };
          await DB.saveEvent(event);
        }
      }

      cleanup();
      toast('Processo cadastrado', name, 'success');
      navigate('process', { currentProcessId: p.id });
      resolve(p);
    };

    document.getElementById('newProcessName').focus();
  });
}

// Helper inline pra cadastrar cliente sem fechar o modal de novo processo.
// Após salvar, repopula o select de clientes e seleciona o recém-criado.
async function _npNovoClienteInline() {
  // Lembra valores atuais do form (não perder ao reabrir o select)
  const sel = document.getElementById('newProcessClienteId');
  const valorAnterior = sel?.value || '';

  // Abre modal de cadastro normal de cliente. Depois de salvar, atualiza select.
  // _formClienteFlow re-renderiza /clientes ao terminar; aqui ignoramos isso.
  await _formClienteFlow(null);

  // Recarrega clientes e atualiza o select do form de processo
  if (sel) {
    const clientes = await DB.getAllClientes();
    const ativos = clientes.filter(c => c.ativo !== false)
      .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
    // Cliente novo é o mais recente (createdAt maior)
    const novo = clientes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
    sel.innerHTML = [
      '<option value="">— escolher cliente —</option>',
      ...ativos.map(c => `<option value="${escapeHtml(c.id)}" ${c.id === (novo?.id || valorAnterior) ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`)
    ].join('');
  }
}
