// ====================================================================
// State machine de prazos — Sprint 3 Fase A (Módulo Prazos)
// ====================================================================
// Estados persistidos:
//   pendente   — prazo ativo, ainda não resolvido
//   cumprido   — TERMINAL: advogado confirmou (data + protocolo obrigatórios)
//   perdido    — TERMINAL: data fatal expirou sem cumprimento (auto T+1)
//   suspenso   — pausa; reabre por data ou ação manual
//   cancelado  — TERMINAL: anulado com justificativa (não some do registro)
//
// Status visual derivado em recomputarStatusVisual(d, today):
//   pendente  + days <  0  → 'expirado' (auto-perdido pega depois)
//   pendente  + days <= 1  → 'iminente'
//   pendente  + days <= 7  → 'vincendo'
//
// Vincendo/iminente/expirado NUNCA são persistidos — derivam de deadlineDate.
const STATUS_PRAZO = Object.freeze({
  PENDENTE:  'pendente',
  CUMPRIDO:  'cumprido',
  PERDIDO:   'perdido',
  SUSPENSO:  'suspenso',
  CANCELADO: 'cancelado'
});

const STATUS_TERMINAIS = new Set([STATUS_PRAZO.CUMPRIDO, STATUS_PRAZO.PERDIDO, STATUS_PRAZO.CANCELADO]);

// Migração lazy: normaliza prazos antigos (status 'done'/'pending') em leitura.
// Idempotente — chamar quantas vezes precisar sem efeito colateral.
function migrarPrazoLegacy(d) {
  if (!d) return d;
  if (d.status === 'done') {
    d.status = STATUS_PRAZO.CUMPRIDO;
    if (d.completedAt && !d.cumprimento) {
      d.cumprimento = {
        dataCumprimento: new Date(d.completedAt).toISOString().slice(0,10),
        numeroProtocolo: '(legado — não registrado)',
        registradoEm: d.completedAt
      };
    }
  } else if (d.status === 'pending' || d.status == null) {
    d.status = STATUS_PRAZO.PENDENTE;
  }
  if (!Array.isArray(d.logs)) d.logs = [];
  return d;
}

function prazoEstaResolvido(d) {
  return STATUS_TERMINAIS.has(d.status);
}
function prazoEstaAtivo(d) {
  return !prazoEstaResolvido(d);
}

function recomputarStatusVisual(d, today) {
  if (!today) { today = new Date(); today.setHours(0,0,0,0); }
  if (d.status === STATUS_PRAZO.CUMPRIDO)  return 'cumprido';
  if (d.status === STATUS_PRAZO.CANCELADO) return 'cancelado';
  if (d.status === STATUS_PRAZO.PERDIDO)   return 'perdido';
  if (d.status === STATUS_PRAZO.SUSPENSO)  return 'suspenso';
  // pendente — deriva pela proximidade
  const dl = new Date(d.deadlineDate);
  const days = Math.ceil((dl - today) / 86400000);
  if (days < 0)  return 'expirado';
  if (days <= 1) return 'iminente';
  if (days <= 7) return 'vincendo';
  return 'pendente';
}

function appendLogPrazo(d, evento, payload, ator) {
  if (!Array.isArray(d.logs)) d.logs = [];
  d.logs.push({
    evento,
    payload: payload || {},
    ator: ator || 'sistema',
    timestamp: Date.now()
  });
}

// Mapeia evento técnico → label humano (para o histórico expansível na linha do prazo).
const LOG_EVENTO_LABEL = {
  criado:        '📝 criado',
  cumprido:      '✓ cumprido',
  suspenso:      '⏸ suspenso',
  reaberto:      '▶ reaberto',
  cancelado:     '⊘ cancelado',
  auto_perdido:  '✗ perdido (auto)',
  perdido:       '✗ perdido',
  status_alterado: '↻ alterado'
};

function descreverLogEntry(entry) {
  const label = LOG_EVENTO_LABEL[entry.evento] || entry.evento;
  const partes = [label];
  if (entry.payload?.numeroProtocolo) partes.push('protocolo ' + entry.payload.numeroProtocolo);
  if (entry.payload?.motivo)          partes.push('"' + entry.payload.motivo + '"');
  if (entry.payload?.dataFatal)       partes.push('data fatal ' + entry.payload.dataFatal);
  if (entry.payload?.ate)             partes.push('até ' + entry.payload.ate);
  return partes.join(' · ');
}

// Auto-marca como "perdido" todo prazo pendente cuja data fatal já passou.
// Idempotente — prazos suspensos/cumpridos/cancelados/perdidos não são tocados.
async function autoMarcarPerdidos() {
  const today = new Date(); today.setHours(0,0,0,0);
  const all = await DB.getAllDeadlines();
  const expirados = all.filter(d =>
    d.status === STATUS_PRAZO.PENDENTE &&
    new Date(d.deadlineDate) < today
  );
  let marcados = 0;
  for (const d of expirados) {
    d.status = STATUS_PRAZO.PERDIDO;
    d.updatedAt = Date.now();
    appendLogPrazo(d, 'auto_perdido', { dataFatal: d.deadlineDate });
    try {
      await DB.saveDeadline(d);
      marcados++;
    } catch (e) {
      console.warn('Falha ao marcar perdido', d.id, e);
    }
  }
  if (marcados > 0) {
    // Atualiza state em memória se já tiver carregado
    if (Array.isArray(state.deadlines)) {
      state.deadlines.forEach(sd => {
        const m = expirados.find(e => e.id === sd.id);
        if (m) Object.assign(sd, m);
      });
    }
    if (typeof toast === 'function') {
      toast(`${marcados} prazo(s) marcado(s) como perdido(s)`, 'data fatal expirou sem cumprimento', 'error');
    }
  }
  return marcados;
}

// Renderiza banner sticky no topo do app quando há prazos iminentes ou perdidos.
// Chamado por updateNavBadges() — único ponto de orquestração da UI dos prazos.
function renderBannerPrazos() {
  let banner = document.getElementById('uc-banner-prazos');
  const today = new Date(); today.setHours(0,0,0,0);
  const ativos = (state.deadlines || []).filter(prazoEstaAtivo);
  const iminentes = ativos.filter(d => recomputarStatusVisual(d, today) === 'iminente');
  const expirados = ativos.filter(d => recomputarStatusVisual(d, today) === 'expirado');
  const perdidos = (state.deadlines || []).filter(d => d.status === STATUS_PRAZO.PERDIDO);

  // Suprime banner se usuário fechou nesta sessão E nada novo apareceu
  const fechadoNestaSessao = sessionStorage.getItem('uc-banner-prazos-fechado') === '1';
  const totalUrgente = iminentes.length + expirados.length;
  if ((totalUrgente === 0 && perdidos.length === 0) || fechadoNestaSessao) {
    if (banner) banner.remove();
    return;
  }

  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'uc-banner-prazos';
    banner.style.cssText = 'position:sticky;top:0;z-index:50;background:var(--uc-red,#a82a2a);color:white;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.18);';
    const main = document.querySelector('.main-content');
    if (main) main.insertBefore(banner, main.firstChild);
    else document.body.insertBefore(banner, document.body.firstChild);
  }

  const partes = [];
  if (expirados.length) partes.push(`<strong>${expirados.length}</strong> expirado(s)`);
  if (iminentes.length) partes.push(`<strong>${iminentes.length}</strong> iminente(s) (≤1d)`);
  if (perdidos.length)  partes.push(`<strong>${perdidos.length}</strong> perdido(s)`);

  banner.innerHTML = `
    <span style="font-size:18px;">⚠</span>
    <span style="flex:1;">${partes.join(' · ')} — clique pra abrir o painel de Prazos</span>
    <button onclick="navigate('deadlines')" style="background:white;color:var(--uc-red,#a82a2a);border:0;padding:4px 12px;border-radius:4px;font-weight:600;cursor:pointer;font-size:12px;">Ver prazos</button>
    <button onclick="(function(){sessionStorage.setItem('uc-banner-prazos-fechado','1');document.getElementById('uc-banner-prazos').remove();})()" title="Esconder até próxima recarga" style="background:transparent;color:white;border:1px solid rgba(255,255,255,.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">×</button>
  `;
  banner.style.cursor = 'default';
}

// ====================================================================
// Lembretes in-app via Web Notifications API — Sprint 3 Fase B.1
// ====================================================================
// Estratégia: o próprio cliente verifica periodicamente (boot + a cada 15min)
// quais prazos entraram em marco T-7..T+1, mapeia destinatários via
// rotearDestinatarios() e dispara Notification do navegador para o usuário
// logado APENAS se ele aparecer na lista de destinatários daquele marco.
// Anti-spam: prazo carrega d.notificado = { 'T-7': { email: timestamp } }.
// Cada email só notifica 1x por marco. Persistido via saveDeadline.
//
// Limitação reconhecida: só funciona com o app aberto OU com PWA instalado
// (browser rodando em background no celular). Sprint B.2 fechará esse gap
// com FCM real (servidor disparando, mesmo com app fechado).

// Função pura — retorna o marco atual do prazo ou null.
// Faixas exclusivas (sem sobreposição):
//   T-7  : 4–7 dias
//   T-3  : 3 dias exatos
//   T-2  : 2 dias exatos
//   T-1  : 1 dia
//   T-0  : hoje
//   T+1  : 1 dia depois (auto_perdido pega depois mas notifica antes)
function marcoDoPrazo(d, hoje) {
  if (!d || !d.deadlineDate) return null;
  if (!prazoEstaAtivo(d)) return null;
  if (d.status === STATUS_PRAZO.SUSPENSO) return null;
  const today = hoje ? new Date(hoje) : (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
  if (hoje) today.setHours(0,0,0,0);
  const dl = new Date(d.deadlineDate);
  const days = Math.ceil((dl - today) / 86400000);
  if (days >= 4 && days <= 7) return 'T-7';
  if (days === 3) return 'T-3';
  if (days === 2) return 'T-2';
  if (days === 1) return 'T-1';
  if (days === 0) return 'T-0';
  if (days === -1) return 'T+1';
  return null;
}

const MARCO_LABELS = {
  'T-7': '⏰ Prazo em ≤7 dias',
  'T-3': '⏰ Prazo em 3 dias',
  'T-2': '⚠ Prazo em 2 dias',
  'T-1': '🚨 Prazo AMANHÃ',
  'T-0': '🚨🚨 Prazo HOJE',
  'T+1': '✗ Prazo VENCEU'
};

// Verifica se o usuário/email já foi notificado pra este marco.
function jaNotificadoNesteMarco(d, marco, email) {
  return !!(d.notificado && d.notificado[marco] && d.notificado[marco][email]);
}

// Pede permissão de notificação ao navegador. Retorna true se concedida.
async function solicitarPermissaoNotificacoes() {
  if (typeof Notification === 'undefined') {
    toast('Notificações não suportadas neste navegador', '', 'error');
    return false;
  }
  if (Notification.permission === 'granted') {
    state.settings.notificacoesAtivas = true;
    await DB.setSetting('notificacoesAtivas', true);
    toast('Notificações já permitidas', '', 'success');
    if (state.currentRoute === 'settings') renderSettings();
    return true;
  }
  if (Notification.permission === 'denied') {
    toast('Notificações bloqueadas', 'Reabilite manualmente em Configurações do navegador → Notificações.', 'error');
    return false;
  }
  const result = await Notification.requestPermission();
  if (result === 'granted') {
    state.settings.notificacoesAtivas = true;
    await DB.setSetting('notificacoesAtivas', true);
    toast('Notificações ativadas', 'Você receberá lembretes em T-7 → T+1', 'success');
    if (state.currentRoute === 'settings') renderSettings();
    // Registra token FCM no backend (push do servidor) + handler foreground
    registrarFcmTokenSeNecessario().catch(err => console.warn('[FCM] registro falhou', err));
    setupFcmForegroundHandler();
    // Roda imediatamente uma checagem após ativar (B.1 in-app)
    verificarLembretesPendentes().catch(err => console.warn(err));
    return true;
  }
  toast('Permissão negada', '', 'info');
  return false;
}

async function alternarNotificacoes(ativo) {
  state.settings.notificacoesAtivas = !!ativo;
  await DB.setSetting('notificacoesAtivas', !!ativo);
  toast(ativo ? 'Notificações ativadas' : 'Notificações pausadas neste dispositivo', '', 'success');
}

// Roda no boot e a cada 15min. Idempotente — anti-spam por marco/email.
async function verificarLembretesPendentes() {
  if (typeof Notification === 'undefined') return 0;
  if (Notification.permission !== 'granted') return 0;
  if (state.settings.notificacoesAtivas === false) return 0;

  const me = (window.UC_Auth?.getUser?.() || {}).email;
  if (!me) return 0;
  const meuNome = defaultAdvogado(me);
  if (!meuNome) return 0; // usuário fora do diretório

  const today = new Date(); today.setHours(0,0,0,0);
  const ausencias = await obterAusencias();
  const socio = await obterSocioPadrao();

  const procById = new Map((state.processes || []).map(p => [p.id, p]));
  const prazos = state.deadlines || [];
  let disparados = 0;

  for (const d of prazos) {
    const marco = marcoDoPrazo(d, today);
    if (!marco) continue;
    if (jaNotificadoNesteMarco(d, marco, me)) continue;

    const proc = procById.get(d.processId);
    if (!proc) continue;

    const titular = proc.advogadoResponsavel;
    const suplente = proc.advogadoSuplente;
    const ausenciaTitular = titular ? ausencias[titular] : null;
    const titularAusente = !!ausenciaTitular &&
      (!ausenciaTitular.ate || new Date(ausenciaTitular.ate + 'T23:59:59') >= today);
    const destinatarios = rotearDestinatarios({ titular, suplente, socio, marco, titularAusente });
    if (!destinatarios.includes(meuNome)) continue;

    // Dispara Notification
    try {
      const title = MARCO_LABELS[marco] || `Prazo · ${marco}`;
      const dl = new Date(d.deadlineDate);
      const body = `${d.description || d.type} · vence ${formatDate(dl)} · ${proc.client || proc.name}`;
      const noti = new Notification(title, {
        body,
        icon: 'icon-192.png',
        tag: `prazo-${d.id}-${marco}`,
        requireInteraction: marco === 'T-1' || marco === 'T-0' || marco === 'T+1',
        data: { processId: proc.id, prazoId: d.id }
      });
      noti.onclick = () => {
        try { window.focus(); } catch(e) {}
        navigate('process', { currentProcessId: proc.id });
        noti.close();
      };

      // Marca notificado por (marco, email)
      d.notificado = d.notificado || {};
      d.notificado[marco] = d.notificado[marco] || {};
      d.notificado[marco][me] = Date.now();
      d.updatedAt = Date.now();
      appendLogPrazo(d, 'lembrete_enviado', { marco, canal: 'web-notification', destinatario: meuNome });
      try {
        await DB.saveDeadline(d);
      } catch (e) {
        console.warn('saveDeadline pós-notificação falhou', d.id, e);
      }
      disparados++;
    } catch (e) {
      console.warn('Falha ao notificar prazo', d.id, marco, e);
    }
  }

  if (disparados > 0) {
    console.log(`[lembretes] ${disparados} notificação(ões) disparadas`);
  }
  return disparados;
}

// ====================================================================
// FCM — push notifications via Firebase (Sprint 3 Fase B.2)
// ====================================================================
// Complementa a B.1 cobrindo o caso de app fechado:
// - Cliente pega token FCM e salva em settings/fcmTokens (Firestore)
// - Backend (Apps Script) lê esses tokens e dispara push via FCM HTTP v1
//   numa rotina horária (trigger time-driven)
// - Service worker dedicado (firebase-messaging-sw.js) recebe o push
//   quando a página está em background e mostra Notification

// Registra/atualiza o token FCM do usuário logado neste dispositivo.
// Idempotente: chamar múltiplas vezes só atualiza lastSeen ou salva
// novo token se o navegador retornou um diferente.
async function registrarFcmTokenSeNecessario() {
  if (typeof Notification === 'undefined') return null;
  if (Notification.permission !== 'granted') return null;
  if (!window.UC_Messaging) {
    console.warn('[FCM] UC_Messaging ainda não carregou');
    return null;
  }
  const supported = await window.UC_Messaging.isSupported();
  if (!supported) {
    console.warn('[FCM] Browser não suporta FCM (Web Push API)');
    return null;
  }

  const me = (window.UC_Auth?.getUser?.() || {}).email;
  if (!me) return null;

  const token = await window.UC_Messaging.getFcmToken();
  if (!token) return null;

  const ua = (navigator.userAgent || '').slice(0, 200);
  const fcmTokens = (await DB.getSetting('fcmTokens', {})) || {};
  const existing = fcmTokens[me];

  if (existing && existing.token === token) {
    // Mesmo token — só atualiza lastSeen (sem flush se diferença <1h)
    if (!existing.lastSeen || Date.now() - existing.lastSeen > 3600 * 1000) {
      fcmTokens[me] = { ...existing, lastSeen: Date.now(), ua };
      await DB.setSetting('fcmTokens', fcmTokens);
    }
  } else {
    fcmTokens[me] = { token, ua, lastSeen: Date.now(), registeredAt: Date.now() };
    await DB.setSetting('fcmTokens', fcmTokens);
    console.log('[FCM] Token registrado/atualizado para', me);
  }
  return token;
}

// Configura handler de mensagem em foreground (app aberto e visível).
// Quando chega um push e o usuário está na aba, mostra notificação local.
// O firebase-messaging-sw.js cuida de quando a aba está em background.
async function setupFcmForegroundHandler() {
  if (!window.UC_Messaging) return;
  try {
    const unsub = await window.UC_Messaging.onForegroundMessage((payload) => {
      const data = payload.data || {};
      const title = data.title || 'UC Jurídico — Prazo';
      const body = data.body || '';
      try {
        const noti = new Notification(title, {
          body,
          icon: 'icon-192.png',
          tag: data.tag || ('fcm-' + Date.now()),
          requireInteraction: data.requireInteraction === 'true',
          data: { url: data.url, processId: data.processId }
        });
        noti.onclick = () => {
          try { window.focus(); } catch(e) {}
          if (data.processId) navigate('process', { currentProcessId: data.processId });
          noti.close();
        };
      } catch (e) {
        console.warn('[FCM] erro ao mostrar notificação foreground', e);
      }
    });
    state._fcmUnsub = typeof unsub === 'function' ? unsub : null;
  } catch (e) {
    console.warn('[FCM] setupFcmForegroundHandler falhou', e);
  }
}

// Recebe mensagens vindas do firebase-messaging-sw.js (notification click
// quando o app já está aberto). Navega pro processo solicitado.
if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || msg.type !== 'uc-navigate') return;
    try {
      const m = String(msg.url || '').match(/#process\/([^/?&#]+)/);
      if (m) {
        navigate('process', { currentProcessId: m[1] });
      } else if (msg.url && msg.url.includes('#')) {
        location.hash = msg.url.split('#')[1];
      }
    } catch (e) {
      console.warn('[FCM] navegação pelo SW falhou', e);
    }
  });
}

  { re: /embargos?\s+de\s+declara[çc][ãa]o[^.]{0,80}?prazo\s+de\s+(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'EMBARGOS_DECL' },

  { re: /embargos?\s+[àa]\s+execu[çc][ãa]o\s+fiscal[^.]{0,80}?(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'EMB_EXEC_FISCAL' },
  // "embargos à execução ... N dias"
  { re: /embargos?\s+[àa]\s+execu[çc][ãa]o[^.]{0,80}?(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'EMB_EXECUCAO' },
  // "contestar em 15 dias" / "apresentar contestação no prazo de 15 dias"
  { re: /(?:contestar|apresentar\s+(?:contesta[çc][ãa]o|resposta))[^.]{0,80}?(?:no\s+)?prazo\s+de\s+(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'CONTESTACAO' },
  // "réplica no prazo de 15 dias"
  { re: /r[ée]plica[^.]{0,80}?prazo\s+de\s+(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'REPLICA' },
  // "apelação no prazo de"
  { re: /apela[çc][ãa]o[^.]{0,80}?prazo\s+de\s+(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'APELACAO' },
  // "agravo de instrumento ... N dias"
  { re: /agravo\s+de\s+instrumento[^.]{0,80}?(?:prazo\s+de\s+)?(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'AGRAVO_INSTR' },
  // "agravo interno ... N dias"
  { re: /agravo\s+interno[^.]{0,80}?(?:prazo\s+de\s+)?(\d+)\s*(?:\([^)]+\))?\s*dias?\s*(úteis|corridos)?/i, tipo: 'AGRAVO_INTERNO' },
  // "manifeste-se no prazo de N dias" / "manifestar-se em N dias"

// Detecção de prazo em dobro (Fazenda/MP/Defensoria, art. 180/183/186 CPC)
const DOBRO_KEYWORDS = [
  'fazenda pública', 'fazenda publica', 'fazenda nacional',
  'união federal', 'uniao federal',
  'procuradoria-geral da fazenda', 'procuradoria geral da fazenda',
  'procuradoria da fazenda',
  'inss', 'autarquia',
  'ministério público', 'ministerio publico',
  'defensoria pública', 'defensoria publica'
];

function detectarDobro(teor) {
  const t = String(teor || '').toLowerCase();
  return DOBRO_KEYWORDS.some(kw => t.includes(kw));
}

// Refinador: se regex retornou tipo='auto', usa keywords pra refinar
function _refinarTipo(teor) {
  const t = String(teor || '').toLowerCase();
  for (const k of PARSER_KEYWORDS) {
    if (k.keywords.some(kw => t.includes(kw))) return k.tipo;
  }
  return 'MANIFESTACAO'; // default conservador
}

/**
 * Recebe o teor de uma publicação e devolve estrutura PrazoExtraido.
 * Nunca lança — em caso de erro, retorna confianca baixa + requerRevisao.
 */
function parsearPublicacao(teor) {
  if (!teor || typeof teor !== 'string') {
    return { tipo: 'CIENCIA', label: 'Sem teor', prazoDias: null, unidade: null,
             baseLegal: null, emDobro: false, confianca: 0, fonte: 'erro',
             evidencia: '', requerRevisao: true };
  }

  const teorOriginal = teor;
  const teorLower = teor.toLowerCase();
  const emDobro = detectarDobro(teorOriginal);

  // Tier 1: regex de alta precisão
  for (const r of PARSER_REGEXES) {
    const m = teorOriginal.match(r.re);
    if (!m) continue;
    const prazoDias = parseInt(m[1]);
    if (!prazoDias || prazoDias < 1 || prazoDias > 365) continue;
    let tipo = r.tipo === 'auto' ? _refinarTipo(teorOriginal) : r.tipo;
    const tipoData = TIPOS_ATO[tipo] || TIPOS_ATO.MANIFESTACAO;
    // unidade: capturada explicitamente OU inferida do tipo
    let unidade;
    if (m[2]) unidade = m[2].toLowerCase().includes('corrid') ? 'CORRIDOS' : 'UTEIS';
    else unidade = tipoData.unidade || 'UTEIS';
    return {
      tipo,
      label: tipoData.label,
      prazoDias,
      unidade,
      baseLegal: tipoData.baseLegal,
      emDobro,
      confianca: r.genericPrazo ? 0.75 : 0.92,
      fonte: r.genericPrazo ? 'regex_generico' : 'regex',
      evidencia: m[0].slice(0, 200),
      requerRevisao: !!r.genericPrazo
    };
  }

  // Tier 2: keywords
  for (const k of PARSER_KEYWORDS) {
    const hits = k.keywords.filter(kw => teorLower.includes(kw));
    if (!hits.length) continue;
    const tipoData = TIPOS_ATO[k.tipo];
    if (!tipoData || tipoData.prazo == null) continue;
    return {
      tipo: k.tipo,
      label: tipoData.label,
      prazoDias: tipoData.prazo,
      unidade: tipoData.unidade,
      baseLegal: tipoData.baseLegal,
      emDobro,
      confianca: 0.70,
      fonte: 'keywords',
      evidencia: hits[0],
      requerRevisao: true
    };
  }

  // Não conseguiu — registra como ciência
  return {
    tipo: 'CIENCIA',
    label: TIPOS_ATO.CIENCIA.label,
    prazoDias: null,
    unidade: null,
    baseLegal: null,
    emDobro: false,
    confianca: 0.5,
    fonte: 'fallback',
    evidencia: '',
    requerRevisao: true
  };
}

function detectDeadlines(text, events) {
  const intimationRe = /(intima(?:ção|do|r|tória)|publica(?:ção|do)|ci[êe]ncia|notifica(?:ção|do))\s+(?:em\s+|de\s+)?(\d{2}\/\d{2}\/\d{4})/gi;
  const found = [...text.matchAll(intimationRe)].map(m => ({
    type: m[1],
    date: m[2],
    context: text.substring(Math.max(0, m.index - 50), Math.min(text.length, m.index + 100)).replace(/\s+/g, ' ').trim()
  }));

  // Sort by date desc (most recent first)
  found.sort((a, b) => {
    const [da, ma, ya] = a.date.split('/').map(Number);
    const [db, mb, yb] = b.date.split('/').map(Number);
    return new Date(yb, mb-1, db) - new Date(ya, ma-1, da);
  });

  // Calculate deadlines for the most recent intimation, if any
  let analysis = null;
  if (found.length > 0) {
    const last = found[0];
    const [d, m, y] = last.date.split('/').map(Number);
    const intimationDate = new Date(y, m-1, d);
    const today = new Date();
    today.setHours(0,0,0,0);

    const commonDeadlines = [5, 10, 15, 30];
    const deadlines = commonDeadlines.map(days => {
      const deadline = addBusinessDays(intimationDate, days);
      const remaining = Math.ceil((deadline - today) / (1000*60*60*24));
      return { days, deadline, remaining };
    });
    analysis = { lastIntimation: last, intimationDate, deadlines };
  }

  return { intimations: found, analysis };
}

// Extract tables by clustering text by Y coordinate
async function processExtractTables(pdfBytes, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const tables = [];
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages);
    const page = await pdfDoc.getPage(i);
    const items = (await page.getTextContent()).items;
    if (items.length === 0) continue;

    // Group by Y coordinate (rounded to handle minor variations)
    const rowMap = new Map();
    for (const item of items) {
      const y = Math.round(item.transform[5]);
      if (!rowMap.has(y)) rowMap.set(y, []);
      rowMap.get(y).push({ text: item.str.trim(), x: item.transform[4] });
    }
    // Sort rows top to bottom
    const rows = [...rowMap.entries()]
      .sort((a, b) => b[0] - a[0])
      .map(([y, cells]) => cells.sort((a, b) => a.x - b.x).filter(c => c.text));

    // Detect table candidates: groups of consecutive rows with 3+ cells
    let currentTable = [], currentStartY = null;
    for (const row of rows) {
      if (row.length >= 3) {
        currentTable.push(row.map(c => c.text));
      } else {
        if (currentTable.length >= 3) {
          tables.push({ page: i, rows: currentTable });
        }
        currentTable = [];
      }
    }
    if (currentTable.length >= 3) tables.push({ page: i, rows: currentTable });
  }
  return tables;
}

function tablesToCsv(tables) {
  let csv = '';
  for (const t of tables) {
    csv += `# Página ${t.page}\n`;
    for (const row of t.rows) {
      csv += row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\n';
    }
    csv += '\n';
  }
  return csv;
}

// ============== SINGLE MODE ACTIONS ==============

function parsePageRange(input, max) {
  const result = new Set();
  for (const part of input.split(',').map(s => s.trim())) {
    if (!part) continue;
    if (part.includes('-')) {
      const [a, b] = part.split('-').map(s => parseInt(s.trim()));
      if (isNaN(a) || isNaN(b)) throw new Error(`Intervalo inválido: ${part}`);
      for (let i = Math.min(a,b); i <= Math.max(a,b); i++) {
        if (i >= 1 && i <= max) result.add(i);
      }
    } else {
      const n = parseInt(part);
      if (isNaN(n)) throw new Error(`Número inválido: ${part}`);
      if (n >= 1 && n <= max) result.add(n);
    }
  }
  return Array.from(result).sort((a,b) => a-b);
}

**4. PONTOS CRÍTICOS E RISCOS**

- Fragilidades da posição do nosso cliente
- Documentos ou provas que podem ser desfavoráveis

**5. OPORTUNIDADES PROCESSUAIS E ESTRATÉGIAS**

**6. PLANO DE AÇÃO — PRÓXIMOS PASSOS**

function _calcularSaldoBanco(banco, transacoes) {
  // Soma realizadas: receitas (+), despesas (-)
  let saldo = banco.saldoInicial || 0;
  for (const t of transacoes) {
    if (t.contaId !== banco.id || t.tipoConta !== 'banco') continue;
    if (t.status !== 'realizado') continue;
    saldo += (t.tipo === 'receita' ? Number(t.valor) : -Number(t.valor));
  }
  return saldo;
}

function _ultimoDiaDoMes(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

// Calcula próxima data ISO (YYYY-MM-DD) de uma recorrência baseada na
// última geração e dia do mês configurado. Se dia não existe no mês
// (ex: 30 em fevereiro), clamp ao último dia do mês.
function _proximaDataRecorrencia(ultimaGeracao, diaDoMes) {
  let nextYear, nextMonth;
  if (!ultimaGeracao) {
    const hoje = new Date();
    nextYear = hoje.getFullYear();
    nextMonth = hoje.getMonth();
  } else {
    const ult = new Date(ultimaGeracao + 'T12:00:00');
    nextYear = ult.getFullYear();
    nextMonth = ult.getMonth() + 1;
    if (nextMonth > 11) { nextYear++; nextMonth = 0; }
  }
  const ultimoDia = _ultimoDiaDoMes(nextYear, nextMonth);
  const dia = Math.min(diaDoMes || 1, ultimoDia);
  const mes = String(nextMonth + 1).padStart(2, '0');
  const d = String(dia).padStart(2, '0');
  return `${nextYear}-${mes}-${d}`;
}

// Gera transações pendentes pra todas as recorrências ativas até hoje.
// Idempotente: usa rec.ultimaGeracao pra não duplicar.
// Lançamentos são criados com status 'previsto' — usuário confirma um a um
// (ou em lote no futuro) na sub-aba Transações.
async function _gerarTransacoesRecorrentes() {
  const recs = (await DB.getAllRecorrencias()).filter(r => r.ativo !== false);
  if (recs.length === 0) return 0;
  const hojeISO = new Date().toISOString().slice(0, 10);
  let geradas = 0;
  for (const rec of recs) {
    let proxima = _proximaDataRecorrencia(rec.ultimaGeracao, rec.diaDoMes);
    while (proxima <= hojeISO) {
      try {
        await DB.saveTransacao({
          id: uid(),
          tipo: rec.tipo || 'despesa',
          valor: Number(rec.valor) || 0,
          data: proxima,
          categoriaId: rec.categoriaId || null,
          contaId: rec.contaId || null,
          tipoConta: rec.tipoConta || 'banco',
          descricao: rec.descricao || '(recorrência sem descrição)',
          recorrenteId: rec.id,
          status: 'previsto',
          createdAt: Date.now()
        });
        rec.ultimaGeracao = proxima;
        geradas++;
      } catch (e) {
        console.warn('falha ao gerar transação recorrente', rec.id, proxima, e);
        break;
      }
      proxima = _proximaDataRecorrencia(proxima, rec.diaDoMes);
    }
    if (rec.ultimaGeracao) {
      try { await DB.saveRecorrencia(rec); } catch (e) {}
    }
  }
  if (geradas > 0 && typeof toast === 'function') {
    toast(`${geradas} transação(ões) recorrente(s) gerada(s)`,
      'previstas — confirme em Transações conforme caírem', 'info');
  }
  return geradas;
}

// Lê processos cobertos por um honorário, com compat para schema legado
// (anterior ao Cli.2 — quando honorário tinha apenas `processoId` único).
function _processosDoHonorario(h) {
  if (!h) return [];
  if (Array.isArray(h.processosCobertos)) return h.processosCobertos.filter(Boolean);
  if (h.processoId) return [h.processoId];
  return [];
}

// Migração lazy de honorários (Cli.2): converte schema antigo (processoId único)
// para novo (clienteId + processosCobertos[]). Idempotente. Roda em background
// ao abrir página de honorários.
async function _migrarHonorariosParaClientes() {
  try {
    const honorarios = await DB.getAllHonorarios();
    const aMigrar = honorarios.filter(h =>
      (h.processoId && !Array.isArray(h.processosCobertos)) ||
      (h.processoId && !h.clienteId)
    );
    if (aMigrar.length === 0) return 0;

    const processos = await DB.getAllProcesses();
    const procById = {};
    processos.forEach(p => procById[p.id] = p);

    let migrados = 0, semCliente = 0;
    for (const h of aMigrar) {
      const proc = procById[h.processoId];
      if (!Array.isArray(h.processosCobertos)) {
        h.processosCobertos = [h.processoId];
      }
      if (!h.clienteId) {
        if (proc && proc.clienteId) {
          h.clienteId = proc.clienteId;
          if (!h.clienteNome) h.clienteNome = proc.client || '';
        } else {
          semCliente++;
        }
      }
      // Mantém processoId legado por enquanto (compat). Pode ser removido em sprint futuro.
      try { await DB.saveHonorario(h); migrados++; }
      catch (e) { console.warn('falha ao migrar honorário', h.id, e); }
    }

    if (migrados > 0) {
      console.log(`[honorarios] migração: ${migrados} honorário(s) migrado(s)`);
      if (semCliente > 0 && typeof toast === 'function') {
        toast(`${semCliente} honorário(s) sem cliente`,
          'O processo vinculado não tem clienteId — cadastre o cliente em /clientes e re-edite o honorário', 'info');
      }
    }
    return migrados;
  } catch (e) {
    console.warn('Migração honorários falhou', e);
    return 0;
  }
}

// Calcula totais agregados de um honorário (recebido / em aberto / vencido)
function _agregarHonorario(h, hoje) {
  const today = hoje || new Date().toISOString().slice(0,10);
  let recebido = 0, emAberto = 0, vencido = 0;
  (h.parcelas || []).forEach(p => {
    const v = Number(p.valor) || 0;
    if (p.status === 'pago') recebido += v;
    else if ((p.vencimento || '') < today) vencido += v;
    else emAberto += v;
  });
  return { recebido, emAberto, vencido, total: recebido + emAberto + vencido };
}

// Calcula valor da FATURA ABERTA do cartão (= limite atualmente ocupado).
// Em cartão de crédito:
//   'previsto'  = "está na fatura aberta" → ocupa limite
//   'realizado' = "fatura paga / quitada" → liberou limite
// Marcar uma transação como realizado representa quitação da parcela,
// devolvendo o limite proporcional. A barra da fatura reflete só o que
// ainda está aberto.
// Janela do ciclo: do dia 1 do mês ref até último dia (MVP simplificado).
function _calcularFaturaCartao(cartao, transacoes, ref) {
  const refDate = ref || new Date();
  const inicioMes = new Date(refDate.getFullYear(), refDate.getMonth(), 1).toISOString().slice(0,10);
  const fimMes = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0).toISOString().slice(0,10);
  return transacoes
    .filter(t => t.tipoConta === 'cartao' && t.contaId === cartao.id && t.status === 'previsto')
    .filter(t => t.data >= inicioMes && t.data <= fimMes)
    .reduce((s, t) => s + (t.tipo === 'despesa' ? Number(t.valor) : -Number(t.valor)), 0);
}

// Soma de transações já PAGAS no mês (saíram do limite). Informativo.
function _calcularPagoCartao(cartao, transacoes, ref) {
  const refDate = ref || new Date();
  const inicioMes = new Date(refDate.getFullYear(), refDate.getMonth(), 1).toISOString().slice(0,10);
  const fimMes = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0).toISOString().slice(0,10);
  return transacoes
    .filter(t => t.tipoConta === 'cartao' && t.contaId === cartao.id && t.status === 'realizado')
    .filter(t => t.data >= inicioMes && t.data <= fimMes)
    .reduce((s, t) => s + (t.tipo === 'despesa' ? Number(t.valor) : -Number(t.valor)), 0);
}

// Calcula gasto do mês de uma categoria
function _calcularGastoCategoria(categoria, transacoes, ref) {
  const refDate = ref || new Date();
  const inicioMes = new Date(refDate.getFullYear(), refDate.getMonth(), 1).toISOString().slice(0,10);
  const fimMes = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0).toISOString().slice(0,10);
  return transacoes
    .filter(t => t.categoriaId === categoria.id && t.status === 'realizado')
    .filter(t => t.data >= inicioMes && t.data <= fimMes)
    .reduce((s, t) => s + Number(t.valor), 0);
}

async function renderFinTransacoes() {
  const [transacoes, bancos, cartoes, categorias, processos] = await Promise.all([
    DB.getAllTransacoes(), DB.getAllBancos(), DB.getAllCartoes(),
    DB.getAllCategoriasFin(), DB.getAllProcesses()
  ]);
  const catById = {}; categorias.forEach(c => catById[c.id] = c);
  const bancoById = {}; bancos.forEach(b => bancoById[b.id] = b);
  const cartaoById = {}; cartoes.forEach(c => cartaoById[c.id] = c);
  const procById = {}; processos.forEach(p => procById[p.id] = p);

  state._finTransacoesFiltro = state._finTransacoesFiltro || {
    tipo: 'todos', status: 'todos',
    periodo: 'esteMes', dataInicio: '', dataFim: '',
    busca: '', categoriaId: '', contaId: ''
  };
  const f = state._finTransacoesFiltro;

  // Resolve range de datas a partir do preset
  const hoje = new Date();
  let dataInicio = '', dataFim = '';
  if (f.periodo === 'esteMes') {
    dataInicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
    dataFim    = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
  } else if (f.periodo === 'mesPassado') {
    dataInicio = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1).toISOString().slice(0,10);
    dataFim    = new Date(hoje.getFullYear(), hoje.getMonth(), 0).toISOString().slice(0,10);
  } else if (f.periodo === 'ano') {
    dataInicio = new Date(hoje.getFullYear(), 0, 1).toISOString().slice(0,10);
    dataFim    = new Date(hoje.getFullYear(), 11, 31).toISOString().slice(0,10);
  } else if (f.periodo === 'custom') {
    dataInicio = f.dataInicio || '';
    dataFim    = f.dataFim || '';
  }

  let filtradas = transacoes.slice();
  if (f.tipo !== 'todos')   filtradas = filtradas.filter(t => t.tipo === f.tipo);
  if (f.status !== 'todos') filtradas = filtradas.filter(t => t.status === f.status);
  if (dataInicio) filtradas = filtradas.filter(t => (t.data || '') >= dataInicio);
  if (dataFim)    filtradas = filtradas.filter(t => (t.data || '') <= dataFim);
  if (f.categoriaId) filtradas = filtradas.filter(t => t.categoriaId === f.categoriaId);
  if (f.contaId)     filtradas = filtradas.filter(t => t.contaId === f.contaId);
  if (f.busca && f.busca.trim()) {
    const q = f.busca.trim().toLowerCase();
    filtradas = filtradas.filter(t => (t.descricao || '').toLowerCase().includes(q));
  }
  filtradas.sort((a,b) => (b.data || '').localeCompare(a.data || ''));

  // Soma do filtro atual
  const somaReceita = filtradas.filter(t => t.tipo === 'receita').reduce((s,t) => s + Number(t.valor), 0);
  const somaDespesa = filtradas.filter(t => t.tipo === 'despesa').reduce((s,t) => s + Number(t.valor), 0);

  $('finContent').innerHTML = `
    <div class="card mb-3" style="padding: 12px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; align-items: end;">
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Período</label>
          <select class="select" onchange="_setFinFiltro('periodo', this.value)">
            <option value="esteMes" ${f.periodo === 'esteMes' ? 'selected' : ''}>Este mês</option>
            <option value="mesPassado" ${f.periodo === 'mesPassado' ? 'selected' : ''}>Mês passado</option>
            <option value="ano" ${f.periodo === 'ano' ? 'selected' : ''}>Este ano</option>
            <option value="custom" ${f.periodo === 'custom' ? 'selected' : ''}>Período custom</option>
            <option value="todos" ${f.periodo === 'todos' ? 'selected' : ''}>Todos</option>
          </select>
        </div>
        ${f.periodo === 'custom' ? `
          <div>
            <label class="label" style="font-size: 11px; margin-bottom: 4px;">De</label>
            <input type="date" class="input" value="${f.dataInicio || ''}" onchange="_setFinFiltro('dataInicio', this.value)">
          </div>
          <div>
            <label class="label" style="font-size: 11px; margin-bottom: 4px;">Até</label>
            <input type="date" class="input" value="${f.dataFim || ''}" onchange="_setFinFiltro('dataFim', this.value)">
          </div>
        ` : ''}
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Tipo</label>
          <select class="select" onchange="_setFinFiltro('tipo', this.value)">
            <option value="todos" ${f.tipo === 'todos' ? 'selected' : ''}>Todos</option>
            <option value="receita" ${f.tipo === 'receita' ? 'selected' : ''}>Receitas</option>
            <option value="despesa" ${f.tipo === 'despesa' ? 'selected' : ''}>Despesas</option>
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Status</label>
          <select class="select" onchange="_setFinFiltro('status', this.value)">
            <option value="todos" ${f.status === 'todos' ? 'selected' : ''}>Todos</option>
            <option value="previsto" ${f.status === 'previsto' ? 'selected' : ''}>Previstas</option>
            <option value="realizado" ${f.status === 'realizado' ? 'selected' : ''}>Realizadas</option>
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Categoria</label>
          <select class="select" onchange="_setFinFiltro('categoriaId', this.value)">
            <option value="">Todas</option>
            ${categorias.map(c => `<option value="${c.id}" ${f.categoriaId === c.id ? 'selected' : ''}>${escapeHtml(c.nome)} (${c.tipo})</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Conta</label>
          <select class="select" onchange="_setFinFiltro('contaId', this.value)">
            <option value="">Todas</option>
            ${bancos.map(b => `<option value="${b.id}" ${f.contaId === b.id ? 'selected' : ''}>🏦 ${escapeHtml(b.nome)}</option>`).join('')}
            ${cartoes.map(c => `<option value="${c.id}" ${f.contaId === c.id ? 'selected' : ''}>💳 ${escapeHtml(c.nome)}</option>`).join('')}
          </select>
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Buscar na descrição</label>
          <input type="text" class="input" value="${escapeHtml(f.busca || '')}" placeholder="Ex: aluguel · honorário cliente x" oninput="_setFinFiltroDebounced('busca', this.value)">
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mb-3" style="flex-wrap: wrap; gap: 8px;">
      <div style="font-size: 13px; color: var(--uc-warm-gray);">
        <strong>${filtradas.length}</strong> transação(ões) ·
        <span style="color: var(--uc-green);">+${brl(somaReceita)}</span> ·
        <span style="color: var(--uc-red);">−${brl(somaDespesa)}</span> ·
        saldo do filtro <strong style="color: ${somaReceita - somaDespesa >= 0 ? 'var(--uc-green)' : 'var(--uc-red)'};">${brl(somaReceita - somaDespesa)}</strong>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-outline btn-sm" onclick="exportarTransacoesCSV()" ${filtradas.length === 0 ? 'disabled' : ''}>📥 Exportar CSV</button>
        <button class="btn btn-primary btn-sm" onclick="novaTransacaoFlow()" ${bancos.length === 0 && cartoes.length === 0 ? 'disabled title="Cadastre um banco primeiro"' : ''}>+ Nova transação</button>
      </div>
    </div>

    ${filtradas.length === 0 ? `
      <div class="empty-state">
        <p class="empty-state-msg">Nenhuma transação com esses filtros.</p>
      </div>
    ` : `
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--uc-line); text-align: left;">
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500;">Data</th>
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500;">Descrição</th>
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500;">Categoria</th>
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500;">Conta</th>
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Valor</th>
              <th style="padding: 8px 6px; color: var(--uc-warm-gray); font-weight: 500;">Status</th>
              <th style="padding: 8px 6px;"></th>
            </tr>
          </thead>
          <tbody>
            ${filtradas.map(t => {
              const conta = t.tipoConta === 'cartao' ? cartaoById[t.contaId] : bancoById[t.contaId];
              const cat = catById[t.categoriaId];
              return `
                <tr style="border-bottom: 1px solid var(--uc-line-soft);">
                  <td style="padding: 8px 6px;">${formatDate(t.data)}</td>
                  <td style="padding: 8px 6px;">${escapeHtml(t.descricao || '—')}${t.processoId && procById[t.processoId] ? `<br><span style="font-size: 11px; color: var(--uc-warm-gray);">↳ ${escapeHtml(procById[t.processoId].name || procById[t.processoId].cnj || '')}</span>` : ''}</td>
                  <td style="padding: 8px 6px;"><span style="color: ${cat?.cor || '#6b6b68'};">${escapeHtml(cat?.nome || '—')}</span></td>
                  <td style="padding: 8px 6px;">${escapeHtml(conta?.nome || '—')} ${t.tipoConta === 'cartao' ? '<span class="badge badge-gray" style="font-size: 9px;">cartão</span>' : ''}</td>
                  <td style="padding: 8px 6px; text-align: right; font-weight: 600; color: ${t.tipo === 'receita' ? 'var(--uc-green)' : 'var(--uc-red)'};">
                    ${t.tipo === 'receita' ? '+' : '−'}${brl(t.valor)}
                  </td>
                  <td style="padding: 8px 6px;">
                    ${t.status === 'realizado'
                      ? '<span class="badge badge-green" style="font-size: 10px;">✓ realizado</span>'
                      : `<button class="btn btn-ghost btn-sm" onclick="confirmarTransacao('${t.id}')" title="Marcar como realizada" style="padding: 2px 8px; font-size: 11px;">○ marcar paga</button>`
                    }
                  </td>
                  <td style="padding: 8px 6px; text-align: right;">
                    <button class="btn btn-ghost btn-sm" onclick="editarTransacao('${t.id}')" title="Editar">✎</button>
                    <button class="btn btn-ghost btn-sm" onclick="removerTransacao('${t.id}')" title="Remover">🗑</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `}
  `;
}

function _setFinFiltro(campo, valor) {
  state._finTransacoesFiltro = state._finTransacoesFiltro || {};
  state._finTransacoesFiltro[campo] = valor;
  renderFinTransacoes();
}

let _finFiltroDebounce = null;
function _setFinFiltroDebounced(campo, valor) {
  state._finTransacoesFiltro = state._finTransacoesFiltro || {};
  state._finTransacoesFiltro[campo] = valor;
  clearTimeout(_finFiltroDebounce);
  _finFiltroDebounce = setTimeout(() => renderFinTransacoes(), 300);
}

}

// === Sub-aba Balancete ===

async function renderFinBalancete() {
  const [transacoes, categorias, bancos, cartoes] = await Promise.all([
    DB.getAllTransacoes(), DB.getAllCategoriasFin(),
    DB.getAllBancos(), DB.getAllCartoes()
  ]);
  const catById = {}; categorias.forEach(c => catById[c.id] = c);
  const bancoById = {}; bancos.forEach(b => bancoById[b.id] = b);
  const cartaoById = {}; cartoes.forEach(c => cartaoById[c.id] = c);

  const hoje = new Date();
  state._balanceteFiltro = state._balanceteFiltro || {
    ano: hoje.getFullYear(),
    mes: hoje.getMonth() + 1     // 1-12, ou 0 = ano todo
  };
  const f = state._balanceteFiltro;

  // Range do filtro
  let inicio, fim, labelPeriodo;
  if (f.mes === 0) {
    inicio = `${f.ano}-01-01`;
    fim = `${f.ano}-12-31`;
    labelPeriodo = `Ano ${f.ano}`;
  } else {
    const mm = String(f.mes).padStart(2, '0');
    const ultimoDia = String(_ultimoDiaDoMes(f.ano, f.mes - 1)).padStart(2, '0');
    inicio = `${f.ano}-${mm}-01`;
    fim = `${f.ano}-${mm}-${ultimoDia}`;
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    labelPeriodo = `${meses[f.mes - 1]}/${f.ano}`;
  }

  const noPeriodo = transacoes.filter(t => (t.data || '') >= inicio && (t.data || '') <= fim);

  // Totais
  const recPrev = noPeriodo.filter(t => t.tipo === 'receita' && t.status === 'previsto').reduce((s,t) => s + Number(t.valor), 0);
  const recReal = noPeriodo.filter(t => t.tipo === 'receita' && t.status === 'realizado').reduce((s,t) => s + Number(t.valor), 0);
  const despPrev = noPeriodo.filter(t => t.tipo === 'despesa' && t.status === 'previsto').reduce((s,t) => s + Number(t.valor), 0);
  const despReal = noPeriodo.filter(t => t.tipo === 'despesa' && t.status === 'realizado').reduce((s,t) => s + Number(t.valor), 0);

  // Por categoria
  const porCat = {};
  noPeriodo.forEach(t => {
    const k = t.categoriaId || '_';
    if (!porCat[k]) porCat[k] = { previsto: 0, realizado: 0, tipo: t.tipo };
    porCat[k][t.status === 'realizado' ? 'realizado' : 'previsto'] += Number(t.valor);
  });
  const linhasCat = Object.entries(porCat).map(([k, v]) => ({
    nome: catById[k]?.nome || '— sem categoria —',
    cor: catById[k]?.cor || '#6b6b68',
    tipo: v.tipo,
    previsto: v.previsto,
    realizado: v.realizado,
    total: v.previsto + v.realizado
  })).sort((a, b) => b.total - a.total);

  // Por conta (apenas bancos — cartões não fecham saldo)
  const porBanco = {};
  noPeriodo.forEach(t => {
    if (t.tipoConta !== 'banco' || !t.contaId) return;
    const k = t.contaId;
    if (!porBanco[k]) porBanco[k] = { receitas: 0, despesas: 0 };
    if (t.status === 'realizado') {
      porBanco[k][t.tipo === 'receita' ? 'receitas' : 'despesas'] += Number(t.valor);
    }
  });
  const linhasBanco = Object.entries(porBanco).map(([k, v]) => ({
    nome: bancoById[k]?.nome || '— banco removido —',
    receitas: v.receitas,
    despesas: v.despesas,
    saldo: v.receitas - v.despesas
  })).sort((a, b) => b.saldo - a.saldo);

  const meses = ['(Ano todo)', 'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const anos = [];
  const anoAtual = hoje.getFullYear();
  for (let y = anoAtual + 1; y >= anoAtual - 5; y--) anos.push(y);

  $('finContent').innerHTML = `
    <div class="card mb-3" style="padding: 10px;">
      <div style="display: flex; gap: 8px; align-items: end; flex-wrap: wrap;">
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Mês</label>
          <select class="select" onchange="_setBalanceteFiltro('mes', parseInt(this.value))">
            ${meses.map((nome, i) => `<option value="${i}" ${f.mes === i ? 'selected' : ''}>${nome}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Ano</label>
          <select class="select" onchange="_setBalanceteFiltro('ano', parseInt(this.value))">
            ${anos.map(y => `<option value="${y}" ${f.ano === y ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div style="margin-left: auto;">
          <button class="btn btn-outline btn-sm" onclick="exportarBalanceteCSV()">📥 Exportar CSV</button>
        </div>
      </div>
    </div>

    <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Balancete · ${labelPeriodo}</h3>

    <div class="grid gap-3" style="grid-template-columns: 1fr 1fr; margin-bottom: 16px;">
      <div class="card">
        <h4 class="font-serif font-semibold smallcaps mb-3" style="color: var(--uc-green);">Receitas</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px;">
          <div><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 2px;">Recebidas</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-green); margin: 0;">${brl(recReal)}</p></div>
          <div><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 2px;">Previstas</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-amber); margin: 0;">${brl(recPrev)}</p></div>
        </div>
      </div>
      <div class="card">
        <h4 class="font-serif font-semibold smallcaps mb-3" style="color: var(--uc-red);">Despesas</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px;">
          <div><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 2px;">Pagas</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-red); margin: 0;">${brl(despReal)}</p></div>
          <div><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 2px;">Em aberto</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-amber); margin: 0;">${brl(despPrev)}</p></div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <h4 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Resultado do período</h4>
      <p style="font-size: 28px; font-weight: 700; color: ${recReal - despReal >= 0 ? 'var(--uc-green)' : 'var(--uc-red)'}; margin: 0;">
        ${brl(recReal - despReal)}
      </p>
      <p class="text-xs" style="color: var(--uc-warm-gray); margin: 4px 0 0;">recebido ${brl(recReal)} − pagas ${brl(despReal)} (somente realizados)</p>
    </div>

    <div class="card mb-3">
      <h4 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Por categoria</h4>
      ${linhasCat.length === 0 ? '<p class="help-text">Sem transações no período.</p>' : `
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--uc-line); text-align: left;">
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500;">Categoria</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500;">Tipo</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Realizado</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Previsto</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Total</th>
            </tr>
          </thead>
          <tbody>
            ${linhasCat.map(l => `
              <tr style="border-bottom: 1px solid var(--uc-line-soft);">
                <td style="padding: 6px 4px;"><span style="color: ${l.cor};">${escapeHtml(l.nome)}</span></td>
                <td style="padding: 6px 4px;"><span class="badge ${l.tipo === 'receita' ? 'badge-green' : 'badge-red'}" style="font-size: 9px;">${l.tipo}</span></td>
                <td style="padding: 6px 4px; text-align: right; font-weight: 600;">${brl(l.realizado)}</td>
                <td style="padding: 6px 4px; text-align: right; color: var(--uc-warm-gray);">${brl(l.previsto)}</td>
                <td style="padding: 6px 4px; text-align: right; font-weight: 600;">${brl(l.total)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>

    ${linhasBanco.length > 0 ? `
      <div class="card mb-3">
        <h4 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Por banco (apenas realizadas)</h4>
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--uc-line); text-align: left;">
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500;">Banco</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Receitas</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Despesas</th>
              <th style="padding: 6px 4px; color: var(--uc-warm-gray); font-weight: 500; text-align: right;">Saldo</th>
            </tr>
          </thead>
          <tbody>
            ${linhasBanco.map(l => `
              <tr style="border-bottom: 1px solid var(--uc-line-soft);">
                <td style="padding: 6px 4px;">${escapeHtml(l.nome)}</td>
                <td style="padding: 6px 4px; text-align: right; color: var(--uc-green); font-weight: 600;">${brl(l.receitas)}</td>
                <td style="padding: 6px 4px; text-align: right; color: var(--uc-red); font-weight: 600;">${brl(l.despesas)}</td>
                <td style="padding: 6px 4px; text-align: right; font-weight: 700; color: ${l.saldo >= 0 ? 'var(--uc-green)' : 'var(--uc-red)'};">${brl(l.saldo)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}
  `;
}

function _setBalanceteFiltro(campo, valor) {
  state._balanceteFiltro = state._balanceteFiltro || {};
  state._balanceteFiltro[campo] = valor;
  renderFinBalancete();
}

async function renderFinCategorias() {
  const [categorias, transacoes] = await Promise.all([
    DB.getAllCategoriasFin(), DB.getAllTransacoes()
  ]);
  const desp = categorias.filter(c => c.tipo === 'despesa' && c.ativo !== false);
  const rec = categorias.filter(c => c.tipo === 'receita' && c.ativo !== false);

  function renderCard(c) {
    const gasto = _calcularGastoCategoria(c, transacoes);
    const orcamento = Number(c.orcamentoMensal) || 0;
    const pct = orcamento > 0 ? Math.min(100, (gasto / orcamento * 100)) : null;
    const corBarra = pct == null ? 'var(--uc-warm-gray)' : pct >= 100 ? 'var(--uc-red)' : pct >= 80 ? 'var(--uc-amber)' : (c.cor || 'var(--uc-green)');
    return `
      <div class="card" style="border-left: 4px solid ${c.cor || '#6b6b68'};">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
          <h4 class="font-serif font-semibold" style="color: var(--uc-black); margin: 0; font-size: 15px;">${escapeHtml(c.nome)}</h4>
          <div style="display: flex; gap: 2px;">
            <button class="btn btn-ghost btn-sm" onclick="editarCategoria('${c.id}')" title="Editar" style="padding: 2px 6px;">✎</button>
            <button class="btn btn-ghost btn-sm" onclick="removerCategoria('${c.id}')" title="Remover" style="padding: 2px 6px;">🗑</button>
          </div>
        </div>
        <p style="font-size: 18px; font-weight: 600; color: ${c.tipo === 'receita' ? 'var(--uc-green)' : corBarra}; margin: 4px 0 6px;">${brl(gasto)}</p>
        ${orcamento > 0 ? `
          <div style="height: 6px; background: var(--uc-cream); border-radius: 3px; overflow: hidden; margin-bottom: 4px;">
            <div style="width: ${pct}%; height: 100%; background: ${corBarra};"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--uc-warm-gray);">
            <span>${pct.toFixed(0)}% utilizado</span>
            <span>orçam. ${brl(orcamento)}</span>
          </div>
        ` : `
          <p class="text-xs" style="color: var(--uc-warm-gray); margin: 0;">sem orçamento definido</p>
        `}
      </div>
    `;
  }

  $('finContent').innerHTML = `
    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray);">${desp.length} despesa(s) · ${rec.length} receita(s)</p>
      <button class="btn btn-primary btn-sm" onclick="novaCategoriaFlow()">+ Nova categoria</button>
    </div>

    ${desp.length > 0 ? `
      <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Despesas</h3>
      <div class="grid gap-3" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 24px;">
        ${desp.map(renderCard).join('')}
      </div>
    ` : ''}

    ${rec.length > 0 ? `
      <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Receitas</h3>
      <div class="grid gap-3" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
        ${rec.map(renderCard).join('')}
      </div>
    ` : ''}

    ${categorias.length === 0 ? '<div class="empty-state"><p class="empty-state-msg">Nenhuma categoria. Adicione uma para começar.</p></div>' : ''}
  `;
}

async function renderFinHonorarios() {
  // Migração lazy (Cli.2): se há honorários antigos com schema processoId único,
  // converte pra clienteId + processosCobertos[] usando o cliente do processo.
  await _migrarHonorariosParaClientes();

  const [honorarios, processos, clientes] = await Promise.all([
    DB.getAllHonorarios(), DB.getAllProcesses(), DB.getAllClientes()
  ]);
  const procById = {}; processos.forEach(p => procById[p.id] = p);
  const cliById = {}; clientes.forEach(c => cliById[c.id] = c);
  const hoje = new Date().toISOString().slice(0,10);

  // Totais consolidados
  let totalPrevisto = 0, totalRecebido = 0, totalEmAberto = 0, totalVencido = 0;
  honorarios.forEach(h => {
    const agg = _agregarHonorario(h, hoje);
    totalPrevisto += agg.total;
    totalRecebido += agg.recebido;
    totalEmAberto += agg.emAberto;
    totalVencido += agg.vencido;
  });

  // Filtros: por cliente + status
  state._finHonFiltro = state._finHonFiltro || { clienteId: '', status: 'todos' };
  // Migração de filtro antigo (processoId → clienteId)
  if (state._finHonFiltro.processoId !== undefined) delete state._finHonFiltro.processoId;
  if (state._finHonFiltro.clienteId === undefined) state._finHonFiltro.clienteId = '';
  const f = state._finHonFiltro;
  let filtrados = honorarios.slice();
  if (f.clienteId) filtrados = filtrados.filter(h => h.clienteId === f.clienteId);
  if (f.status === 'comAberto') filtrados = filtrados.filter(h => _agregarHonorario(h, hoje).emAberto > 0);
  if (f.status === 'comVencido') filtrados = filtrados.filter(h => _agregarHonorario(h, hoje).vencido > 0);
  if (f.status === 'quitado') filtrados = filtrados.filter(h => {
    const a = _agregarHonorario(h, hoje); return a.emAberto === 0 && a.vencido === 0 && a.recebido > 0;
  });

  // Agrupa por clienteId. Honorários sem cliente (órfãos) ficam num grupo separado.
  const grupos = {};
  for (const h of filtrados) {
    const k = h.clienteId || '__orfao__';
    if (!grupos[k]) grupos[k] = [];
    grupos[k].push(h);
  }
  const idsOrdenados = Object.keys(grupos).sort((a, b) => {
    if (a === '__orfao__') return 1;
    if (b === '__orfao__') return -1;
    const na = (cliById[a]?.nome || '').toLowerCase();
    const nb = (cliById[b]?.nome || '').toLowerCase();
    return na.localeCompare(nb, 'pt-BR');
  });

  $('finContent').innerHTML = `
    <div class="grid gap-3" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px;">
      <div class="card">
        <p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 6px;">Total previsto</p>
        <p style="font-size: 22px; font-weight: 600; color: var(--uc-black); margin: 0;">${brl(totalPrevisto)}</p>
      </div>
      <div class="card">
        <p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 6px;">Recebido</p>
        <p style="font-size: 22px; font-weight: 600; color: var(--uc-green); margin: 0;">${brl(totalRecebido)}</p>
      </div>
      <div class="card">
        <p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 6px;">Em aberto</p>
        <p style="font-size: 22px; font-weight: 600; color: var(--uc-amber); margin: 0;">${brl(totalEmAberto)}</p>
      </div>
      <div class="card">
        <p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 6px;">Vencido</p>
        <p style="font-size: 22px; font-weight: 600; color: var(--uc-red); margin: 0;">${brl(totalVencido)}</p>
      </div>
    </div>

    <div class="card mb-3" style="padding: 10px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; align-items: end;">
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Cliente</label>
          <select class="select" onchange="_setFinHonFiltro('clienteId', this.value)">
            <option value="">Todos</option>
            ${clientes.filter(c => c.ativo !== false).sort((a,b) => (a.nome||'').localeCompare(b.nome||'', 'pt-BR')).map(c => `<option value="${c.id}" ${f.clienteId === c.id ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Status</label>
          <select class="select" onchange="_setFinHonFiltro('status', this.value)">
            <option value="todos" ${f.status === 'todos' ? 'selected' : ''}>Todos</option>
            <option value="comAberto" ${f.status === 'comAberto' ? 'selected' : ''}>Com parcelas em aberto</option>
            <option value="comVencido" ${f.status === 'comVencido' ? 'selected' : ''}>Com vencidas</option>
            <option value="quitado" ${f.status === 'quitado' ? 'selected' : ''}>Quitados</option>
          </select>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray);">${filtrados.length} honorário(s) em ${idsOrdenados.length} cliente(s) ${f.clienteId || f.status !== 'todos' ? '(filtrado)' : ''}</p>
      <div class="flex gap-2">
        <button class="btn btn-outline btn-sm" onclick="exportarHonorariosCSV()" ${honorarios.length === 0 ? 'disabled' : ''}>📥 Exportar CSV</button>
        <button class="btn btn-primary btn-sm" onclick="novoHonorarioFlow()" ${clientes.length === 0 ? 'disabled title="Cadastre um cliente primeiro"' : ''}>+ Novo honorário</button>
      </div>
    </div>

    ${filtrados.length === 0 ? `
      <div class="empty-state">
        <p class="empty-state-msg">${honorarios.length === 0 ? 'Nenhum honorário cadastrado. Vincule honorários a clientes pra controlar parcelas e recebimentos.' : 'Nenhum honorário com esses filtros.'}</p>
      </div>
    ` : idsOrdenados.map(cliId => {
      const cli = cliById[cliId];
      const hsCli = grupos[cliId];
      // Totais por cliente
      let recCli = 0, abertoCli = 0, vencCli = 0, totCli = 0;
      hsCli.forEach(h => {
        const a = _agregarHonorario(h, hoje);
        recCli += a.recebido; abertoCli += a.emAberto; vencCli += a.vencido; totCli += a.total;
      });
      const headerCli = cliId === '__orfao__'
        ? `<span style="color: var(--uc-red);">⚠ Honorários sem cliente vinculado</span>`
        : `<a onclick="navigate('clienteDetalhe', { currentClienteId: '${cliId}' })" style="cursor:pointer; color:var(--uc-gold);">${escapeHtml(cli?.nome || '—')}</a>`;

      return `
        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--uc-cream); border-radius: 6px 6px 0 0; border: 1px solid var(--uc-line-soft); border-bottom: none;">

function _setFinHonFiltro(campo, valor) {
  state._finHonFiltro = state._finHonFiltro || {};
  state._finHonFiltro[campo] = valor;
  renderFinHonorarios();
}

// Aba "Honorários" dentro de um processo (renderProcessDetail).
// Mostra honorários onde o processo aparece em processosCobertos[]
// (ou no campo legado processoId).
function renderProcessHonorarios(p, honorarios) {
  const hoje = new Date().toISOString().slice(0,10);
  // Filtra apenas honorários que cobrem este processo
  const honsDoProcesso = honorarios.filter(h => _processosDoHonorario(h).includes(p.id));

  let totalPrevisto = 0, totalRecebido = 0, totalEmAberto = 0, totalVencido = 0;
  honsDoProcesso.forEach(h => {
    const agg = _agregarHonorario(h, hoje);
    totalPrevisto += agg.total;
    totalRecebido += agg.recebido;
    totalEmAberto += agg.emAberto;
    totalVencido += agg.vencido;
  });

  return `
    <div class="grid gap-3 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Total</p><p style="font-size: 18px; font-weight: 600; margin: 0;">${brl(totalPrevisto)}</p></div>
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Recebido</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-green); margin: 0;">${brl(totalRecebido)}</p></div>
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Em aberto</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-amber); margin: 0;">${brl(totalEmAberto)}</p></div>
      ${totalVencido > 0 ? `<div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Vencido</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-red); margin: 0;">${brl(totalVencido)}</p></div>` : ''}
    </div>

    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray);">${honsDoProcesso.length} honorário(s) cobrindo este processo</p>
      <button class="btn btn-primary btn-sm" onclick="novoHonorarioFlow('${p.id}')">+ Novo honorário</button>
    </div>

    ${honsDoProcesso.length === 0 ? `
      <div class="empty-state">
        <p class="empty-state-msg">Nenhum honorário cobre este processo. Cadastre um novo (será vinculado ao cliente do processo) ou vincule um honorário existente do mesmo cliente em /financeiro/honorarios.</p>
      </div>
    ` : honsDoProcesso.map(h => {
      const procsCobertos = _processosDoHonorario(h);
      const cobreOutros = procsCobertos.length > 1;
      const agg = _agregarHonorario(h, hoje);
      return `
        <div class="card mb-3">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
            <div>
              <h4 class="font-serif font-semibold" style="margin: 0;">${escapeHtml(TIPO_HONORARIO_LABEL[h.tipoHonorario] || h.tipoHonorario)} · ${brl(h.valorTotal)}</h4>
              <p class="text-xs" style="color: var(--uc-warm-gray); margin: 4px 0 0;">
                ${(h.parcelas || []).length} parcela(s) · cliente <strong>${escapeHtml(h.clienteNome || p.client || '—')}</strong>
                ${cobreOutros ? ` · <span style="color: var(--uc-amber);">cobre ${procsCobertos.length} processos</span>` : ''}
              </p>
            </div>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-ghost btn-sm" onclick="editarHonorario('${h.id}')" title="Editar">✎</button>
              <button class="btn btn-ghost btn-sm" onclick="desvincularProcessoHonorario('${h.id}', '${p.id}')" title="Desvincular este processo do honorário">⊘</button>
              <button class="btn btn-ghost btn-sm" onclick="removerHonorario('${h.id}')" title="Remover honorário">🗑</button>
            </div>
          </div>
          ${h.observacoes ? `<p style="font-size: 12px; color: var(--uc-graphite); margin-bottom: 8px;">${escapeHtml(h.observacoes)}</p>` : ''}
          ${(h.parcelas || []).length > 0 ? `
            <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
              <thead>
                <tr style="border-bottom: 1px solid var(--uc-line-soft); text-align: left;">
                  <th style="padding: 4px 6px; color: var(--uc-warm-gray);">#</th>
                  <th style="padding: 4px 6px; color: var(--uc-warm-gray);">Vence</th>
                  <th style="padding: 4px 6px; color: var(--uc-warm-gray); text-align: right;">Valor</th>
                  <th style="padding: 4px 6px; color: var(--uc-warm-gray);">Status</th>
                  <th style="padding: 4px 6px;"></th>
                </tr>
              </thead>
              <tbody>
                ${h.parcelas.map(parc => {
                  const venceu = (parc.vencimento || '') < hoje && parc.status !== 'pago';
                  return `
                    <tr style="border-bottom: 1px solid var(--uc-line-soft);">
                      <td style="padding: 4px 6px;">${parc.numero}</td>
                      <td style="padding: 4px 6px; ${venceu ? 'color: var(--uc-red); font-weight: 600;' : ''}">${formatDate(parc.vencimento)}${venceu ? ' ⚠' : ''}</td>
                      <td style="padding: 4px 6px; text-align: right; font-weight: 600;">${brl(parc.valor)}</td>
                      <td style="padding: 4px 6px;">
                        ${parc.status === 'pago'
                          ? '<span class="badge badge-green" style="font-size:9px;">✓ pago</span>'
                          : venceu
                            ? '<span class="badge badge-red" style="font-size:9px;">vencido</span>'
                            : '<span class="badge badge-gray" style="font-size:9px;">previsto</span>'}
                      </td>
                      <td style="padding: 4px 6px; text-align: right;">
                        ${parc.status === 'pago'
                          ? `<button class="btn btn-ghost btn-sm" onclick="desfazerPagamentoParcela('${h.id}', ${parc.numero})" style="padding: 2px 6px; font-size: 10px;">↶ desfazer</button>`
                          : `<button class="btn btn-primary btn-sm" onclick="marcarParcelaPaga('${h.id}', ${parc.numero})" style="padding: 2px 8px; font-size: 10px;">✓ paga</button>`
                        }
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          ` : '<p class="text-xs" style="color: var(--uc-warm-gray);">Sem parcelas configuradas.</p>'}
        </div>
      `;
    }).join('')}
  `;
}

async function novoBancoFlow() {
  const r = await showModal('Novo banco', [
    { label: 'Nome', placeholder: 'Ex: Caixa Econômica · Inter · Nubank' },
    { label: 'Tipo', type: 'select', default: 'corrente', options: [
      { value: 'corrente', label: 'Conta corrente' },
      { value: 'poupanca', label: 'Poupança' },
      { value: 'caixa', label: 'Caixa (dinheiro físico)' }
    ]},
    { label: 'Saldo inicial (R$)', type: 'number', default: '0', placeholder: 'Saldo no momento do cadastro' }
  ], { confirmLabel: 'Cadastrar' });
  if (!r) return;
  const [nome, tipo, saldoInicial] = r;
  if (!nome?.trim()) { toast('Nome obrigatório', '', 'error'); return; }
  await DB.saveBanco({
    id: uid(),
    nome: nome.trim(),
    tipo: tipo || 'corrente',
    saldoInicial: parseFloat(saldoInicial) || 0,
    ativo: true,
    createdAt: Date.now()
  });
  toast('Banco cadastrado', nome.trim(), 'success');
  renderFinanceiro();
}

async function editarBanco(id) {
  const bancos = await DB.getAllBancos();
  const b = bancos.find(x => x.id === id);
  if (!b) return;
  const r = await showModal('Editar banco', [
    { label: 'Nome', default: b.nome },
    { label: 'Tipo', type: 'select', default: b.tipo || 'corrente', options: [
      { value: 'corrente', label: 'Conta corrente' },
      { value: 'poupanca', label: 'Poupança' },
      { value: 'caixa', label: 'Caixa (dinheiro físico)' }
    ]},
    { label: 'Saldo inicial (R$)', type: 'number', default: String(b.saldoInicial || 0) }
  ], { confirmLabel: 'Salvar' });
  if (!r) return;
  const [nome, tipo, saldoInicial] = r;
  if (!nome?.trim()) { toast('Nome obrigatório', '', 'error'); return; }
  b.nome = nome.trim();
  b.tipo = tipo || b.tipo;
  b.saldoInicial = parseFloat(saldoInicial) || 0;
  await DB.saveBanco(b);
  toast('Banco atualizado', '', 'success');
  renderFinanceiro();
}

async function removerBanco(id) {
  const transacoes = await DB.getAllTransacoes();
  const tem = transacoes.some(t => t.contaId === id && t.tipoConta === 'banco');
  if (tem) {
    toast('Banco tem transações', 'Remova as transações primeiro ou desative o banco.', 'error');
    return;
  }
  const ok = await confirmDialog('Remover banco?', 'O banco será apagado. Ação irreversível.', true);
  if (!ok) return;
  await DB.deleteBanco(id);
  renderFinanceiro();
}

async function novoCartaoFlow() {
  const bancos = await DB.getAllBancos();
  const bancoOpts = [
    { value: '', label: '— sem banco vinculado —' },
    ...bancos.map(b => ({ value: b.id, label: b.nome }))
  ];
  const r = await showModal('Novo cartão', [

  if (!nome?.trim()) { toast('Nome obrigatório', '', 'error'); return; }

    id: uid(),
    nome: nome.trim(),
    bancoId: bancoId || null,
    vencimentoDia: venc,
    diaCorte: Math.max(1, venc - 7),
    limite: parseFloat(limite) || 0,
    ativo: true,
    createdAt: Date.now()
  });
  toast('Cartão cadastrado', nome.trim(), 'success');
  renderFinanceiro();
}

// Escapa um valor pra CSV: envolve em aspas se contém ; , " ou quebra de linha;
// duplica aspas internas; aceita null/undefined → ''.
function _csvEscape(v) {
  if (v == null) return '';
  let s = String(v);
  if (/[",;\r\n]/.test(s)) {
    s = '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// rows: array de array (a primeira é cabeçalho).
// Usa ; como separador (compatível com Excel BR) + BOM UTF-8 pra acentos.
function _baixarCSV(filename, rows) {
  const csv = '﻿' + rows.map(row => row.map(_csvEscape).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  if (typeof downloadBlob === 'function') {
    downloadBlob(blob, filename);
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

  const cliById = {}; clientes.forEach(c => cliById[c.id] = c);

  if (dataFim)    lista = lista.filter(t => (t.data || '') <= dataFim);
  if (f.categoriaId) lista = lista.filter(t => t.categoriaId === f.categoriaId);
  if (f.contaId)     lista = lista.filter(t => t.contaId === f.contaId);

  const rows = [['Data','Tipo','Descrição','Valor','Status','Categoria','Conta','Tipo Conta','Cliente','Processo','Honorário ID','Parcela']];
  for (const t of lista) {
    const conta = t.tipoConta === 'cartao' ? cartaoById[t.contaId] : bancoById[t.contaId];

      t.data || '',

      catById[t.categoriaId]?.nome || '',
      conta?.nome || '',
      t.tipoConta || '',
