// Botão "Gerar petição" no processo — escolhe modelo, gera com substituição,
// abre preview com ações de cópia / download .md.
async function gerarPeticaoFlow() {
  const proc = state._processView?.p;
  if (!proc) { toast('Abra um processo primeiro', '', 'error'); return; }

  let modelos = [];
  try { modelos = await DB.getAllPeticaoModelos(); }
  catch (e) { toast('Falha ao buscar modelos', e?.message || '', 'error'); return; }
  const ativos = modelos.filter(m => m.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  if (ativos.length === 0) {
    const ok = await confirmDialog('Nenhum modelo cadastrado',
      'Você ainda não tem modelos de petição. Quer cadastrar agora?');
    if (ok) navigate('modelos');
    return;
  }

  // Carrega cliente vinculado se houver
  let cliente = null;
  if (proc.clienteId) {
    try {
      const clientes = await DB.getAllClientes();
      cliente = clientes.find(c => c.id === proc.clienteId) || null;
    } catch (_) {}
  }

  const modeloOpts = ativos.map(m => {
    const tipoLabel = (PETICAO_TIPOS.find(t => t.value === m.tipo) || {}).label || m.tipo;
    return { value: m.id, label: `[${tipoLabel}] ${m.nome}` };
  });

  const escolha = await showModal('Gerar petição', [
    { label: 'Modelo', name: 'modeloId', type: 'select', default: modeloOpts[0].value, options: modeloOpts }
  ], {
    confirmLabel: 'Gerar',
    intro: `Processo: <strong>${escapeHtml(proc.name || proc.cnj || '—')}</strong>${cliente ? ' · Cliente: <strong>' + escapeHtml(cliente.nome) + '</strong>' : ''}`
  });
  if (!escolha) return;
  const [modeloId] = escolha;
  const modelo = ativos.find(m => m.id === modeloId);
  if (!modelo) return;

  const ctx = _montarContextoPeticao(proc, cliente);
  const conteudoGerado = _aplicarPlaceholders(modelo.conteudo, ctx);

  // Detecta placeholders faltando
  const faltando = [...conteudoGerado.matchAll(/\[FALTANDO:\s*([\w.]+)\]/g)].map(m => m[1]);
  const faltUnicos = [...new Set(faltando)];

  state._peticaoGerada = { conteudo: conteudoGerado, modelo, processo: proc, cliente };
  _abrirModalPeticaoGerada({
    conteudo: conteudoGerado, modelo, processo: proc,
    cliente, faltUnicos, peticaoExistente: null
  });
}

// Modo unificado: usado tanto pra petição recém-gerada (peticaoExistente=null)
// quanto pra editor de uma versão existente (peticaoExistente=doc).
function _abrirModalPeticaoGerada(opts) {
  const { conteudo, modelo, processo, cliente, faltUnicos = [], peticaoExistente = null } = opts || {};
  const isExistente = !!peticaoExistente;
  const titulo = isExistente
    ? `Petição v${peticaoExistente.numeroVersao || 1} · ${escapeHtml(peticaoExistente.titulo || modelo?.nome || '')}`
    : `Petição gerada · ${escapeHtml(modelo?.nome || '')}`;

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal scroll-thin" style="max-width: 820px;">
      <h3 class="modal-title">${titulo}</h3>
      <p class="help-text" style="margin-bottom: 12px;">
        ${faltUnicos.length > 0
          ? `⚠ <strong>${faltUnicos.length} placeholder(s) sem dado</strong>: <code>${faltUnicos.map(escapeHtml).join('</code>, <code>')}</code> — preencha o cadastro do processo/cliente ou edite manualmente abaixo.`
          : isExistente
            ? `Status: <strong>${escapeHtml(peticaoExistente.status || 'rascunho')}</strong> · criado por ${escapeHtml(peticaoExistente.criadoPor || '—')} em ${formatDateTime(peticaoExistente.criadoEm)}`
            : 'Conteúdo pronto · revise antes de protocolar. Salve como versão pra registrar histórico no processo.'}
      </p>
      <div style="margin-bottom: 12px; display: flex; gap: 8px; align-items: end; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 240px;">
          <label class="label">Título da petição</label>
          <input type="text" id="_pgTitulo" class="input" value="${escapeHtml(peticaoExistente?.titulo || (modelo?.nome || ''))}" placeholder="Ex: Contestação · cliente XYZ">
        </div>
        ${isExistente ? `
          <div style="min-width: 140px;">
            <label class="label">Status</label>
            <select class="select" id="_pgStatus">
              <option value="rascunho" ${peticaoExistente.status === 'rascunho' ? 'selected' : ''}>Rascunho</option>
              <option value="final" ${peticaoExistente.status === 'final' ? 'selected' : ''}>Final</option>
              <option value="arquivada" ${peticaoExistente.status === 'arquivada' ? 'selected' : ''}>Arquivada</option>
            </select>
          </div>
        ` : ''}
      </div>
      <div style="margin-bottom: 16px;">
        <label class="label">Conteúdo (editável)</label>
        <textarea id="_pgConteudo" class="textarea" rows="20" style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;">${escapeHtml(conteudo)}</textarea>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button class="btn btn-primary" id="_pgSalvar" style="flex: 1; min-width: 160px;">${isExistente ? '💾 Salvar alterações' : '💾 Salvar versão'}</button>
        ${isExistente ? `<button class="btn btn-secondary" id="_pgNovaVersao" style="min-width: 140px;">+ Nova versão</button>` : ''}
        <button class="btn btn-secondary" id="_pgCopiar" style="min-width: 130px;">📋 Copiar</button>
        <button class="btn btn-secondary" id="_pgMd" style="min-width: 110px;">⬇ .md</button>
        <button class="btn btn-secondary" id="_pgTxt" style="min-width: 110px;">⬇ .txt</button>
        <button class="btn btn-outline" id="_pgFechar" style="min-width: 90px;">Fechar</button>
      </div>
    </div>
  `;
  $('modalContainer').appendChild(modal);
  const cleanup = () => modal.remove();
  const getTexto = () => document.getElementById('_pgConteudo').value;
  const getTitulo = () => document.getElementById('_pgTitulo').value;
  const getStatus = () => document.getElementById('_pgStatus')?.value || 'rascunho';

  const fallbackModelo = modelo || {
    id: peticaoExistente?.modeloId, nome: peticaoExistente?.modeloNome || 'petição', tipo: peticaoExistente?.tipo || 'outro'
  };

  document.getElementById('_pgCopiar').onclick = () => {
    navigator.clipboard.writeText(getTexto()).then(
      () => toast('Copiado para área de transferência', getTitulo(), 'success'),
      () => toast('Falha ao copiar', '', 'error')
    );
  };
  document.getElementById('_pgMd').onclick = () => _baixarPeticaoGerada('md', getTexto(), { ...fallbackModelo, nome: getTitulo() }, processo);
  document.getElementById('_pgTxt').onclick = () => _baixarPeticaoGerada('txt', getTexto(), { ...fallbackModelo, nome: getTitulo() }, processo);
  document.getElementById('_pgFechar').onclick = cleanup;

  document.getElementById('_pgSalvar').onclick = async () => {
    try {
      await _salvarPeticao({
        conteudo: getTexto(),
        titulo: getTitulo(),
        status: isExistente ? getStatus() : 'rascunho',
        modelo: fallbackModelo,
        processo,
        peticaoExistente
      });
      cleanup();
    } catch (e) {
      toast('Falha ao salvar', e?.message || '', 'error');
    }
  };

  if (isExistente) {
    document.getElementById('_pgNovaVersao').onclick = async () => {
      try {
        await _salvarPeticao({
          conteudo: getTexto(),
          titulo: getTitulo(),
          status: 'rascunho',
          modelo: fallbackModelo,
          processo,
          peticaoExistente,
          forcarNovaVersao: true
        });
        cleanup();
      } catch (e) {
        toast('Falha ao criar versão', e?.message || '', 'error');
      }
    };
  }
}

// Persiste a petição. Se forcarNovaVersao OU se for primeira vez (peticaoExistente
// null), cria doc novo. Senão atualiza existente.
async function _salvarPeticao({ conteudo, titulo, status, modelo, processo, peticaoExistente, forcarNovaVersao }) {
  if (!processo?.id) { toast('Processo inválido', '', 'error'); return; }
  if (!conteudo?.trim()) { toast('Conteúdo vazio', '', 'error'); return; }

  const me = (window.UC_Auth?.getUser?.() || {}).email || '';
  const now = Date.now();

  if (forcarNovaVersao && peticaoExistente) {
    // Cria nova versão derivada
    const peticoes = await DB.getPeticoesByProcess(processo.id);
    const linhagemId = peticaoExistente.peticaoOriginalId || peticaoExistente.id;
    const linhagem = peticoes.filter(p => (p.peticaoOriginalId || p.id) === linhagemId);
    const proxNumero = Math.max(...linhagem.map(p => p.numeroVersao || 1), 0) + 1;
    const novo = {
      id: uid(),
      escritorio_id: 'UC',
      processoId: processo.id,
      modeloId: modelo?.id || null,
      modeloNome: modelo?.nome || '',
      tipo: modelo?.tipo || peticaoExistente.tipo || 'outro',
      titulo: titulo?.trim() || (modelo?.nome || 'Petição'),
      conteudoMd: conteudo,
      numeroVersao: proxNumero,
      peticaoOriginalId: linhagemId,
      status: 'rascunho',
      geradoPor: 'manual',
      briefing: '',
      contextoSnapshot: null,
      custoEstimado: 0, tokensInput: 0, tokensOutput: 0,
      criadoEm: now,
      criadoPor: me,
      atualizadoEm: now
    };
    await DB.savePeticao(novo);
    toast('Nova versão criada', 'v' + proxNumero, 'success');
  } else if (peticaoExistente) {
    // Atualiza existente
    const atualizado = {
      ...peticaoExistente,
      titulo: titulo?.trim() || peticaoExistente.titulo,
      conteudoMd: conteudo,
      status: status || peticaoExistente.status || 'rascunho',
      atualizadoEm: now
    };
    await DB.savePeticao(atualizado);
    toast('Petição atualizada', '', 'success');
  } else {
    // Primeira versão
    const novo = {
      id: uid(),
      escritorio_id: 'UC',
      processoId: processo.id,
      modeloId: modelo?.id || null,
      modeloNome: modelo?.nome || '',
      tipo: modelo?.tipo || 'outro',
      titulo: titulo?.trim() || (modelo?.nome || 'Petição'),
      conteudoMd: conteudo,
      numeroVersao: 1,
      peticaoOriginalId: null,
      status: 'rascunho',
      geradoPor: 'manual',
      briefing: '',
      contextoSnapshot: null,
      custoEstimado: 0, tokensInput: 0, tokensOutput: 0,
      criadoEm: now,
      criadoPor: me,
      atualizadoEm: now
    };
    await DB.savePeticao(novo);
    toast('Petição salva como rascunho', 'v1', 'success');
  }

  // Refresh do processo se está aberto
  if (state.currentRoute === 'process') renderProcessDetail();
}

// === Aba Petições no processo (Sprint Pet.1) ===
const PETICAO_STATUS_META = {
  'rascunho':  { label: 'Rascunho',  badge: 'badge-amber', icon: '📝' },
  'final':     { label: 'Final',     badge: 'badge-green', icon: '✓' },
  'arquivada': { label: 'Arquivada', badge: 'badge-gray',  icon: '📦' }
};

function renderProcessPeticoes(p, peticoes) {
  if (!peticoes.length) {
    return `
      <div class="empty-state">
        <h3 class="empty-state-title">Nenhuma petição salva</h3>
        <p class="empty-state-msg">Use o botão <strong>📝 Gerar petição</strong> no header → escolha um modelo → no preview clique em <strong>💾 Salvar versão</strong> pra registrar a petição neste processo.</p>
        <button class="btn btn-primary" onclick="gerarPeticaoFlow()">📝 Gerar petição</button>
      </div>
    `;
  }

  // Agrupa por linhagem (peticaoOriginalId ou self.id)
  const linhagens = {};
  peticoes.forEach(pet => {
    const lin = pet.peticaoOriginalId || pet.id;
    if (!linhagens[lin]) linhagens[lin] = [];
    linhagens[lin].push(pet);
  });
  // Ordena versões dentro de cada linhagem
  Object.values(linhagens).forEach(arr => arr.sort((a, b) => (a.numeroVersao || 1) - (b.numeroVersao || 1)));
  // Ordena linhagens pela data da última versão (desc)
  const linOrdenadas = Object.entries(linhagens).sort((a, b) => {
    const lastA = Math.max(...a[1].map(p => p.atualizadoEm || p.criadoEm || 0));
    const lastB = Math.max(...b[1].map(p => p.atualizadoEm || p.criadoEm || 0));
    return lastB - lastA;
  });

  return `
    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray); margin: 0;">${peticoes.length} versão(ões) em ${linOrdenadas.length} linhagem(ns)</p>
      <button class="btn btn-primary btn-sm" onclick="gerarPeticaoFlow()">📝 Gerar nova petição</button>
    </div>
    ${linOrdenadas.map(([linId, versoes]) => {
      const ultima = versoes[versoes.length - 1];
      const statusMeta = PETICAO_STATUS_META[ultima.status] || PETICAO_STATUS_META.rascunho;
      const tipoLabel = (PETICAO_TIPOS.find(t => t.value === ultima.tipo) || {}).label || ultima.tipo;
      return `
        <div class="card mb-3">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span style="font-size: 14px;">${statusMeta.icon}</span>
                <strong style="color: var(--uc-black); font-size: 14px;">${escapeHtml(ultima.titulo || 'Petição')}</strong>
                <span class="badge ${statusMeta.badge}" style="font-size: 9px;">${statusMeta.label}</span>
                <span class="badge badge-gray" style="font-size: 9px;">${escapeHtml(tipoLabel)}</span>
                ${versoes.length > 1 ? `<span class="badge badge-gold" style="font-size: 9px;">${versoes.length} versões</span>` : ''}
              </div>
              <div style="font-size: 11px; color: var(--uc-warm-gray); margin-top: 4px;">
                Última: v${ultima.numeroVersao} · ${formatDateTime(ultima.atualizadoEm || ultima.criadoEm)}${ultima.criadoPor ? ' · ' + escapeHtml(ultima.criadoPor) : ''}
                ${ultima.modeloNome ? ' · modelo: ' + escapeHtml(ultima.modeloNome) : ''}
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            ${versoes.slice().reverse().map(v => {
              const sm = PETICAO_STATUS_META[v.status] || PETICAO_STATUS_META.rascunho;
              const isLast = v.id === ultima.id;
              return `
                <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: ${isLast ? 'var(--uc-cream)' : 'transparent'}; border-radius: 4px; font-size: 12px;">
                  <span style="font-weight: 600; min-width: 32px;">v${v.numeroVersao || 1}</span>
                  <span class="badge ${sm.badge}" style="font-size: 9px;">${sm.label}</span>
                  <span style="color: var(--uc-warm-gray); flex: 1;">${formatDateTime(v.atualizadoEm || v.criadoEm)}</span>
                  <button class="btn btn-ghost btn-sm" onclick="abrirEditorPeticao('${v.id}')" title="Abrir versão" style="padding: 2px 8px;">👁</button>
                  ${isLast && v.status !== 'arquivada' ? `<button class="btn btn-ghost btn-sm" onclick="arquivarPeticao('${v.id}')" title="Arquivar" style="padding: 2px 6px;">📦</button>` : ''}
                  <button class="btn btn-ghost btn-sm" onclick="removerPeticao('${v.id}')" title="Remover" style="padding: 2px 6px;">🗑</button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

async function abrirEditorPeticao(id) {
  const todas = await DB.getAllPeticoes();
  const pet = todas.find(x => x.id === id);
  if (!pet) { toast('Petição não encontrada', '', 'error'); return; }

  // Carrega processo
  const processo = await DB.getProcess(pet.processoId);
  if (!processo) { toast('Processo da petição não encontrado', '', 'error'); return; }

  // Carrega cliente se houver
  let cliente = null;
  if (processo.clienteId) {
    try {
      const clientes = await DB.getAllClientes();
      cliente = clientes.find(c => c.id === processo.clienteId) || null;
    } catch (_) {}
  }

  // Tenta resolver o modelo (pode ter sido removido)
  let modelo = null;
  if (pet.modeloId) {
    try {
      const modelos = await DB.getAllPeticaoModelos();
      modelo = modelos.find(m => m.id === pet.modeloId) || null;
    } catch (_) {}
  }
  if (!modelo) {
    modelo = { id: pet.modeloId, nome: pet.modeloNome || 'petição', tipo: pet.tipo || 'outro' };
  }

  state._peticaoGerada = { conteudo: pet.conteudoMd, modelo, processo, cliente };
  _abrirModalPeticaoGerada({
    conteudo: pet.conteudoMd,
    modelo,
    processo,
    cliente,
    faltUnicos: [],
    peticaoExistente: pet
  });
}

async function arquivarPeticao(id) {
  const todas = await DB.getAllPeticoes();
  const pet = todas.find(x => x.id === id);
  if (!pet) return;
  pet.status = 'arquivada';
  pet.atualizadoEm = Date.now();
  await DB.savePeticao(pet);
  toast('Petição arquivada', '', 'success');
  if (state.currentRoute === 'process') renderProcessDetail();
}

async function removerPeticao(id) {
  const ok = await confirmDialog('Remover esta versão?', 'A versão será apagada permanentemente. Outras versões da mesma linhagem permanecem.', true);
  if (!ok) return;
  await DB.deletePeticao(id);
  toast('Versão removida', '', 'success');
  if (state.currentRoute === 'process') renderProcessDetail();
}

function _baixarPeticaoGerada(formato, texto, modelo, processo) {
  const g = state._peticaoGerada;
  const txt = texto || g?.conteudo || '';
  const m = modelo || g?.modelo || { nome: 'peticao' };
  const p = processo || g?.processo || {};
  const ext = formato === 'md' ? 'md' : 'txt';
  const slug = (m.nome || 'peticao').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const cnj = p.cnj ? '_' + p.cnj.replace(/[^0-9]/g, '') : '';
  const fname = `${slug}${cnj}_${new Date().toISOString().slice(0,10)}.${ext}`;
  downloadBlob(new Blob([txt], { type: ext === 'md' ? 'text/markdown' : 'text/plain' }), fname);
  toast('Baixado', fname, 'success');
}

// ====================================================================
// === MÓDULO EQUIPE — Indicadores por advogado (v6.32) ==============
// ====================================================================
// Drill-down individual: dado um advogado e um mês, mostra carga
// atual + métricas do mês + listas operacionais (próximos prazos,
// vencidos não-cumpridos, próximos compromissos, processos por papel).

async function renderEquipe() {
  // Estado: advogado selecionado + mês de referência
  if (!state._equipeRef) {
    const me = (window.UC_Auth?.getUser?.() || {}).email || '';
    const meuNome = defaultAdvogado(me);
    const hoje = new Date();
    state._equipeRef = {
      advogado: meuNome || ADVOGADOS[0] || '',
      ano: hoje.getFullYear(),
      mes: hoje.getMonth()
    };
  }
  const { advogado, ano, mes } = state._equipeRef;
  const range = _mesRange(ano, mes);
  const rangePrev = _mesRange(mes === 0 ? ano - 1 : ano, mes === 0 ? 11 : mes - 1);

  if (!advogado) {
    $('appContent').innerHTML = `
      <div class="page-header"><h1 class="page-title"><span class="smallcaps-prefix">Equipe</span></h1></div>
      <div class="card empty-state">
        <p class="empty-state-msg">Lista de advogados vazia. Configure em <code>ADVOGADO_BY_EMAIL</code> no código fonte.</p>
      </div>
    `;
    return;
  }

  const [processos, prazos, compromissos, comunicacoes] = await Promise.all([
    DB.getAllProcesses(),
    DB.getAllDeadlines(),
    DB.getAllCompromissos(),
    DB.getAllComunicacoes ? DB.getAllComunicacoes() : Promise.resolve([])
  ]);

  // ====== Snapshot atual (carga ativa, independente de mês) ======
  const today = new Date(); today.setHours(0,0,0,0);
  const todayMs = today.getTime();

  // Processos onde é titular ou suplente
  const procsTitular = processos.filter(p => p.advogadoResponsavel === advogado);
  const procsSuplente = processos.filter(p => p.advogadoSuplente === advogado);
  const procsAtivosTitular = procsTitular.filter(p => p.status !== 'archived');

  // Prazos ativos sob responsabilidade direta (titular do processo)
  const ativosSnapshot = prazos.filter(d => {
    if (!prazoEstaAtivo(d)) return false;
    const proc = processos.find(p => p.id === d.processId);
    return proc?.advogadoResponsavel === advogado;
  });
  const vencidos = ativosSnapshot.filter(d => new Date(d.deadlineDate) < today);
  const urgentes = ativosSnapshot.filter(d => {
    const dl = new Date(d.deadlineDate); dl.setHours(0,0,0,0);
    const days = Math.ceil((dl - today) / 86400000);
    return days >= 0 && days <= 3;
  });

  // ====== Métricas do mês ======
  const cumpridos = prazos.filter(d => {
    if (d.status !== 'cumprido') return false;
    if (!_isDateInRange(d.cumprimento?.dataCumprimento, range)) return false;
    const proc = processos.find(p => p.id === d.processId);
    return proc?.advogadoResponsavel === advogado;
  });
  const cumpridosPrev = prazos.filter(d => {
    if (d.status !== 'cumprido') return false;
    if (!_isDateInRange(d.cumprimento?.dataCumprimento, rangePrev)) return false;
    const proc = processos.find(p => p.id === d.processId);
    return proc?.advogadoResponsavel === advogado;
  });
  const perdidosNoMes = prazos.filter(d => {
    if (d.status !== 'perdido') return false;
    if (!_isDateInRange(d.deadlineDate, range)) return false;
    const proc = processos.find(p => p.id === d.processId);
    return proc?.advogadoResponsavel === advogado;
  });

  const compsDoMes = compromissos.filter(c => {
    if (!_isDateInRange(c.dataHoraInicio, range)) return false;
    return c.responsavel === advogado || (c.participantes || []).includes(advogado);
  });
  const compsRealizados = compsDoMes.filter(c => c.status === 'realizado').length;
  const compsCancelados = compsDoMes.filter(c => c.status === 'cancelado').length;
  const compsDoMesPrev = compromissos.filter(c => {
    if (!_isDateInRange(c.dataHoraInicio, rangePrev)) return false;
    return c.responsavel === advogado || (c.participantes || []).includes(advogado);
  });

  const comsDoMes = (comunicacoes || []).filter(c => {
    if (!_isInRange(c.data || c.createdAt, range)) return false;
    return c.atendidoPor === advogado || c.criadoPor === advogado;
  });

  // ====== Próximos compromissos (futuro, status ativo) ======
  const proxComps = compromissos.filter(c => {
    if (c.status === 'cancelado' || c.status === 'realizado') return false;
    if (c.responsavel !== advogado && !(c.participantes || []).includes(advogado)) return false;
    if (!c.dataHoraInicio) return false;
    return new Date(c.dataHoraInicio).getTime() >= todayMs;
  }).sort((a, b) => (a.dataHoraInicio || '').localeCompare(b.dataHoraInicio || '')).slice(0, 8);

  // ====== Próximos prazos (ativos, ordenados por vencimento) ======
  const proxPrazos = ativosSnapshot.slice().sort((a, b) => new Date(a.deadlineDate) - new Date(b.deadlineDate)).slice(0, 8);

  const ehMesAtual = ano === new Date().getFullYear() && mes === new Date().getMonth();
  const cargaCor = ativosSnapshot.length >= 15 ? 'var(--uc-red)' : ativosSnapshot.length >= 8 ? 'var(--uc-amber)' : 'var(--uc-graphite)';

  $('appContent').innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="smallcaps-prefix">Equipe</span></h1>
        <p class="page-subtitle">Indicadores individuais · ${escapeHtml(advogado)}${ehMesAtual ? ' <span class="badge badge-gold" style="font-size:9px;">EM CURSO</span>' : ''}</p>
      </div>
      <div class="flex gap-2 items-center flex-wrap">
        <select class="select" style="min-width: 200px;" onchange="_setEquipeAdvogado(this.value)">
          ${ADVOGADOS.map(n => `<option value="${escapeHtml(n)}" ${n === advogado ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="_navegarMesEquipe(-1)" title="Mês anterior">‹</button>
        <input type="month" class="input" style="max-width: 150px;" value="${ano}-${String(mes+1).padStart(2,'0')}" onchange="_setMesEquipe(this.value)">
        <button class="btn btn-ghost btn-sm" onclick="_navegarMesEquipe(1)" title="Próximo mês">›</button>
      </div>
    </div>

    <!-- Stats principais -->
    <div class="grid gap-3 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));">
      <div class="stat-card" style="${ativosSnapshot.length >= 15 ? 'background: var(--uc-red-soft); border-color: var(--uc-red);' : ativosSnapshot.length >= 8 ? 'background: var(--uc-amber-soft);' : ''}">
        <div class="stat-label">Carga atual</div>
        <div class="stat-value" style="color: ${cargaCor};">${ativosSnapshot.length}</div>
        <div class="stat-meta">prazos ativos · titular</div>
      </div>
      <div class="stat-card" style="${vencidos.length > 0 ? 'background: var(--uc-red-soft); border-color: var(--uc-red);' : ''}">
        <div class="stat-label">Vencidos</div>
        <div class="stat-value" style="${vencidos.length > 0 ? 'color: var(--uc-red);' : ''}">${vencidos.length}</div>
        <div class="stat-meta">${vencidos.length > 0 ? '⚠ regularizar' : 'OK'}</div>
      </div>
      <div class="stat-card" style="${urgentes.length > 0 ? 'background: var(--uc-amber-soft);' : ''}">
        <div class="stat-label">Urgentes</div>
        <div class="stat-value">${urgentes.length}</div>
        <div class="stat-meta">≤ 3 dias</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cumpridos no mês</div>
        <div class="stat-value" style="color: var(--uc-green);">${cumpridos.length}</div>
        <div class="stat-meta">vs ${cumpridosPrev.length} mês ant. · ${_renderDelta(_delta(cumpridos.length, cumpridosPrev.length))}</div>
      </div>
      <div class="stat-card" style="${perdidosNoMes.length > 0 ? 'background: var(--uc-red-soft);' : ''}">
        <div class="stat-label">Perdidos no mês</div>
        <div class="stat-value" style="${perdidosNoMes.length > 0 ? 'color: var(--uc-red);' : ''}">${perdidosNoMes.length}</div>
        <div class="stat-meta">${perdidosNoMes.length > 0 ? '⚠ revisar' : 'Sem perdas'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Compromissos</div>
        <div class="stat-value">${compsDoMes.length}</div>
        <div class="stat-meta">${compsRealizados} realizados · vs ${compsDoMesPrev.length} mês ant.</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Comunicações</div>
        <div class="stat-value">${comsDoMes.length}</div>
        <div class="stat-meta">no mês</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Processos · titular</div>
        <div class="stat-value">${procsAtivosTitular.length}</div>
        <div class="stat-meta">${procsTitular.length} no total · ${procsSuplente.length} como suplente</div>
      </div>
    </div>

    ${vencidos.length > 0 ? `
      <div class="card mb-4" style="border-left: 3px solid var(--uc-red); background: var(--uc-red-soft);">
        <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-red);">⚠ Prazos vencidos não-cumpridos · ${vencidos.length}</h3>
        ${vencidos.sort((a, b) => new Date(a.deadlineDate) - new Date(b.deadlineDate)).slice(0, 10).map(d => {
          const proc = processos.find(p => p.id === d.processId);
          const dl = new Date(d.deadlineDate); dl.setHours(0,0,0,0);
          const dias = Math.abs(Math.ceil((dl - today) / 86400000));
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(168, 71, 45, 0.2); font-size:13px;">
              <div style="flex:1; min-width:0;">
                <div style="color: var(--uc-red); font-weight: 500;">${escapeHtml(d.description || d.type || 'Prazo')}</div>
                <div style="font-size: 11px; color: var(--uc-warm-gray);">${escapeHtml(proc?.name || '—')}${proc?.cnj ? ' · ' + escapeHtml(proc.cnj) : ''} · vencimento ${formatDate(d.deadlineDate)}</div>
              </div>
              <div class="flex gap-1 items-center">
                <span class="badge badge-red" style="font-size:9px;">há ${dias}d</span>
                <button class="btn btn-ghost btn-sm" onclick="abrirModalCumprimento('${d.id}')" title="Marcar como cumprido" style="padding: 2px 6px;">✓</button>
                ${proc ? `<button class="btn btn-ghost btn-sm" onclick="navigate('process', { currentProcessId: '${proc.id}' })" title="Abrir processo" style="padding: 2px 6px;">↗</button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}

    <div class="grid gap-4 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));">
      <div class="card">
        <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Próximos prazos · ${proxPrazos.length}</h3>
        ${proxPrazos.length === 0 ? '<p class="help-text">Nenhum prazo ativo sob responsabilidade.</p>' : proxPrazos.map(d => {
          const proc = processos.find(p => p.id === d.processId);
          const dl = new Date(d.deadlineDate); dl.setHours(0,0,0,0);
          const days = Math.ceil((dl - today) / 86400000);
          let cls = 'safe', label = days + 'd';
          if (days < 0) { cls = 'expired'; label = 'há ' + Math.abs(days) + 'd'; }
          else if (days === 0) { cls = 'urgent'; label = 'HOJE'; }
          else if (days <= 3) { cls = 'urgent'; label = days + 'd'; }
          else if (days <= 7) { cls = 'warning'; label = days + 'd'; }
          const badgeClass = cls === 'urgent' || cls === 'expired' ? 'badge-red' : cls === 'warning' ? 'badge-amber' : 'badge-green';
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--uc-line-soft); font-size:13px; cursor:pointer;" onclick="${proc ? `navigate('process', { currentProcessId: '${proc.id}' })` : ''}">
              <div style="flex:1; min-width:0;">
                <div style="font-weight: 500;">${escapeHtml(d.description || d.type)}</div>
                <div style="font-size: 11px; color: var(--uc-warm-gray);">${escapeHtml(proc?.name || '—')}${proc?.cnj ? ' · ' + escapeHtml(proc.cnj) : ''}</div>
              </div>
              <span class="badge ${badgeClass}" style="font-size:9px;">${label}</span>
            </div>
          `;
        }).join('')}
      </div>

      <div class="card">
        <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Próximos compromissos · ${proxComps.length}</h3>
        ${proxComps.length === 0 ? '<p class="help-text">Nenhum compromisso futuro.</p>' : proxComps.map(c => {
          const meta = _agTipoMeta(c.tipo);
          const dt = new Date(c.dataHoraInicio);
          const days = Math.ceil((dt - today) / 86400000);
          const dataLabel = days === 0 ? 'HOJE' : days === 1 ? 'AMANHÃ' : days + 'd · ' + formatDate(dt);
          const hora = dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--uc-line-soft); font-size:13px; cursor:pointer;" onclick="navigate('agenda')">
              <div style="flex:1; min-width:0;">
                <div style="font-weight: 500;"><span style="color: ${meta.cor};">${meta.icon}</span> ${escapeHtml(c.titulo || meta.label)}</div>
                <div style="font-size: 11px; color: var(--uc-warm-gray);">${dataLabel} ${hora}${c.local ? ' · ' + escapeHtml(c.local) : ''}</div>
              </div>
              <span class="badge ${days <= 1 ? 'badge-red' : days <= 7 ? 'badge-amber' : 'badge-green'}" style="font-size:9px;">${days <= 0 ? 'HOJE' : days + 'd'}</span>
            </div>
          `;
        }).join('')}
      </div>

      <div class="card">
        <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Processos como titular · ${procsAtivosTitular.length} ativos</h3>
        ${procsAtivosTitular.length === 0 ? '<p class="help-text">Nenhum processo como titular ativo.</p>' : procsAtivosTitular.slice(0, 8).map(p => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--uc-line-soft); font-size:13px; cursor:pointer;" onclick="navigate('process', { currentProcessId: '${p.id}' })">
            <div style="flex:1; min-width:0;">
              <div style="font-weight: 500;">${escapeHtml(p.name || '—')}</div>
              <div style="font-size: 11px; color: var(--uc-warm-gray);">${p.cnj ? escapeHtml(p.cnj) : '—'}${p.area ? ' · ' + escapeHtml(p.area) : ''}</div>
            </div>
            <span style="font-size: 11px; color: var(--uc-warm-gray);">${formatDate(p.updatedAt, { relative: true })}</span>
          </div>
        `).join('')}
        ${procsAtivosTitular.length > 8 ? `<p class="help-text" style="margin-top:6px;">+${procsAtivosTitular.length - 8} processos</p>` : ''}
      </div>

      ${procsSuplente.length > 0 ? `
        <div class="card">
          <h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-black);">Como suplente · ${procsSuplente.length}</h3>
          <p class="help-text" style="margin-bottom:8px;">Cobre o titular em caso de ausência.</p>
          ${procsSuplente.slice(0, 8).map(p => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--uc-line-soft); font-size:13px; cursor:pointer;" onclick="navigate('process', { currentProcessId: '${p.id}' })">
              <div style="flex:1; min-width:0;">
                <div style="font-weight: 500;">${escapeHtml(p.name || '—')}</div>
                <div style="font-size: 11px; color: var(--uc-warm-gray);">${p.cnj ? escapeHtml(p.cnj) : '—'} · titular: ${escapeHtml(p.advogadoResponsavel || '—')}</div>
              </div>
            </div>
          `).join('')}
          ${procsSuplente.length > 8 ? `<p class="help-text" style="margin-top:6px;">+${procsSuplente.length - 8} processos</p>` : ''}
        </div>
      ` : ''}
    </div>

    <p class="help-text" style="text-align: center; margin-top: 24px;">
      Snapshot gerado em ${formatDateTime(Date.now())}
    </p>
  `;
}

function _setEquipeAdvogado(nome) {
  state._equipeRef = state._equipeRef || { ano: new Date().getFullYear(), mes: new Date().getMonth() };
  state._equipeRef.advogado = nome;
  renderEquipe();
}
function _setMesEquipe(yyyymm) {
  const [a, m] = (yyyymm || '').split('-').map(Number);
  if (!a || !m) return;
  state._equipeRef = state._equipeRef || { advogado: ADVOGADOS[0] };
  state._equipeRef.ano = a;
  state._equipeRef.mes = m - 1;
  renderEquipe();
}
function _navegarMesEquipe(delta) {
  const ref = state._equipeRef || { ano: new Date().getFullYear(), mes: new Date().getMonth(), advogado: ADVOGADOS[0] };
  let novoAno = ref.ano, novoMes = ref.mes + delta;
  if (novoMes < 0) { novoMes = 11; novoAno--; }
  if (novoMes > 11) { novoMes = 0; novoAno++; }
  state._equipeRef = { ...ref, ano: novoAno, mes: novoMes };
  renderEquipe();
}

  return `
    <div class="card tool-card card-hover" onclick="runToolAction('${action}')">
      <div class="tool-icon ${gold ? 'tool-icon-gold' : ''}">${icon}</div>
      <div class="tool-name">${name}</div>
      <div class="tool-desc">${desc}</div>
    </div>
  `;
}

async function handleToolFiles(fileList) {
  if (!fileList || !fileList.length) return;
  const arr = Array.from(fileList);
  const pdfs = arr.filter(f => f && f.type === 'application/pdf');
  const ignored = arr.length - pdfs.length;
  if (ignored > 0) toast('Arquivos ignorados', `${ignored} item(s) não eram PDF.`, 'warning');
  if (pdfs.length === 0) { toast('Nenhum PDF', 'Selecione ao menos um arquivo PDF.', 'error'); return; }
  // Lê cada PDF e adiciona à lista (sem duplicar por nome+tamanho)
  for (const file of pdfs) {
    const dup = _toolsState.files.some(x => x.fileName === file.name && x.file.size === file.size);
    if (dup) continue;
    const fileBytes = await file.arrayBuffer();
    _toolsState.files.push({ file, fileName: file.name, fileBytes });
  }
  _toolsState.result = null;
  showToolFileInfo();
}

function removeToolFile(index) {
  _toolsState.files.splice(index, 1);
  showToolFileInfo();
}

function clearToolFiles() {
  _toolsState.files = [];
  _toolsState.file = null;
  _toolsState.fileBytes = null;
  _toolsState.fileName = '';
  showToolFileInfo();
}

function showToolFileInfo() {
  const info = $('toolFileInfo');
  const files = _toolsState.files;
  if (!files.length) {
    info.classList.add('hidden');
    info.innerHTML = '';
    return;
  }
  info.classList.remove('hidden');
  const totalBytes = files.reduce((s, x) => s + x.file.size, 0);
  info.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <strong style="font-size: 13px;">${files.length} arquivo${files.length > 1 ? 's' : ''} selecionado${files.length > 1 ? 's' : ''} · ${formatBytes(totalBytes)}</strong>
      <button class="btn btn-ghost btn-sm" onclick="clearToolFiles()">Limpar todos</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      ${files.map((x, i) => `
        <div style="background: var(--uc-cream); border: 1px solid var(--uc-line); padding: 10px 12px; border-radius: 6px; display: flex; gap: 10px; align-items: center;">
          <span style="font-size: 20px;">📄</span>
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight: 600; color: var(--uc-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;">${escapeHtml(x.fileName)}</div>
            <div style="font-size: 11px; color: var(--uc-warm-gray);">${formatBytes(x.file.size)}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="removeToolFile(${i})" title="Remover">✕</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function runToolAction(action) {
  // Sincroniza arquivo "atual" (compatibilidade) caso _toolsState.file esteja stale
  if (!_toolsState.files || _toolsState.files.length === 0) {
    if (_toolsState.file) {
      _toolsState.files = [{ file: _toolsState.file, fileName: _toolsState.fileName, fileBytes: _toolsState.fileBytes }];
    } else {
      toast('Selecione pelo menos um PDF antes', '', 'error');
      return;
    }
  }
  $('toolResultArea').innerHTML = '';
  _toolsState._batchMode = _toolsState.files.length > 1;
  _toolsState._batchTotal = _toolsState.files.length;
  for (let i = 0; i < _toolsState.files.length; i++) {
    const f = _toolsState.files[i];
    _toolsState.file = f.file;
    _toolsState.fileName = f.fileName;
    _toolsState.fileBytes = f.fileBytes;
    _toolsState._batchIndex = i;
    try {
      await _runToolActionSingle(action);
    } catch (err) {
      console.error('Erro processando ' + f.fileName, err);
      $('toolResultArea').insertAdjacentHTML('beforeend', `<div class="card mb-3" style="border-left: 3px solid var(--uc-red);"><strong style="color: var(--uc-red);">Erro em ${escapeHtml(f.fileName)}</strong><p>${escapeHtml(err.message || String(err))}</p></div>`);
    }
  }
  _toolsState._batchMode = false;
}

async function _runToolActionSingle(action) {
  if (!_toolsState.file) { toast('Selecione um PDF antes', '', 'error'); return; }
  const ra = $('toolResultArea');
  // ID único por iteração para o loader/progresso (evita colisão em batch)
  const idx = _toolsState._batchIndex || 0;
  const progId = 'toolProgress_' + idx;
  const barId = 'toolProgressBar_' + idx;
  const headerLabel = _toolsState._batchMode
    ? `Processando ${idx + 1}/${_toolsState._batchTotal}: ${escapeHtml(_toolsState.fileName)}`
    : 'Processando...';
  ra.insertAdjacentHTML('beforeend', `<div class="card mb-3 _toolLoader" data-loader-idx="${idx}"><div class="flex items-center gap-3"><div class="spinner"></div><div><strong>${headerLabel}</strong><div id="${progId}" class="help-text">Aguarde</div></div></div><div class="progress-wrap"><div class="progress-bar-bg"><div class="progress-bar-fg" id="${barId}"></div></div></div></div>`);
  const progressCb = (msg, pct = null) => {
    const pe = document.getElementById(progId);
    if (pe) pe.textContent = msg;
    if (pct !== null) {
      const be = document.getElementById(barId);
      if (be) be.style.width = (pct * 100) + '%';
    }
  };
  try {
    const bytes = _toolsState.fileBytes;
    const baseName = _toolsState.fileName.replace(/\.pdf$/i, '');
    if (action === 'compressAggressive') {
      const blob = await processCompressAggressive(bytes, 150, 0.7, progressCb);
      const reduction = Math.round((1 - blob.size / _toolsState.file.size) * 100);
      showToolResult({ blob, name: baseName + '_comprimido.pdf', summary: `Compressão forte concluída · ${formatBytes(_toolsState.file.size)} → ${formatBytes(blob.size)} (${reduction}%)` });
    } else if (action === 'compressLight') {
      const blob = await processCompressLight(bytes);
      const reduction = Math.round((1 - blob.size / _toolsState.file.size) * 100);
      showToolResult({ blob, name: baseName + '_otimizado.pdf', summary: `Compressão leve concluída · ${formatBytes(_toolsState.file.size)} → ${formatBytes(blob.size)} (${reduction}%)` });
    } else if (action === 'extractText') {
      const text = await processExtractText(bytes, progressCb);
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      showToolResult({ blob, name: baseName + '.txt', summary: `${text.length.toLocaleString('pt-BR')} caracteres extraídos`, preview: text.slice(0, 500) });
    } else if (action === 'ocr') {
      const text = await processOcr(bytes, 'por', 200, progressCb);
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      showToolResult({ blob, name: baseName + '_ocr.txt', summary: `${text.length.toLocaleString('pt-BR')} caracteres reconhecidos`, preview: text.slice(0, 500) });
    } else if (action === 'ocrSelective') {
      const r = await processOcrSelective(bytes, 'por', 200, progressCb);
      const blob = new Blob([r.text], { type: 'text/plain;charset=utf-8' });
      showToolResult({ blob, name: baseName + '_ocr_inteligente.txt', summary: `${r.text.length.toLocaleString('pt-BR')} caracteres · ${r.ocrPages}/${r.totalPages} páginas precisaram OCR`, preview: r.text.slice(0, 500) });
    } else if (action === 'searchablePdf') {
      const blob = await processSearchablePdf(bytes, 'por', 200, 0.85, progressCb);
      showToolResult({ blob, name: baseName + '_pesquisavel.pdf', summary: `PDF pesquisável criado · ${formatBytes(blob.size)}` });
    } else if (action === 'split') {
      const r = await showModal('Dividir PDF', [
        { label: 'Páginas por parte', type: 'number', default: '50', min: '1', max: '500' }
      ], { confirmLabel: 'Dividir' });
      if (!r) { ra.innerHTML = ''; return; }
      const blob = await processSplit(bytes, baseName, parseInt(r[0]), progressCb);
      showToolResult({ blob, name: baseName + '_dividido.zip', summary: `Dividido em partes de ${r[0]} páginas` });
    } else if (action === 'toImages') {
      const blob = await processToImages(bytes, 150, 0.85, progressCb);
      showToolResult({ blob, name: baseName + '_imagens.zip', summary: `Convertido para imagens JPG`});
    } else if (action === 'indexAutos') {
      const indexed = await processIndexAutos(bytes, progressCb);
      const md = generateIndexMarkdown(indexed, baseName);
      const html = generateTimelineHtml(indexed, baseName);
      // Save to linked process if any
      if (_toolsState.linkedProcessId) {
        await saveIndexedToProcess(_toolsState.linkedProcessId, indexed, _toolsState.fileName, bytes);
      }
      showToolResult({
        summary: `${indexed.events.length} eventos detectados em ${indexed.totalPages} páginas${_toolsState.linkedProcessId ? ' · salvos no processo' : ''}`,
        custom: `
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="stat-card"><div class="stat-label">Eventos</div><div class="stat-value">${indexed.events.length}</div></div>
            <div class="stat-card"><div class="stat-label">Páginas</div><div class="stat-value">${indexed.totalPages}</div></div>
          </div>
          ${indexed.processNumber ? `<p class="text-sm mb-3" style="color: var(--uc-warm-gray);"><strong>Nº detectado:</strong> <code>${escapeHtml(indexed.processNumber)}</code></p>` : ''}
          <div class="flex gap-2 flex-wrap">
            <button class="btn btn-secondary btn-sm" onclick='downloadBlob(new Blob([${JSON.stringify(md)}], {type:"text/markdown"}), "${baseName}_indice.md")'>⬇ Baixar índice (.md)</button>
            <button class="btn btn-outline btn-sm" onclick='downloadBlob(new Blob([${JSON.stringify(html)}], {type:"text/html"}), "${baseName}_timeline.html")'>⬇ Timeline (HTML)</button>
            ${_toolsState.linkedProcessId ? `<button class="btn btn-primary btn-sm" onclick="navigate('process', { currentProcessId: '${_toolsState.linkedProcessId}' })">Ver processo →</button>` : ''}
          </div>
          <details class="mt-3">
            <summary style="cursor:pointer; font-weight: 500;">Ver primeiros eventos</summary>
            <div style="margin-top: 8px; max-height: 300px; overflow-y: auto;" class="scroll-thin">
              ${indexed.events.slice(0, 20).map(e => `<div style="padding: 6px 0; border-bottom: 1px solid var(--uc-line-soft); font-size: 13px;"><strong>Ev. ${escapeHtml(e.eventNumber)}</strong> · ${escapeHtml(e.type)} · ${escapeHtml(e.date || '—')} · pgs ${e.startPage}–${e.endPage}</div>`).join('')}
              ${indexed.events.length > 20 ? `<p class="help-text" style="margin-top:8px;">... e mais ${indexed.events.length - 20} eventos.</p>` : ''}
            </div>
          </details>
        `
      });
    } else if (action === 'extractCitations') {
      progressCb('Extraindo texto...', 0.3);
      const text = await processExtractText(bytes);
      progressCb('Detectando citações...', 0.7);
      const citations = detectCitations(text);
      const total = Object.values(citations).reduce((s, a) => s + a.length, 0);
      // Save to linked process
      if (_toolsState.linkedProcessId && total > 0) {
        for (const [type, items] of Object.entries(citations)) {
          for (const cit of items) {
            await DB.saveJurisprudence({
              id: uid(), processId: _toolsState.linkedProcessId,
              type, citation: cit, source: _toolsState.fileName, addedAt: Date.now()
            });
          }
        }
      }
      showToolResult({
        summary: `${total} citações detectadas${_toolsState.linkedProcessId ? ' · vinculadas ao processo' : ''}`,
        custom: total === 0 ? '<p style="color: var(--uc-warm-gray);">Nenhuma jurisprudência detectada.</p>' : `
          ${Object.entries(citations).filter(([t, items]) => items.length > 0).map(([t, items]) => `
            <div class="card mb-3">
              <h4 class="font-serif font-semibold smallcaps mb-2" style="color: var(--uc-black);">${escapeHtml(t)} · ${items.length}</h4>
              <div class="flex flex-wrap gap-2">${items.slice(0, 30).map(i => `<span class="badge badge-gold">${escapeHtml(i)}</span>`).join('')}</div>
              ${items.length > 30 ? `<p class="help-text" style="margin-top: 8px;">+${items.length - 30} citações</p>` : ''}
            </div>
          `).join('')}
        `
      });
    } else if (action === 'detectDeadlines') {
      progressCb('Extraindo texto...', 0.3);
      const text = await processExtractText(bytes);
      progressCb('Indexando eventos...', 0.6);
      const indexed = await processIndexAutos(bytes);
      progressCb('Detectando intimações...', 0.9);
      const dl = detectDeadlines(text, indexed.events);
      showToolResult({
        summary: dl.lastIntimation ? `Intimação detectada: ${dl.lastIntimation.type} em ${dl.lastIntimation.date}` : 'Nenhuma intimação detectada',
        custom: !dl.lastIntimation ? '<p style="color: var(--uc-warm-gray);">Nenhuma intimação encontrada no texto.</p>' : `
          <div class="card mb-3">
            <p style="font-size: 13px;"><strong>Última intimação:</strong> ${escapeHtml(dl.lastIntimation.type)} em <strong>${escapeHtml(dl.lastIntimation.date)}</strong></p>
            <p class="help-text" style="margin-top: 4px;">"${escapeHtml(dl.lastIntimation.context.substring(0, 200))}..."</p>
          </div>
          <h4 class="font-serif font-semibold smallcaps mb-2">Cálculos (dias úteis)</h4>
          ${dl.deadlines.map(d => `
            <div class="deadline-row ${d.remaining < 0 ? 'expired' : d.remaining <= 5 ? 'urgent' : d.remaining <= 14 ? 'warning' : 'safe'}">
              <div><strong>${d.days} dias úteis</strong><div class="help-text">vencimento ${d.deadline.toLocaleDateString('pt-BR')}</div></div>
              <span class="badge ${d.remaining < 0 ? 'badge-red' : d.remaining <= 5 ? 'badge-red' : d.remaining <= 14 ? 'badge-amber' : 'badge-green'}">${d.remaining > 0 ? d.remaining + 'd' : 'EXPIRADO ' + Math.abs(d.remaining) + 'd'}</span>
            </div>
          `).join('')}
          <p class="help-text" style="margin-top: 12px;">⚠️ Cálculos não consideram feriados, suspensões processuais ou prazos especiais. Sempre confirme manualmente.</p>
        `
      });
    } else if (action === 'anonymize') {
      progressCb('Extraindo texto...', 0.5);
      const text = await processExtractText(bytes);
      const r = anonymizeText(text);
      const blob = new Blob([r.text], { type: 'text/plain;charset=utf-8' });
      showToolResult({ blob, name: baseName + '_anonimizado.txt', summary: `${r.replacements} dados pessoais anonimizados`, preview: r.text.slice(0, 500) });
    } else if (action === 'extractTables') {
      const tables = await processExtractTables(bytes, progressCb);
      if (tables.length === 0) {
        showToolResult({ summary: 'Nenhuma tabela detectada', custom: '<p style="color: var(--uc-warm-gray);">Detecção heurística não encontrou tabelas. PDFs scaneados precisam de OCR primeiro.</p>' });
      } else {
        const csv = tablesToCsv(tables);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        showToolResult({ blob, name: baseName + '_tabelas.csv', summary: `${tables.length} tabela(s) detectada(s)`, preview: csv.slice(0, 500) });
      }
    } else if (action === 'claudePackage') {
      progressCb('Indexando autos...', 0.3);
      const indexed = await processIndexAutos(bytes);
      progressCb('Extraindo texto...', 0.6);
      const fullText = await processExtractText(bytes);
      const citations = detectCitations(fullText);
      const dl = detectDeadlines(fullText, indexed.events);
      // Save to process if linked
      if (_toolsState.linkedProcessId) {
        await saveIndexedToProcess(_toolsState.linkedProcessId, indexed, _toolsState.fileName, bytes);
        // Also save jurisprudence
        for (const [type, items] of Object.entries(citations)) {
          for (const cit of items) {
            await DB.saveJurisprudence({ id: uid(), processId: _toolsState.linkedProcessId, type, citation: cit, source: _toolsState.fileName, addedAt: Date.now() });
          }
        }
      }
      const md = generateLegacyClaudePackage(_toolsState.fileName, indexed, fullText, citations, dl);
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const totalCitations = Object.values(citations).reduce((s,a) => s+a.length, 0);
      showToolResult({
        blob, name: baseName + '_pacote_claude.md',
        summary: `Pacote pronto · ${indexed.events.length} eventos · ${totalCitations} citações${_toolsState.linkedProcessId ? ' · salvo no processo' : ''}`,
        actions: _toolsState.linkedProcessId ? [{ label: 'Ir ao processo →', cb: `navigate('process', { currentProcessId: '${_toolsState.linkedProcessId}' })` }] : []
      });
    }
  } catch(err) {
    console.error(err);
    // Remove loader (batch outer rethrows, single shows error inline)
    removeLoaderForCurrentBatch_();
    if (_toolsState._batchMode) {
      throw err;  // outer runToolAction handles per-file
    }
    ra.insertAdjacentHTML('beforeend', `<div class="card" style="border-left: 3px solid var(--uc-red);"><strong style="color: var(--uc-red);">Erro</strong><p>${escapeHtml(err.message)}</p></div>`);
    toast('Erro ao processar', err.message, 'error');
  }
}

function removeLoaderForCurrentBatch_() {
  const idx = _toolsState._batchIndex || 0;
  const loader = document.querySelector(`._toolLoader[data-loader-idx="${idx}"]`);
  if (loader) loader.remove();
}

function showToolResult({ blob = null, name = '', summary = '', preview = null, custom = null, actions = [] }) {
  const ra = $('toolResultArea');
  removeLoaderForCurrentBatch_();
  // ID único do botão de download em batch
  const idx = _toolsState._batchIndex || 0;
  const dlBtnId = '_dlBtn_' + idx + '_' + Math.random().toString(36).slice(2, 7);
  const fileLabel = _toolsState._batchMode ? `<div class="help-text" style="margin-bottom: 6px;">Arquivo ${idx + 1}/${_toolsState._batchTotal}: <strong>${escapeHtml(_toolsState.fileName)}</strong></div>` : '';
  ra.insertAdjacentHTML('beforeend', `
    <div class="card card-gold-border fade-in mb-3">
      ${fileLabel}
      <h3 class="font-serif text-lg font-semibold smallcaps mb-2" style="color: var(--uc-black);">✓ Concluído</h3>
      <p style="color: var(--uc-graphite); margin-bottom: 12px;">${escapeHtml(summary)}</p>
      ${custom || ''}
      ${preview ? `<details class="mt-3"><summary style="cursor:pointer; font-weight: 500;">Pré-visualizar texto</summary><pre style="background: var(--uc-cream); padding: 12px; border-radius: 6px; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin-top: 8px;">${escapeHtml(preview)}...</pre></details>` : ''}
      <div class="flex gap-2 flex-wrap mt-3">
        ${blob ? `<button class="btn btn-primary btn-sm" id="${dlBtnId}">⬇ Baixar ${escapeHtml(name)}</button>` : ''}
        ${actions.map((a, i) => `<button class="btn btn-outline btn-sm" onclick="${a.cb}">${escapeHtml(a.label)}</button>`).join('')}
      </div>
    </div>
  `);
  if (blob) document.getElementById(dlBtnId).onclick = () => downloadBlob(blob, name);
  if (!_toolsState._batchMode) ra.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function saveIndexedToProcess(processId, indexed, sourceFileName, bytes) {
  // Save events
  for (const e of indexed.events) {
    const event = {
      id: uid(), processId,
      eventNumber: e.eventNumber,
      type: e.type, date: e.date,
      startPage: e.startPage, endPage: e.endPage, pageCount: e.pageCount,
      sourceFile: sourceFileName, addedAt: Date.now()
    };
    await DB.saveEvent(event);
  }
  // Save PDF blob
  const blob = new Blob([bytes], { type: 'application/pdf' });
  await DB.savePdf({ id: uid(), processId, blob, name: sourceFileName, addedAt: Date.now() });
}

function generateLegacyClaudePackage(fileName, indexed, fullText, citations, deadlines) {
  let md = `# Pacote para análise: ${fileName}\n\n`;
  md += `**Gerado em:** ${new Date().toLocaleString('pt-BR')}\n\n`;
  if (indexed.processNumber) md += `**Processo:** ${indexed.processNumber}\n\n`;
  md += `---\n\n## Estatísticas\n\n- **Páginas:** ${indexed.totalPages}\n- **Eventos:** ${indexed.events.length}\n- **Caracteres:** ${fullText.length.toLocaleString('pt-BR')}\n\n`;
  md += `## Cronologia\n\n| Ev | Data | Tipo | Pgs |\n|---|---|---|---|\n`;
  indexed.events.forEach(e => md += `| ${e.eventNumber} | ${e.date || '—'} | ${e.type.replace(/\|/g,'/')} | ${e.startPage}–${e.endPage} |\n`);
  md += `\n## Jurisprudência detectada\n\n`;
  Object.entries(citations).forEach(([t, items]) => { if (items.length > 0) md += `**${t}:** ${items.join('; ')}\n\n`; });
  if (deadlines.lastIntimation) {
    md += `\n## Prazos\n\n**Última intimação:** ${deadlines.lastIntimation.type} em ${deadlines.lastIntimation.date}\n\n`;
    deadlines.deadlines.forEach(d => md += `- ${d.days} dias úteis → ${d.deadline.toLocaleDateString('pt-BR')} (${d.remaining > 0 ? d.remaining + ' dias restantes' : 'EXPIRADO há ' + Math.abs(d.remaining) + ' dias'})\n`);
  }
  md += `\n---\n\n## Texto integral\n\n${fullText}\n\n---\n\n## Prompt\n\n\`\`\`\n${DEFAULT_PROMPT_TEMPLATE}\n\`\`\`\n`;
  return md;
}

async function importPdfToProcess() {
  // Trigger file picker, force linked process
  _toolsState.linkedProcessId = state.currentProcessId;
  navigate('tools');
  toast('Aba ferramentas', 'Selecione o PDF e use Indexar Autos ou Pacote para Claude.', 'info');
}

async function quickCalcDeadline() {
  const r = await showModal('Calcular prazo', [
    { label: 'Data da intimação/publicação', type: 'date' },
    { label: 'Prazo (dias úteis)', type: 'number', default: '15', min: '1', max: '365' }
  ], { confirmLabel: 'Calcular' });
  if (!r) return;
  const [date, days] = r;
  if (!date) { toast('Informe a data', '', 'error'); return; }
  const intDate = new Date(date + 'T12:00:00');
  const dl = addBusinessDays(intDate, parseInt(days));
  const today = new Date(); today.setHours(0,0,0,0);
  const remaining = Math.ceil((dl - today) / 86400000);
  toast(`Vencimento: ${dl.toLocaleDateString('pt-BR')}`, `${remaining > 0 ? remaining + ' dias úteis restantes' : 'EXPIRADO há ' + Math.abs(remaining) + ' dias'}`, remaining > 0 ? 'success' : 'error');
  // Show a result card too
  $('appContent').insertAdjacentHTML('afterbegin', `
    <div class="card card-gold-border fade-in mb-4">
      <p class="smallcaps text-xs" style="color: var(--uc-gold); font-weight: 600;">Cálculo de prazo</p>
      <p class="font-serif text-2xl font-semibold mt-1" style="color: var(--uc-black);">${dl.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })}</p>
      <p style="font-size: 14px; color: var(--uc-graphite); margin-top: 4px;">${days} dias úteis a partir de ${intDate.toLocaleDateString('pt-BR')}</p>
      <p style="margin-top: 8px;"><span class="badge ${remaining < 0 ? 'badge-red' : remaining <= 5 ? 'badge-red' : remaining <= 14 ? 'badge-amber' : 'badge-green'}">${remaining > 0 ? remaining + ' dias úteis restantes' : 'EXPIRADO há ' + Math.abs(remaining) + ' dias'}</span></p>
      <p class="help-text mt-2">⚠️ Não considera feriados forenses ou suspensões processuais.</p>
    </div>
  `);
}

async function quickNote() {
  const processes = state.processes.length > 0 ? state.processes : await DB.getAllProcesses();
  if (processes.length === 0) {
    toast('Cadastre um processo primeiro', '', 'error');
    navigate('processes'); return;
  }
  const r = await showModal('Nota rápida', [
    { label: 'Processo', type: 'select', options: processes.map(p => ({ value: p.id, label: p.name })) },
    { label: 'Texto', type: 'textarea', rows: 5, placeholder: 'Observação rápida da audiência ou diligência...' }
  ], { confirmLabel: 'Salvar' });
  if (!r) return;
  const [pid, text] = r;
  if (!text?.trim()) return;
  await DB.saveNote({ id: uid(), processId: pid, text: text.trim(), createdAt: Date.now() });
  toast('Nota salva', '', 'success');
}

async function quickProcessLookup() {
  const processes = await DB.getAllProcesses();
  if (processes.length === 0) { toast('Nenhum processo cadastrado', '', 'error'); return; }
  navigate('processes');
}

async function quickJurisSearch() {
  const r = await showModal('Buscar jurisprudência', [
    { label: 'Termo de busca', placeholder: 'Ex: REsp 123 · Tema 1182 · Súmula 211' }
  ]);
  if (!r || !r[0]) return;
  const q = r[0].toLowerCase();
  const allJuris = [];
  const processes = await DB.getAllProcesses();
  for (const p of processes) {
    const items = await DB.getJurisprudenceByProcess(p.id);
    items.forEach(i => allJuris.push({ ...i, processName: p.name, processId: p.id }));
  }
  const matches = allJuris.filter(j => j.citation.toLowerCase().includes(q));
  $('appContent').insertAdjacentHTML('afterbegin', `
    <div class="card fade-in mb-4">
      <h4 class="font-serif font-semibold smallcaps mb-2">Resultados: ${matches.length}</h4>
      ${matches.length === 0 ? '<p style="color: var(--uc-warm-gray); font-size: 13px;">Nenhuma citação encontrada na carteira.</p>' :
        matches.map(m => `
          <div style="padding: 8px 0; border-bottom: 1px solid var(--uc-line-soft); cursor: pointer;" onclick="navigate('process', { currentProcessId: '${m.processId}' })">
            <span class="badge badge-gold">${escapeHtml(m.citation)}</span>
            <span style="font-size: 12px; color: var(--uc-warm-gray); margin-left: 8px;">${escapeHtml(m.processName)}</span>
          </div>
        `).join('')}
    </div>
  `);
}

async function quickPhotoOcr() {
  // Trigger file input with capture=camera
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    toast('Processando OCR...', 'Pode demorar alguns segundos', 'info');
    try {
      const w = await getTesseractWorker('por');
      const r = await w.recognize(file);
      const text = r.data.text;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      $('appContent').insertAdjacentHTML('afterbegin', `
        <div class="card card-gold-border fade-in mb-4">
          <h4 class="font-serif font-semibold smallcaps mb-2">Texto reconhecido</h4>
          <p class="help-text">${text.length} caracteres · confiança ${Math.round(r.data.confidence)}%</p>
          <pre style="background: var(--uc-cream); padding: 12px; border-radius: 6px; max-height: 300px; overflow: auto; font-size: 13px; white-space: pre-wrap; margin: 8px 0;">${escapeHtml(text.slice(0, 1500))}${text.length > 1500 ? '\n\n...' : ''}</pre>
          <button class="btn btn-secondary btn-sm" id="_ocrDl">⬇ Baixar texto</button>
        </div>
      `);
      $('_ocrDl').onclick = () => downloadBlob(blob, 'ocr_diligencia.txt');
    } catch(err) {
      toast('Erro no OCR', err.message, 'error');
    }
  };
  input.click();
}

function setupSettingsHandlers(tab) {
  if (tab === 'maintenance') {
    (async () => {
      const migracaoClientesDesligada = await DB.getSetting('migracaoClientesDesligada', false);
      const fresh = !state._manutencaoCache;
      state._manutencaoCache = { migracaoClientesDesligada };
      if (fresh) renderSettings();
    })();
  }
  if (tab === 'equipe') {
    // Carrega cache lazy (mesma estratégia do djen)
    (async () => {
      const socioPadraoNome = await DB.getSetting('socioPadraoNome', null);
      const ausencias = await DB.getSetting('advogadosAusencias', {});
      const fcmTokens = (await DB.getSetting('fcmTokens', {})) || {};
      const me = (window.UC_Auth?.getUser?.() || {}).email;
      const fcmTokenInfo = me ? (fcmTokens[me] || null) : null;
      const fresh = !state._equipeCache;
      state._equipeCache = { socioPadraoNome, ausencias, fcmTokenInfo };
      if (fresh) renderSettings();
    })();
  }
  if (tab === 'backup') {
    const cb = $('backupReminderToggle');
    if (cb) cb.onchange = async (e) => {
      state.settings.backupReminder = e.target.checked;
      await DB.setSetting('backupReminder', e.target.checked);
      toast('Preferência salva', '', 'success');
    };
  }
  if (tab === 'djen') {
    // Load fresh data and re-render if cache was empty
    djenLoadSettingsCache().then(() => {
      if (!state._djenRenderedFresh) {
        state._djenRenderedFresh = true;
        renderSettings();
      } else {
        state._djenRenderedFresh = false;
      }
    });
    const saveBtn = $('djenSaveSettings');
    if (saveBtn) saveBtn.onclick = async () => {
      const lookback = parseInt($('djenLookbackInput').value) || 7;
      const workerUrl = $('djenWorkerInput').value.trim();
      const datajudWorkerInput = $('datajudWorkerInput');
      const datajudWorkerUrl = datajudWorkerInput ? datajudWorkerInput.value.trim() : '';
      await DB.setSetting('djenLookbackDays', lookback);
      await DB.setSetting('djenWorkerUrl', workerUrl || null);
      await DB.setSetting('datajudWorkerUrl', datajudWorkerUrl || null);
      state._djenCache = { ...state._djenCache, lookback, workerUrl, datajudWorkerUrl };
      toast('Configurações salvas', '', 'success');
    };
  }
  if (tab === 'about') {
    if (state.installPrompt) {
      $('installSection').classList.remove('hidden');
      $('installBtn').onclick = async () => {
        state.installPrompt.prompt();
        const r = await state.installPrompt.userChoice;
        if (r.outcome === 'accepted') toast('Instalado!', '', 'success');
        state.installPrompt = null;
        $('installSection').classList.add('hidden');
      };
    }
  }
}

async function djenLoadSettingsCache() {
  const oabs = await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS);
  const lookback = await DB.getSetting('djenLookbackDays', 7);
  const workerUrl = await DB.getSetting('djenWorkerUrl', '') || '';
  const datajudWorkerUrl = await DB.getSetting('datajudWorkerUrl', '') || '';
  const lastFetch = await DB.getSetting('djenLastFetch', null);
  state._djenCache = { oabs, lookback, workerUrl, datajudWorkerUrl, lastFetch };
}

async function djenAddOabFlow() {
  const r = await showModal('Adicionar OAB ao monitor', [
    { label: 'Número da OAB', placeholder: 'Ex: 16539 (apenas números)' },
    { label: 'UF', type: 'select', options: [
      { value: 'GO', label: 'GO' }, { value: 'DF', label: 'DF' }, { value: 'SP', label: 'SP' },
      { value: 'RJ', label: 'RJ' }, { value: 'MG', label: 'MG' }, { value: 'BA', label: 'BA' },
      { value: 'PR', label: 'PR' }, { value: 'RS', label: 'RS' }, { value: 'SC', label: 'SC' },
      { value: 'PE', label: 'PE' }, { value: 'CE', label: 'CE' }, { value: 'PA', label: 'PA' },
      { value: 'AM', label: 'AM' }, { value: 'MT', label: 'MT' }, { value: 'MS', label: 'MS' },
      { value: 'TO', label: 'TO' }, { value: 'PI', label: 'PI' }, { value: 'MA', label: 'MA' },
      { value: 'AL', label: 'AL' }, { value: 'SE', label: 'SE' }, { value: 'RN', label: 'RN' },
      { value: 'PB', label: 'PB' }, { value: 'ES', label: 'ES' }, { value: 'AC', label: 'AC' },
      { value: 'AP', label: 'AP' }, { value: 'RO', label: 'RO' }, { value: 'RR', label: 'RR' }
    ], default: 'GO' },
    { label: 'Nome do advogado (opcional)', placeholder: 'Para identificação na lista' }
  ], { confirmLabel: 'Adicionar' });
  if (!r) return;
  const [numero, uf, nome] = r;
  if (!numero?.trim()) { toast('Número obrigatório', '', 'error'); return; }
  const oabs = await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS);
  const exists = oabs.some(o => o.numero === numero.trim() && o.uf === uf);
  if (exists) { toast('OAB já cadastrada', '', 'error'); return; }
  oabs.push({ numero: numero.trim(), uf, nome: nome?.trim() || '' });
  await DB.setSetting('djenOabs', oabs);
  state._djenCache = { ...(state._djenCache || {}), oabs };
  toast('OAB adicionada', '', 'success');
  renderSettings();
}

async function djenRemoveOab(index) {
  const oabs = await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS);
  const oab = oabs[index];
  const ok = await confirmDialog('Remover OAB?', `${oab.numero}/${oab.uf} ${oab.nome ? '(' + oab.nome + ')' : ''} não será mais consultada.`, true);
  if (!ok) return;
  oabs.splice(index, 1);
  await DB.setSetting('djenOabs', oabs);
  state._djenCache = { ...(state._djenCache || {}), oabs };
  renderSettings();
}

async function djenToggleOab(index, enabled) {
  const oabs = await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS);
  if (!oabs[index]) return;
  oabs[index].enabled = enabled;
  await DB.setSetting('djenOabs', oabs);
  state._djenCache = { ...(state._djenCache || {}), oabs };
  // Update the active count badge inline without re-rendering everything
  const countEl = document.getElementById('djenActiveCount');
  if (countEl) countEl.textContent = oabs.filter(o => o.enabled !== false).length;
  // Re-render the list to update opacity/background of each row
  renderSettings();
}

async function djenToggleAllOabs(enabled) {
  const oabs = await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS);
  oabs.forEach(o => o.enabled = enabled);
  await DB.setSetting('djenOabs', oabs);
  state._djenCache = { ...(state._djenCache || {}), oabs };
  renderSettings();
}

// Cicla light → dark → auto → light
async function cycleTheme() {
  const ordem = ['light', 'dark', 'auto'];
  const atual = state.settings.theme || 'light';
  const idx = ordem.indexOf(atual);
  const proximo = ordem[(idx + 1) % ordem.length];
  await setTheme(proximo);
  toast(
    proximo === 'auto' ? 'Tema: 🖥 Auto' : proximo === 'dark' ? 'Tema: 🌙 Escuro' : 'Tema: ☀ Claro',
    proximo === 'auto' ? 'Segue preferência do sistema' : '',
    'success'
  );
}

function _updateThemeQuickToggleLabel() {
  const lbl = document.getElementById('themeQuickToggleLabel');
  if (!lbl) return;
  const t = state.settings.theme || 'light';
  if (t === 'auto') {
    const ef = _resolverTema('auto');
    lbl.textContent = '🖥 Auto · ' + (ef === 'dark' ? '🌙' : '☀');
  } else if (t === 'dark') {
    lbl.textContent = '🌙 Escuro';
  } else {
    lbl.textContent = '☀ Claro';
  }
}

async function marcarAdvogadoAusenteFlow(nome) {
  const r = await showModal('Marcar ausência', [
    { label: 'Ausente até (opcional — em branco = indefinida)', type: 'date' },
    { label: 'Motivo (opcional)', placeholder: 'Ex: férias · licença · afastamento médico' }
  ], { confirmLabel: 'Marcar', intro: `<strong>${escapeHtml(nome)}</strong>` });
  if (!r) return;
  const [ate, motivo] = r;
  const ausencias = await DB.getSetting('advogadosAusencias', {}) || {};
  ausencias[nome] = {
    ate: ate || null,
    motivo: motivo?.trim() || '',

  };

  toast('Ausência registrada', nome, 'success');
  renderSettings();

async function reativarAdvogado(nome) {
  const ausencias = await DB.getSetting('advogadosAusencias', {}) || {};
  if (!ausencias[nome]) return;
  delete ausencias[nome];
  await DB.setSetting('advogadosAusencias', ausencias);
  state._equipeCache = { ...(state._equipeCache || {}), ausencias };
  toast('Reativado', nome, 'success');
  renderSettings();
}

async function addPromptFlow() {
  const r = await showModal('Novo prompt', [
    { label: 'Nome', placeholder: 'Ex: Análise tributária federal' },
    { label: 'Conteúdo do prompt', type: 'textarea', rows: 12, placeholder: 'Você é um advogado...' }
  ], { confirmLabel: 'Salvar' });
  if (!r) return;
  const [name, content] = r;
  if (!name?.trim() || !content?.trim()) { toast('Preencha todos os campos', '', 'error'); return; }
  await DB.savePrompt({ id: uid(), name: name.trim(), content: content.trim(), createdAt: Date.now() });
  toast('Prompt salvo', '', 'success');
  renderSettings();
}

async function editPromptFlow(id) {
  const p = state.prompts.find(x => x.id === id);
  if (!p) return;
  const r = await showModal('Editar prompt', [
    { label: 'Nome', default: p.name },
    { label: 'Conteúdo', type: 'textarea', rows: 14, default: p.content }
  ], { confirmLabel: 'Salvar' });
  if (!r) return;
  p.name = r[0].trim(); p.content = r[1].trim();
  await DB.savePrompt(p);
  toast('Atualizado', '', 'success');
  renderSettings();

async function deletePromptFlow(id) {

async function setDefaultPrompt(id) {

  toast('Prompt padrão atualizado', '', 'success');
  renderSettings();
}

async function exportBackup() {
  const data = {
    version: 4,
    generatedAt: Date.now(),
    processes: await DB.getAllProcesses(),
    events: [],
    deadlines: await DB.getAllDeadlines(),
    notes: [],
    jurisprudence: [],
    prompts: await DB.getAllPrompts(),
    djenPublications: await DB.getAllDjenPublications(),
    settings: {
      theme: state.settings.theme,
      backupReminder: state.settings.backupReminder,
      defaultPromptId: await DB.getSetting('defaultPromptId'),
      djenOabs: await DB.getSetting('djenOabs', DJEN_DEFAULT_OABS),
      djenLookbackDays: await DB.getSetting('djenLookbackDays', 7),
      djenWorkerUrl: await DB.getSetting('djenWorkerUrl', null),
      datajudWorkerUrl: await DB.getSetting('datajudWorkerUrl', null),
      djenLastFetch: await DB.getSetting('djenLastFetch', null)
    }
  };
  // Get all events/notes/jurisprudence per process
  for (const p of data.processes) {
    const evts = await DB.getEventsByProcess(p.id);
    const notes = await DB.getNotesByProcess(p.id);
    const juris = await DB.getJurisprudenceByProcess(p.id);
    data.events.push(...evts);
    data.notes.push(...notes);
    data.jurisprudence.push(...juris);
  }
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const ts = new Date().toISOString().slice(0,10);
  downloadBlob(blob, `uc-juridico-backup-${ts}.json`);
  state.settings.lastBackupAt = Date.now();
  await DB.setSetting('lastBackupAt', state.settings.lastBackupAt);
  toast('Backup exportado', `${data.processes.length} processos · ${data.events.length} eventos · ${data.deadlines.length} prazos · ${data.djenPublications.length} DJEN`, 'success');
}

async function importBackupFlow() {
  const ok = await confirmDialog(
    'Importar backup?',
    'Os dados atuais SERÃO SUBSTITUÍDOS pelos dados do arquivo. Esta ação não pode ser desfeita. Faça backup do estado atual antes, se necessário.',
    true
  );
  if (!ok) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.version || !Array.isArray(data.processes)) throw new Error('Arquivo inválido');
      // Wipe current data
      for (const p of await DB.getAllProcesses()) await DB.deleteProcess(p.id);
      for (const pr of await DB.getAllPrompts()) await DB.deletePrompt(pr.id);
      // Import
      for (const p of data.processes) await dbPromise('processes', 'readwrite', s => s.put(p));
      for (const e of (data.events || [])) await dbPromise('events', 'readwrite', s => s.put(e));
      for (const d of (data.deadlines || [])) await dbPromise('deadlines', 'readwrite', s => s.put(d));
      for (const n of (data.notes || [])) await dbPromise('notes', 'readwrite', s => s.put(n));
      for (const j of (data.jurisprudence || [])) await dbPromise('jurisprudence', 'readwrite', s => s.put(j));
      for (const pr of (data.prompts || [])) await DB.savePrompt(pr);
      // DJEN restore (v4.1+)
      if (db.objectStoreNames.contains('djen_publications')) {
        for (const dp of (data.djenPublications || [])) await dbPromise('djen_publications', 'readwrite', s => s.put(dp));
      }
      if (data.settings) {
        if (data.settings.defaultPromptId) await DB.setSetting('defaultPromptId', data.settings.defaultPromptId);
        if (data.settings.theme) await DB.setSetting('theme', data.settings.theme);
        if (data.settings.djenOabs) await DB.setSetting('djenOabs', data.settings.djenOabs);
        if (data.settings.djenLookbackDays) await DB.setSetting('djenLookbackDays', data.settings.djenLookbackDays);
        if (data.settings.djenWorkerUrl) await DB.setSetting('djenWorkerUrl', data.settings.djenWorkerUrl);
        if (data.settings.datajudWorkerUrl) await DB.setSetting('datajudWorkerUrl', data.settings.datajudWorkerUrl);
      }
      toast('Backup importado', `${data.processes.length} processos restaurados`, 'success');
      navigate('dashboard');
    } catch(err) {
      toast('Erro ao importar', err.message, 'error');
    }
  };
  input.click();
}

async function wipeAllData() {
  const c1 = await confirmDialog('Apagar TODOS os dados?', 'Isso removerá processos, eventos, prazos, notas, jurisprudência, PDFs, prompts personalizados e histórico DJEN. Faça backup antes!', true);
  if (!c1) return;
  const c2 = await confirmDialog('Tem certeza absoluta?', 'Última chance. Esta ação é PERMANENTE.', true);
  if (!c2) return;
  for (const store of ['processes', 'events', 'deadlines', 'notes', 'jurisprudence', 'pdfs', 'prompts', 'djen_publications']) {
    if (db.objectStoreNames.contains(store)) {
      await dbPromise(store, 'readwrite', s => s.clear());
    }
  }
  toast('Dados apagados', 'Tudo limpo.', 'success');
  navigate('dashboard');
}
