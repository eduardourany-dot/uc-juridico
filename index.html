        <p class="page-subtitle">
          ${p.cnj ? `<span class="process-cnj" style="font-style: normal;">${escapeHtml(p.cnj)}</span> · ` : ''}
          ${p.area ? escapeHtml(p.area) : ''}${p.type ? ` · ${escapeHtml(p.type)}` : ''}
          ${p.court ? ` · ${escapeHtml(p.court)}` : ''}
        </p>
      </div>
      <div class="flex gap-2">
        ${p.cnj ? `<button class="btn btn-secondary btn-sm" onclick="datajudRefreshProcess('${p.id}')" title="Atualizar dados deste processo via API DataJud do CNJ">🔄 DataJud</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="editProcessFlow()">Editar</button>
        <button class="btn btn-secondary btn-sm" onclick="generateProcessFiche()">Gerar ficha</button>
        <button class="btn btn-primary btn-sm" onclick="gerarPeticaoFlow()" title="Gerar petição a partir de modelo cadastrado">📝 Gerar petição</button>
      </div>
    </div>

    <div class="detail-tabs scroll-thin">
      <button class="detail-tab ${state._processView.activeTab === 'overview' ? 'active' : ''}" onclick="setProcessTab('overview')">Visão geral</button>
      <button class="detail-tab ${state._processView.activeTab === 'cliente' ? 'active' : ''}" onclick="setProcessTab('cliente')">Cliente</button>
      <button class="detail-tab ${state._processView.activeTab === 'events' ? 'active' : ''}" onclick="setProcessTab('events')">Eventos · ${events.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'deadlines' ? 'active' : ''}" onclick="setProcessTab('deadlines')">Prazos · ${deadlines.filter(d => prazoEstaAtivo(d)).length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'jurisprudence' ? 'active' : ''}" onclick="setProcessTab('jurisprudence')">Jurisprudência · ${jurisprudence.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'notes' ? 'active' : ''}" onclick="setProcessTab('notes')">Notas · ${notes.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'honorarios' ? 'active' : ''}" onclick="setProcessTab('honorarios')">Honorários · ${honorarios.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'compromissos' ? 'active' : ''}" onclick="setProcessTab('compromissos')">Compromissos · ${compromissos.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'peticoes' ? 'active' : ''}" onclick="setProcessTab('peticoes')">Petições · ${peticoes.length}</button>
      <button class="detail-tab ${state._processView.activeTab === 'analysis' ? 'active' : ''}" onclick="setProcessTab('analysis')">Análise IA</button>
    </div>

    <div id="processTabContent"></div>
  `;
  renderProcessTabContent();
}

function setProcessTab(tab) {
  state._processView.activeTab = tab;
  document.querySelectorAll('.detail-tab').forEach((el, i) => {
    el.classList.toggle('active', el.textContent.toLowerCase().includes(tab) ||
      (tab === 'overview' && i === 0));
  });
  renderProcessTabContent();
}

async function renderProcessTabContent() {
  const { p, events, deadlines, notes, jurisprudence, honorarios, compromissos, activeTab } = state._processView;
  const c = $('processTabContent');
  if (activeTab === 'overview') c.innerHTML = renderProcessOverview(p, events, deadlines, notes, jurisprudence);
  else if (activeTab === 'cliente') c.innerHTML = await renderProcessCliente(p);
  else if (activeTab === 'events') c.innerHTML = renderProcessEvents(p, events, notes);
  else if (activeTab === 'deadlines') c.innerHTML = renderProcessDeadlines(p, deadlines);
  else if (activeTab === 'jurisprudence') c.innerHTML = renderProcessJurisprudence(p, jurisprudence);
  else if (activeTab === 'notes') c.innerHTML = renderProcessNotes(p, notes);
  else if (activeTab === 'honorarios') c.innerHTML = renderProcessHonorarios(p, honorarios || []);
  else if (activeTab === 'compromissos') c.innerHTML = await renderProcessCompromissos(p, compromissos || []);
  else if (activeTab === 'peticoes') c.innerHTML = renderProcessPeticoes(p, state._processView.peticoes || []);
  else if (activeTab === 'analysis') c.innerHTML = renderProcessAnalysis(p, events, deadlines, jurisprudence);
}

async function renderProcessCompromissos(p, compromissos) {
  if (!compromissos.length) {
    return `
      <div class="empty-state">
        <h3 class="empty-state-title">Nenhum compromisso vinculado</h3>
        <p class="empty-state-msg">Cadastre audiências, reuniões com cliente, diligências ou prazos administrativos relacionados a este processo. Você receberá push e email no dia anterior e no dia.</p>
        <button class="btn btn-primary" onclick="novoCompromissoFlow({ processoIdFixo: '${p.id}', clienteIdFixo: '${p.clienteId || ''}' })">+ Novo compromisso</button>
      </div>
    `;
  }

  const ordenados = [...compromissos].sort((a, b) => {
    const ai = a.dataHoraInicio || '';
    const bi = b.dataHoraInicio || '';
    return ai.localeCompare(bi);
  });

  const today = new Date(); today.setHours(0,0,0,0);
  const futuros = ordenados.filter(c => new Date(c.dataHoraInicio) >= today && c.status !== 'cancelado' && c.status !== 'realizado');
  const passados = ordenados.filter(c => !(new Date(c.dataHoraInicio) >= today && c.status !== 'cancelado' && c.status !== 'realizado'));

  // Map de cliente por id pra link do card (o link de processo é
  // suprimido — já estamos dentro do processo). Cache de 5min em DB.
  const cliById = {};
  try {
    const clientes = await DB.getAllClientes();
    clientes.forEach(cl => { cliById[cl.id] = cl; });
  } catch (_) {}

  return `
    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray); margin: 0;">${futuros.length} futuro${futuros.length !== 1 ? 's' : ''} · ${passados.length} histórico${passados.length !== 1 ? 's' : ''}</p>
      <button class="btn btn-primary btn-sm" onclick="novoCompromissoFlow({ processoIdFixo: '${p.id}', clienteIdFixo: '${p.clienteId || ''}' })">+ Novo</button>
    </div>

    ${futuros.length ? `
      <h4 class="font-serif font-semibold smallcaps mb-2" style="color: var(--uc-black);">Próximos</h4>
      ${futuros.map(c => _renderCompromissoCard(c, null, cliById)).join('')}
    ` : ''}

    ${passados.length ? `
      <h4 class="font-serif font-semibold smallcaps mb-2 mt-4" style="color: var(--uc-warm-gray);">Histórico</h4>
      ${passados.map(c => _renderCompromissoCard(c, null, cliById)).join('')}
    ` : ''}
  `;
}

async function renderProcessCliente(p) {
  if (!p.clienteId) {
    return `
      <div class="empty-state">
        <h3 class="empty-state-title">Sem cliente vinculado</h3>
        <p class="empty-state-msg">Este processo não tem cliente cadastrado como entidade. Edite o processo para vincular um cliente existente ou cadastrar um novo.${p.client ? '<br><br><strong>Snapshot legado:</strong> ' + escapeHtml(p.client) : ''}</p>
        <button class="btn btn-primary" onclick="editProcessFlow()">Editar processo</button>
      </div>
    `;
  }

  const [clientes, processos, honorarios] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses(), DB.getAllHonorarios()
  ]);
  const cli = clientes.find(c => c.id === p.clienteId);
  if (!cli) {
    return `
      <div class="empty-state">
        <h3 class="empty-state-title">⚠ Cliente referenciado não encontrado</h3>
        <p class="empty-state-msg">O processo aponta para um clienteId (${escapeHtml(p.clienteId)}) que não existe na coleção. Pode ter sido apagado. Edite o processo pra vincular outro.</p>
        <button class="btn btn-primary" onclick="editProcessFlow()">Editar processo</button>
      </div>
    `;
  }

  // Outros processos do mesmo cliente
  const outrosProcs = processos.filter(x => x.clienteId === cli.id && x.id !== p.id);
  // Honorários do cliente
  const honsDoCli = honorarios.filter(h => h.clienteId === cli.id);
  const hoje = new Date().toISOString().slice(0, 10);
  let totalRec = 0, totalAberto = 0, totalVenc = 0;
  honsDoCli.forEach(h => {
    const a = _agregarHonorario(h, hoje);
    totalRec += a.recebido; totalAberto += a.emAberto; totalVenc += a.vencido;
  });

  const enderecoComposto = _composeEndereco(cli);

  return `
    <div class="card mb-3">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
        <div>
          <h3 class="font-serif text-xl font-semibold" style="color: var(--uc-black); margin: 0;">${escapeHtml(cli.nome)}</h3>
          <p class="text-xs" style="color: var(--uc-warm-gray); margin: 4px 0 0;">
            <span class="badge ${(cli.tipoPessoa || 'PJ') === 'PJ' ? 'badge-amber' : 'badge-green'}" style="font-size: 10px;">${cli.tipoPessoa || 'PJ'}</span>
            ${cli.cpfCnpj ? '· ' + escapeHtml(cli.cpfCnpj) : ''}
            ${cli.ativo === false ? ' · <span style="color: var(--uc-red);">⏸ inativo</span>' : ''}
          </p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" onclick="navigate('clienteDetalhe', { currentClienteId: '${cli.id}' })" title="Abrir dashboard completo do cliente">↗ Dashboard</button>
          <button class="btn btn-outline btn-sm" onclick="editarCliente('${cli.id}')">✎ Editar cadastro</button>
          <button class="btn btn-ghost btn-sm" onclick="editProcessFlow()" title="Trocar cliente deste processo">↻ Trocar</button>
        </div>
      </div>

      <div class="grid gap-3" style="grid-template-columns: 140px 1fr; font-size: 13px;">
        ${cli.email ? `<div style="color: var(--uc-warm-gray);">Email:</div><div>${escapeHtml(cli.email)}</div>` : ''}
        ${cli.telefone ? `<div style="color: var(--uc-warm-gray);">Telefone:</div><div>${escapeHtml(cli.telefone)}</div>` : ''}
        ${enderecoComposto ? `<div style="color: var(--uc-warm-gray);">Endereço:</div><div>${escapeHtml(enderecoComposto)}</div>` : ''}
        ${cli.observacoes ? `<div style="color: var(--uc-warm-gray);">Obs:</div><div style="white-space: pre-wrap;">${escapeHtml(cli.observacoes)}</div>` : ''}
      </div>
    </div>

    <div class="grid gap-3 mb-3" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Outros processos</p><p style="font-size: 18px; font-weight: 600; margin: 0;">${outrosProcs.length}</p></div>
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Honorários</p><p style="font-size: 18px; font-weight: 600; margin: 0;">${honsDoCli.length}</p></div>
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Recebido total</p><p style="font-size: 18px; font-weight: 600; color: var(--uc-green); margin: 0;">${brl(totalRec)}</p></div>
      <div class="card"><p class="text-xs smallcaps" style="color: var(--uc-warm-gray); margin: 0 0 4px;">Em aberto</p><p style="font-size: 18px; font-weight: 600; color: ${totalVenc > 0 ? 'var(--uc-red)' : 'var(--uc-amber)'}; margin: 0;">${brl(totalAberto + totalVenc)}</p></div>
    </div>

    ${outrosProcs.length > 0 ? `
      <div class="card mb-3">
        <h4 class="font-serif font-semibold smallcaps mb-2" style="color: var(--uc-black);">Outros processos do mesmo cliente</h4>
        ${outrosProcs.slice(0, 8).map(op => `
          <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--uc-line-soft); font-size: 13px;">
            <div>
              <a onclick="navigate('process', { currentProcessId: '${op.id}' })" style="cursor: pointer; color: var(--uc-gold); font-weight: 500;">${escapeHtml(op.cnj || op.name || '—')}</a>
              ${op.area ? '<span style="color: var(--uc-warm-gray); margin-left: 6px; font-size: 11px;">' + escapeHtml(op.area) + '</span>' : ''}
            </div>
            <span style="color: var(--uc-warm-gray); font-size: 11px;">${op.status === 'archived' ? '<span class="badge badge-gray" style="font-size: 9px;">arquivado</span>' : formatDate(op.updatedAt, { relative: true })}</span>
          </div>
        `).join('')}
        ${outrosProcs.length > 8 ? `<p class="help-text" style="margin-top: 6px;">+${outrosProcs.length - 8} processos · ver todos no <a onclick="navigate('clienteDetalhe', { currentClienteId: '${cli.id}' })" style="color: var(--uc-gold); cursor: pointer;">dashboard do cliente</a></p>` : ''}
      </div>
    ` : ''}
  `;
}

function renderProcessOverview(p, events, deadlines, notes, jurisprudence) {

    .map(d => ({ ...d, days: Math.ceil((new Date(d.deadlineDate) - today) / 86400000) }))
    .sort((a,b) => a.days - b.days)[0];

  return `
    <div class="grid gap-4 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));">
      <div class="stat-card"><div class="stat-label">Eventos</div><div class="stat-value">${events.length}</div></div>
      <div class="stat-card"><div class="stat-label">Prazos ativos</div><div class="stat-value">${activeDeadlines.length}</div></div>
      <div class="stat-card"><div class="stat-label">Jurisprudência</div><div class="stat-value">${jurisprudence.length}</div></div>

function renderProcessEvents(p, events, notes) {

      </div>
    `;
  }
  const sorted = [...events].sort((a,b) => parseInt(a.eventNumber) - parseInt(b.eventNumber));
  return `
    <div class="flex justify-between items-center mb-3">
      <p class="text-sm" style="color: var(--uc-warm-gray);">${events.length} evento(s) · clique em um evento para ver detalhes ou adicionar nota</p>

    </div>

      ${sorted.map(e => {
        const evNotes = notes.filter(n => n.eventId === e.id);
        return `
          <div class="timeline-event ${evNotes.length > 0 ? 'has-note' : ''}" onclick="openEventDetail('${e.id}')">
            <div style="font-family: 'EB Garamond', serif; font-weight: 600; color: var(--uc-black); font-size: 16px;">

function renderProcessDeadlines(p, deadlines) {

    ? `${resolvidos.length} resolvido(s) [cumpridos · cancelados · perdidos]`
    : '';
  return `
    <div class="flex justify-between items-center mb-3">

function renderDeadlineRow(d, p) {
  const today = new Date(); today.setHours(0,0,0,0);
  const dl = new Date(d.deadlineDate);
  const days = Math.ceil((dl - today) / 86400000);
  const visual = recomputarStatusVisual(d, today);

  // visual → cls (CSS) + label do badge + cor
  const visualMap = {
    cumprido:  { cls: 'done',    label: '✓ cumprido',                       badge: 'badge-gray'  },
    cancelado: { cls: 'done',    label: '⊘ cancelado',                      badge: 'badge-gray'  },
    perdido:   { cls: 'expired', label: '✗ perdido',                        badge: 'badge-red'   },
    suspenso:  { cls: 'warning', label: '⏸ suspenso',                       badge: 'badge-amber' },
    expirado:  { cls: 'expired', label: `vencido ${Math.abs(days)}d atrás`, badge: 'badge-red'   },
    iminente:  { cls: 'urgent',  label: days === 0 ? 'HOJE' : `${days}d`,   badge: 'badge-red'   },
    vincendo:  { cls: 'warning', label: `${days}d`,                         badge: 'badge-amber' },
    pendente:  { cls: 'safe',    label: `${days}d`,                         badge: 'badge-green' }
  };
  const v = visualMap[visual] || visualMap.pendente;

  const unidLabel = d.unidade === 'CORRIDOS' ? 'corridos' : 'úteis';
  const parserBadge = d.parser && d.parser.tipo !== 'CIENCIA' ? `
    <span class="badge ${d.parser.confianca >= 0.85 ? 'badge-green' : 'badge-amber'}" style="font-size: 9px;" title="Parser: ${escapeHtml(d.parser.fonte)} · ${(d.parser.confianca*100).toFixed(0)}% · ${escapeHtml(d.parser.baseLegal || '')}">⚙ ${escapeHtml(d.parser.label)}</span>
  ` : '';
  const reviewBadge = d.parser && d.parser.requerRevisao ? `<span class="badge badge-amber" style="font-size: 9px;" title="Confiança baixa — revisar manualmente">⚠ revisar</span>` : '';

  // Botões contextuais ao status
  let acoes = '';
  if (visual === 'suspenso') {
    acoes += `<button class="btn btn-ghost btn-sm" onclick="reabrirPrazo('${d.id}')" title="Reabrir prazo">▶</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="abrirModalCancelar('${d.id}')" title="Cancelar com motivo">⊘</button>`;
  } else if (prazoEstaAtivo(d)) {
    acoes += `<button class="btn btn-ghost btn-sm" onclick="abrirModalCumprimento('${d.id}')" title="Marcar como cumprido (data + protocolo)">✓</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="abrirModalSuspender('${d.id}')" title="Suspender (pausa lembretes)">⏸</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="abrirModalCancelar('${d.id}')" title="Cancelar com motivo">⊘</button>`;
  }
  acoes += `<button class="btn btn-ghost btn-sm" onclick="deleteDeadline('${d.id}')" title="Remover do registro">🗑</button>`;

  // Detalhes complementares por status
  let detalhesStatus = '';
  if (visual === 'cumprido' && d.cumprimento) {
    const c = d.cumprimento;
    detalhesStatus = `<div style="font-size: 11px; color: var(--uc-warm-gray); margin-top: 4px;">✓ Cumprido em ${formatDate(c.dataCumprimento)} · protocolo ${escapeHtml(c.numeroProtocolo)}${c.advogadoOab ? ' · ' + escapeHtml(c.advogadoOab) : ''}${c.observacoes ? '<br>' + escapeHtml(c.observacoes) : ''}</div>`;
  } else if (visual === 'suspenso' && d.suspensao) {
    const s = d.suspensao;
    detalhesStatus = `<div style="font-size: 11px; color: var(--uc-warm-gray); margin-top: 4px;">⏸ Suspenso: ${escapeHtml(s.motivo)}${s.suspensoAte ? ' · até ' + formatDate(s.suspensoAte) : ''}</div>`;
  } else if (visual === 'cancelado' && d.cancelamento) {
    detalhesStatus = `<div style="font-size: 11px; color: var(--uc-warm-gray); margin-top: 4px;">⊘ Cancelado: ${escapeHtml(d.cancelamento.motivo)}</div>`;
  } else if (visual === 'perdido') {
    detalhesStatus = `<div style="font-size: 11px; color: var(--uc-red); margin-top: 4px; font-weight: 600;">✗ PRAZO PERDIDO — investigar e regularizar</div>`;
  }

  return `
    <div class="deadline-row ${v.cls}">
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 600; color: var(--uc-black);">${escapeHtml(d.description || d.type)}${d.emDobro ? ' <span class="badge badge-amber" style="font-size: 9px;">DOBRO</span>' : ''} ${parserBadge} ${reviewBadge}</div>
        <div style="font-size: 12px; color: var(--uc-warm-gray); margin-top: 2px;">
          Vence ${formatDate(dl)}${d.intimationDate ? ' · intimação ' + formatDate(d.intimationDate) : ''}${d.daysAllowed ? ' · ' + d.daysAllowed + ' dias ' + unidLabel : ''}${d.tribunal && d.tribunal !== 'NACIONAL' ? ' · ' + escapeHtml(d.tribunal) : ''}
        </div>
        ${detalhesStatus}
        ${d.diarioCalculo ? `<details style="margin-top: 4px;"><summary style="font-size: 11px; color: var(--uc-warm-gray); cursor: pointer;">📋 diário de cálculo</summary><div style="font-size: 11px; color: var(--uc-graphite); padding: 6px 8px; background: var(--uc-cream); border-radius: 4px; margin-top: 4px; line-height: 1.5;">${escapeHtml(d.diarioCalculo)}</div></details>` : ''}
        ${Array.isArray(d.logs) && d.logs.length > 0 ? `
          <details style="margin-top: 4px;">
            <summary style="font-size: 11px; color: var(--uc-warm-gray); cursor: pointer;">🕒 histórico (${d.logs.length})</summary>
            <div style="font-size: 11px; color: var(--uc-graphite); padding: 6px 8px; background: var(--uc-cream); border-radius: 4px; margin-top: 4px;">
              ${[...d.logs].sort((a,b) => b.timestamp - a.timestamp).map(l => `
                <div style="padding: 2px 0; border-bottom: 1px dashed var(--uc-line-soft);">
                  <span style="color: var(--uc-warm-gray);">${formatDateTime(l.timestamp)}</span>
                  · ${escapeHtml(descreverLogEntry(l))}
                  ${l.ator && l.ator !== 'sistema' ? ` · <em>${escapeHtml(l.ator)}</em>` : ''}
                </div>
              `).join('')}
            </div>
          </details>
        ` : ''}
      </div>
      <div class="flex gap-2 items-center">
        <span class="badge ${v.badge}">${v.label}</span>
        ${acoes}
      </div>
    </div>
  `;
}

function processDedupKey(p) {
  if (!p) return '';
  const cnj = String(p.cnj || '').replace(/\D/g, '');
  if (cnj) return 'cnj:' + cnj;
  return 'name:' + (p.name || '').toLowerCase().trim();
}

function deadlineDedupKey(d) {
  if (!d) return '';
  const dt = String(d.deadlineDate || '').slice(0, 10); // só YYYY-MM-DD
  const desc = (d.description || d.type || '').toLowerCase().trim();
  if (d.djenHash) return ['djen', d.processId || '', d.djenHash].join('|');
  return [d.processId || '', desc, dt].join('|');
}

function groupDuplicates(records, keyFn) {
  const groups = new Map();
  for (const r of records) {
    const k = keyFn(r);
    if (!k) continue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  return [...groups.entries()].filter(([, g]) => g.length > 1);
}

// CDA: cada linha "numero | valor | periodo" → { numero, valor, periodo }
function parseCdas(text) {
  if (!text) return [];
  return text.split('\n')
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .map(line => {
      const parts = line.split('|').map(s => s.trim());
      return {
        numero: parts[0] || '',
        valor: parts[1] || '',
        periodo: parts[2] || ''
      };
    })
    .filter(c => c.numero);
}
function serializeCdas(cdas) {
  if (!Array.isArray(cdas)) return '';
  return cdas.map(c => [c.numero, c.valor, c.periodo].filter(Boolean).join(' | ')).join('\n');
}

// Email reverso (nome → email canônico). Cache lazy.
let _ADVOGADO_BY_NAME = null;
function advogadoEmailPorNome(nome) {
  if (!_ADVOGADO_BY_NAME) {
    _ADVOGADO_BY_NAME = {};
    for (const [email, nm] of Object.entries(ADVOGADO_BY_EMAIL)) _ADVOGADO_BY_NAME[nm] = email;

// Status de ausência por advogado — usado para roteamento de lembretes
// (Sprint 3 §6.5 do briefing). Persistido em settings.advogadosAusencias
// como objeto { 'NOME ADVOGADO': { ate: 'YYYY-MM-DD', motivo: '…' } }.
async function obterAusencias() {
  return (await DB.getSetting('advogadosAusencias', {})) || {};
}

async function advogadoEstaAusente(nome, hoje) {
  if (!nome) return false;
  const ausencias = await obterAusencias();
  const a = ausencias[nome];
  if (!a) return false;
  if (!a.ate) return true;   // ausência indefinida
  const fim = new Date(a.ate + 'T23:59:59');
  const ref = hoje ? new Date(hoje) : new Date();
  return ref <= fim;
}

async function obterSocioPadrao() {
  return await DB.getSetting('socioPadraoNome', null);
}

// Roteamento de destinatários por marco (T-7, T-3, T-2, T-1, T-0, T+1).
// Antecipa contrato de §7.3 do briefing. Não envia notificação ainda
// (Sprint 3 B/C trata FCM/SES); apenas resolve a lista.
//   T-7..T-2: titular  (suplente se titular ausente)
//   T-1     : titular + suplente
//   T-0/T+1 : titular + suplente + sócio padrão
//
// Versão pura — todos os inputs explicitos. Testável sem mock do DB.
function rotearDestinatarios({ titular, suplente, socio, marco, titularAusente }) {
  const principal = (titularAusente && suplente) ? suplente : titular;
  const cobertura = (titularAusente && suplente) ? titular : suplente;

  let lista = [];
  if (['T-7','T-3','T-2'].includes(marco)) {
    lista = [principal];
  } else if (marco === 'T-1') {
    lista = [principal, cobertura];
  } else if (marco === 'T-0' || marco === 'T+1') {
    lista = [principal, cobertura, socio];
  } else {
    lista = [principal];
  }
  // Dedup + remove vazios
  return [...new Set(lista.filter(Boolean))];
}

// Wrapper assíncrono — carrega ausência e sócio do DB e chama rotearDestinatarios
async function obterDestinatariosPrazo(processo, marco, hoje) {
  const titular = processo?.advogadoResponsavel || null;
  const suplente = processo?.advogadoSuplente || null;
  const socio = await obterSocioPadrao();
  const titularAusente = await advogadoEstaAusente(titular, hoje);
  return rotearDestinatarios({ titular, suplente, socio, marco, titularAusente });
}

async function scanDuplicates() {
  const target = $('dupReport');
  target.innerHTML = `<div class="help-text">Buscando…</div>`;
  const procs = await DB.getAllProcesses();
  const allDeads = await DB.getAllDeadlines();
  const procGroups = groupDuplicates(procs, processDedupKey);
  const deadGroups = groupDuplicates(allDeads, deadlineDedupKey);
  const totalProcDup = procGroups.reduce((s, [, g]) => s + g.length - 1, 0);
  const totalDeadDup = deadGroups.reduce((s, [, g]) => s + g.length - 1, 0);

  window._dupGroups = { procs: procGroups, deads: deadGroups };

  if (totalProcDup === 0 && totalDeadDup === 0) {
    target.innerHTML = `<div style="background: var(--uc-green-soft); border: 1px solid var(--uc-green); border-radius: 6px; padding: 12px;"><strong style="color: var(--uc-green);">✓ Nenhuma duplicata encontrada.</strong></div>`;
    $('mergeAllBtn').style.display = 'none';
    return;
  }

  // Listas dos grupos
  const renderProcGroup = ([key, g]) => {
    const sorted = [...g].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    return `
      <div style="border: 1px solid var(--uc-line-soft); border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px;">
        <div style="font-family: monospace; color: var(--uc-warm-gray); margin-bottom: 6px;">${escapeHtml(key)}</div>
        <ul style="margin: 0; padding-left: 18px;">
          ${sorted.map((p, i) => `<li>${i === 0 ? '<strong>(manter) </strong>' : '<span style="color: var(--uc-red);">(descartar) </span>'}${escapeHtml(p.name)}${p.cnj ? ' · ' + escapeHtml(p.cnj) : ''} <span style="color: var(--uc-warm-gray);">${formatDate(p.updatedAt, { relative: true })}</span></li>`).join('')}
        </ul>
      </div>`;
  };
  const renderDeadGroup = ([key, g]) => {
    const sorted = [...g].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    return `
      <div style="border: 1px solid var(--uc-line-soft); border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px;">
        <div style="font-family: monospace; color: var(--uc-warm-gray); margin-bottom: 6px;">${escapeHtml(key)}</div>
        <ul style="margin: 0; padding-left: 18px;">
          ${sorted.map((d, i) => `<li>${i === 0 ? '<strong>(manter) </strong>' : '<span style="color: var(--uc-red);">(descartar) </span>'}${escapeHtml(d.description || d.type || '?')} · vence ${formatDate(d.deadlineDate)} <span style="color: var(--uc-warm-gray);">${formatDate(d.updatedAt || d.createdAt, { relative: true })}</span></li>`).join('')}
        </ul>
      </div>`;
  };

  target.innerHTML = `
    <div class="grid gap-2 mb-3" style="grid-template-columns: 200px 1fr; font-size: 13px;">
      <div style="color: var(--uc-warm-gray);">Processos duplicados:</div>
      <div><strong>${totalProcDup}</strong> em ${procGroups.length} grupo${procGroups.length !== 1 ? 's' : ''}</div>
      <div style="color: var(--uc-warm-gray);">Prazos duplicados:</div>
      <div><strong>${totalDeadDup}</strong> em ${deadGroups.length} grupo${deadGroups.length !== 1 ? 's' : ''}</div>
    </div>
    ${procGroups.length ? `<details open><summary style="cursor: pointer; font-weight: 500; margin-bottom: 8px;">Processos (${procGroups.length})</summary>${procGroups.map(renderProcGroup).join('')}</details>` : ''}
    ${deadGroups.length ? `<details ${procGroups.length ? '' : 'open'}><summary style="cursor: pointer; font-weight: 500; margin: 8px 0;">Prazos (${deadGroups.length})</summary>${deadGroups.map(renderDeadGroup).join('')}</details>` : ''}
  `;
  $('mergeAllBtn').style.display = 'inline-flex';
}

async function reparentChildrenToKept(fromId, toId) {
  const remaps = [
    [DB.getDeadlinesByProcess, DB.saveDeadline],
    [DB.getEventsByProcess,    DB.saveEvent],
    [DB.getNotesByProcess,     DB.saveNote],
    [DB.getJurisprudenceByProcess, DB.saveJurisprudence],
    [DB.getDjenPublicationsByProcess, DB.saveDjenPublication]
  ];
  for (const [getter, saver] of remaps) {
    if (typeof getter !== 'function' || typeof saver !== 'function') continue;
    const items = await getter.call(DB, fromId);
    for (const it of (items || [])) {
      it.processId = toId;
      await saver.call(DB, it);
    }
  }
}

async function mergeAllDuplicates() {
  if (!window._dupGroups) {
    toast('Rode "Buscar duplicatas" primeiro', '', 'warning');
    return;
  }
  const ok = await confirmDialog(
    'Mesclar todas as duplicatas?',
    'Mantém o registro mais recente de cada grupo. Filhos de processos mesclados são realocados antes do soft-delete (dados preservados).',
    true
  );
  if (!ok) return;

  $('dupReport').innerHTML = `<div class="help-text">Mesclando…</div>`;
  let mergedProc = 0, mergedDead = 0;

  for (const [, group] of window._dupGroups.procs) {
    const sorted = [...group].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const keep = sorted[0];
    for (const drop of sorted.slice(1)) {
      await reparentChildrenToKept(drop.id, keep.id);
      await DB.deleteProcess(drop.id);
      mergedProc++;
    }
  }

  // Após realocar prazos, alguns ficaram duplicados em relação a outros do processo mantido.
  // Re-scan + dedup independente.
  const allDeads = await DB.getAllDeadlines();
  const newDeadGroups = groupDuplicates(allDeads, deadlineDedupKey);
  for (const [, group] of newDeadGroups) {
    const sorted = [...group].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    for (const drop of sorted.slice(1)) {
      await DB.deleteDeadline(drop.id);
      mergedDead++;
    }
  }

  toast('Mesclagem concluída', `${mergedProc} processo(s) e ${mergedDead} prazo(s) duplicados removidos`, 'success');
  await scanDuplicates();
}

async function addDeadlineFlow() {
  const proc = state._processView?.p;
  const tribunalInferido = inferirTribunal(proc?.court);
  const r = await showModal('Adicionar prazo', [
    { label: 'Descrição', placeholder: 'Ex: Embargos à execução · Resposta · Recurso' },
    { label: 'Data da intimação/publicação (opcional)', type: 'date' },
    { label: 'Prazo', type: 'number', default: '15', min: '1', max: '365' },
    { label: 'Unidade do prazo', type: 'select', default: 'UTEIS', options: [
      { value: 'UTEIS', label: 'Dias úteis' },
      { value: 'CORRIDOS', label: 'Dias corridos' }
    ]},
    { label: 'Prazo em dobro (Fazenda/MP/Defensoria)', type: 'checkbox', default: false },
    { label: 'OU data de vencimento direta (se preferir)', type: 'date' }
  ], { confirmLabel: 'Adicionar', intro: 'Informe a data da intimação + dias OU diretamente a data de vencimento. Tribunal inferido: <strong>' + tribunalInferido + '</strong>.' });
  if (!r) return;
  const [desc, intDate, days, unidade, emDobro, directDate] = r;
  if (!desc?.trim()) { toast('Descrição obrigatória', '', 'error'); return; }
  let deadlineDate, diario = null;
  if (directDate) {
    deadlineDate = new Date(directDate + 'T12:00:00');
  } else if (intDate && days) {
    const calc = calcularDataFatal({
      dataPublicacao: new Date(intDate + 'T12:00:00'),
      prazoDias: parseInt(days),
      unidade,
      tribunal: tribunalInferido,
      emDobro
    });
    deadlineDate = calc.dataFatal;
    diario = gerarDiarioCalculo(calc);
  } else {
    toast('Informe pelo menos a data de vencimento', '', 'error'); return;
  }
  const d = {
    id: uid(), processId: state.currentProcessId,
    description: desc.trim(),
    type: 'manual',
    intimationDate: intDate ? new Date(intDate + 'T12:00:00').toISOString() : null,
    daysAllowed: days ? parseInt(days) : null,
    unidade,
    emDobro: !!emDobro,
    tribunal: tribunalInferido,
    diarioCalculo: diario,
    deadlineDate: deadlineDate.toISOString(),
    status: STATUS_PRAZO.PENDENTE,
    logs: [],
    createdAt: Date.now()
  };
  appendLogPrazo(d, 'criado', { origem: 'manual', deadlineDate: d.deadlineDate, prazoDias: d.daysAllowed, unidade: d.unidade, emDobro: d.emDobro });
  // Prevenção: se já existe prazo idêntico (mesmo processo, descrição, data) — pergunta
  const dupKey = deadlineDedupKey(d);
  const existingDeadlines = await DB.getDeadlinesByProcess(state.currentProcessId);
  const dup = existingDeadlines.find(x => deadlineDedupKey(x) === dupKey);
  if (dup) {
    const ok = await confirmDialog('Prazo idêntico já existe', `Já existe um prazo "${dup.description || dup.type}" com vencimento ${formatDate(dup.deadlineDate)} neste processo. Criar mesmo assim?`);
    if (!ok) return;
  }
  await DB.saveDeadline(d);
  toast('Prazo adicionado', formatDate(deadlineDate), 'success');
  renderProcessDetail();
}

async function _findPrazoForAction(id) {
  const fromView = state._processView?.deadlines?.find(x => x.id === id);

}

// Marcar como cumprido — exige data + número de protocolo (princípio reitor:
// nenhum prazo é considerado cumprido até confirmação explícita).
async function abrirModalCumprimento(id) {
  const d = await _findPrazoForAction(id);
  if (!d) { toast('Prazo não encontrado', '', 'error'); return; }
  if (prazoEstaResolvido(d)) { toast('Prazo já está resolvido', '', 'info'); return; }
  const hojeISO = new Date().toISOString().slice(0,10);
  const r = await showModal('Marcar como cumprido', [
    { label: 'Data do cumprimento', type: 'date', default: hojeISO },
    { label: 'Número de protocolo (obrigatório)', placeholder: 'Ex: 12345678' },
    { label: 'Advogado responsável (OAB, opcional)', placeholder: 'GO-16539' },
    { label: 'Observações (opcional)' }
  ], { confirmLabel: 'Confirmar cumprimento', intro: `Prazo: <strong>${escapeHtml(d.description || d.type)}</strong> · Vence ${formatDate(d.deadlineDate)}` });
  if (!r) return;
  const [dataCumprimento, numeroProtocolo, oab, obs] = r;
  if (!numeroProtocolo?.trim()) { toast('Número de protocolo é obrigatório', '', 'error'); return; }
  d.status = STATUS_PRAZO.CUMPRIDO;
  d.cumprimento = {
    dataCumprimento: dataCumprimento || hojeISO,
    numeroProtocolo: numeroProtocolo.trim(),
    advogadoOab: oab?.trim() || null,
    observacoes: obs?.trim() || '',
    registradoEm: Date.now()
  };
  d.completedAt = Date.now();   // mantém pra retrocompat de sort/render legado
  d.updatedAt = Date.now();
  appendLogPrazo(d, 'cumprido', {
    dataCumprimento: d.cumprimento.dataCumprimento,
    numeroProtocolo: d.cumprimento.numeroProtocolo,
    oab: d.cumprimento.advogadoOab
  });
  await DB.saveDeadline(d);
  toast('Prazo cumprido', `Protocolo ${d.cumprimento.numeroProtocolo}`, 'success');
  _refreshAfterPrazoAction();
}

// Suspender — pausa lembretes. Reabre via reabrirPrazo() ou (futuro) pela suspensoAte.
async function abrirModalSuspender(id) {
  const d = await _findPrazoForAction(id);
  if (!d) { toast('Prazo não encontrado', '', 'error'); return; }
  if (d.status === STATUS_PRAZO.SUSPENSO) { toast('Já está suspenso', '', 'info'); return; }
  if (prazoEstaResolvido(d)) { toast('Prazo já resolvido', '', 'error'); return; }
  const r = await showModal('Suspender prazo', [
    { label: 'Motivo (obrigatório)', placeholder: 'Ex: aguardando juntada de documentos' },
    { label: 'Suspenso até (opcional)', type: 'date' }
  ], { confirmLabel: 'Suspender', intro: 'Suspensão pausa lembretes. Use Reabrir para retomar manualmente.' });
  if (!r) return;
  const [motivo, suspensoAte] = r;
  if (!motivo?.trim()) { toast('Motivo obrigatório', '', 'error'); return; }
  d.suspensao = {
    motivo: motivo.trim(),
    suspensoAte: suspensoAte || null,
    statusAnterior: d.status,
    suspensoEm: Date.now()
  };
  d.status = STATUS_PRAZO.SUSPENSO;
  d.updatedAt = Date.now();
  appendLogPrazo(d, 'suspenso', { motivo: d.suspensao.motivo, ate: d.suspensao.suspensoAte });
  await DB.saveDeadline(d);
  toast('Prazo suspenso', '', 'success');
  _refreshAfterPrazoAction();
}

async function reabrirPrazo(id) {
  const d = await _findPrazoForAction(id);
  if (!d) { toast('Prazo não encontrado', '', 'error'); return; }
  if (d.status !== STATUS_PRAZO.SUSPENSO) { toast('Só prazos suspensos podem ser reabertos', '', 'info'); return; }
  const anterior = d.suspensao?.statusAnterior || STATUS_PRAZO.PENDENTE;
  d.status = STATUS_TERMINAIS.has(anterior) ? STATUS_PRAZO.PENDENTE : anterior;
  appendLogPrazo(d, 'reaberto', { suspensaoAnterior: d.suspensao });
  delete d.suspensao;
  d.updatedAt = Date.now();
  await DB.saveDeadline(d);
  toast('Prazo reaberto', '', 'success');
  _refreshAfterPrazoAction();
}

// Cancelar — anula com motivo. Diferente de Remover: prazo cancelado fica no histórico.
async function abrirModalCancelar(id) {
  const d = await _findPrazoForAction(id);

function buildProcessClaudePackage(p, events, deadlines, notes, jurisprudence, promptTemplate) {
  let md = `# Pacote de análise · ${p.name}\n\n`;
  md += `**Gerado em:** ${formatDateTime(Date.now())}\n\n`;
  md += `---\n\n## Identificação do processo\n\n`;
  if (p.cnj) md += `- **CNJ:** ${p.cnj}\n`;
  if (p.client) md += `- **Cliente:** ${p.client}\n`;
  if (p.court) md += `- **Tribunal:** ${p.court}\n`;
  if (p.type) md += `- **Tipo:** ${p.type}\n`;
  if (p.area) md += `- **Área:** ${p.area}\n`;
  if (p.polo) md += `- **Polo:** ${p.polo}\n`;

  if (events.length > 0) {
    md += `\n---\n\n## Cronologia (${events.length} eventos)\n\n`;
    md += `| Evento | Data | Tipo | Pgs |\n|---|---|---|---|\n`;
    [...events].sort((a,b) => parseInt(a.eventNumber) - parseInt(b.eventNumber)).forEach(e => {
      md += `| ${e.eventNumber} | ${e.date || '—'} | ${e.type.replace(/\|/g,'/')} | ${e.startPage}–${e.endPage} |\n`;
    });
  }

  if (deadlines.filter(d => prazoEstaAtivo(d)).length > 0) {
    md += `\n---\n\n## Prazos ativos\n\n`;
    deadlines.filter(d => prazoEstaAtivo(d)).sort((a,b) => new Date(a.deadlineDate) - new Date(b.deadlineDate)).forEach(d => {
      const dl = new Date(d.deadlineDate);
      const today = new Date(); today.setHours(0,0,0,0);
      const days = Math.ceil((dl - today) / 86400000);
      md += `- **${d.description || d.type}** · vence ${formatDate(dl)} (${days >= 0 ? days + ' dias úteis' : 'VENCIDO há ' + Math.abs(days) + ' dias'})\n`;
    });
  }

  if (jurisprudence.length > 0) {
    md += `\n---\n\n## Jurisprudência catalogada\n\n`;
    const byType = {};
    jurisprudence.forEach(j => { if (!byType[j.type]) byType[j.type] = []; byType[j.type].push(j.citation); });
    for (const [t, items] of Object.entries(byType)) {
      md += `### ${t} (${items.length})\n`;
      items.forEach(i => md += `- ${i}\n`);
      md += '\n';
    }
  }

  if (notes.length > 0) {
    md += `\n---\n\n## Notas e observações\n\n`;
    notes.sort((a,b) => a.createdAt - b.createdAt).forEach(n => {
      md += `**${formatDateTime(n.createdAt)}**${n.eventId ? ` (evento ${events.find(e => e.id === n.eventId)?.eventNumber || '?'})` : ''}\n${n.text}\n\n`;
    });
  }

  // Prompt
  md += `\n---\n\n## Prompt para análise\n\n\`\`\`\n`;
  md += promptTemplate ? promptTemplate.replace(/\[NÚMERO\]/g, p.cnj || '[NÚMERO]')
    .replace(/\[ÁREA DO DIREITO\]/g, p.area || 'Direito Tributário')
    .replace(/\[TRIBUNAL\]/g, p.court || '[TRIBUNAL]')
    .replace(/\[TIPO\]/g, p.type || '[TIPO]')
    .replace(/\[NOME E POLO\]/g, p.client && p.polo ? `${p.client} (${p.polo})` : '[NOME E POLO]')
    : DEFAULT_PROMPT_TEMPLATE.replace(/\[NÚMERO\]/g, p.cnj || '[NÚMERO]').replace(/\[ÁREA DO DIREITO\]/g, p.area || 'Direito Tributário');
  md += `\n\`\`\`\n`;
  return md;
}

  const { p, events, deadlines, notes, jurisprudence } = state._processView;

        <div class="stat-label">Vencidos</div>
        <div class="stat-value" style="${expired.length > 0 ? 'color: var(--uc-red);' : ''}">${expired.length}</div>
      </div>
      <div class="stat-card" style="${urgent.length > 0 ? 'background: var(--uc-red-soft);' : ''}">
        <div class="stat-label">Urgentes</div>
        <div class="stat-value">${urgent.length}</div>
        <div class="stat-meta">≤ 5 dias</div>
      </div>
      <div class="stat-card" style="${warning.length > 0 ? 'background: var(--uc-amber-soft);' : ''}">
        <div class="stat-label">Atenção</div>
        <div class="stat-value">${warning.length}</div>
        <div class="stat-meta">6-14 dias</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tranquilos</div>
        <div class="stat-value">${safe.length}</div>
        <div class="stat-meta">+14 dias</div>
      </div>
    </div>

    ${active.length === 0 ? `
      <div class="card empty-state">
        <h3 class="empty-state-title">Nenhum prazo ativo</h3>
        <p class="empty-state-msg">Você não tem prazos pendentes. Adicione prazos a partir de cada processo na aba "Prazos".</p>
      </div>
    ` : `
      ${expired.length > 0 ? `<h3 class="font-serif text-lg font-semibold smallcaps mb-3" style="color: var(--uc-red);">⚠ Vencidos · ${expired.length}</h3>${expired.sort((a,b) => a.days - b.days).map(d => renderGlobalDeadlineRow(d)).join('')}` : ''}

      ${warning.length > 0 ? `<h3 class="font-serif text-lg font-semibold smallcaps mt-6 mb-3" style="color: var(--uc-amber);">Atenção · ${warning.length}</h3>${warning.sort((a,b) => a.days - b.days).map(d => renderGlobalDeadlineRow(d)).join('')}` : ''}

function renderGlobalDeadlineRow(d) {
  let cls = 'safe', label = `${d.days}d`;
  if (d.days < 0) { cls = 'expired'; label = `há ${Math.abs(d.days)}d`; }
  else if (d.days === 0) { cls = 'urgent'; label = 'HOJE'; }
  else if (d.days <= 3) { cls = 'urgent'; label = `${d.days}d`; }
  else if (d.days <= 7) { cls = 'warning'; label = `${d.days}d`; }
  return `
    <div class="deadline-row ${cls}" onclick="navigate('process', { currentProcessId: '${d.processId}' })">
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 600; color: var(--uc-black);">${escapeHtml(d.description || d.type)}</div>
        <div style="font-size: 12px; color: var(--uc-warm-gray); margin-top: 2px;">
          ${escapeHtml(d.processName)}${d.processCnj ? ` · ${d.processCnj}` : ''} · vence ${formatDate(d.deadlineDate)}
        </div>
      </div>
      <span class="badge ${cls === 'urgent' || cls === 'expired' ? 'badge-red' : cls === 'warning' ? 'badge-amber' : 'badge-green'}">${label}</span>
    </div>
  `;
}

let tesseractWorker = null, tesseractWorkerLang = null;

// ============== TESSERACT WORKER MGMT ==============
async function getTesseractWorker(lang) {
  if (tesseractWorker && tesseractWorkerLang === lang) return tesseractWorker;
  if (tesseractWorker) { try { await tesseractWorker.terminate(); } catch(e) {} tesseractWorker = null; }
  tesseractWorker = await Tesseract.createWorker(lang, 1);
  tesseractWorkerLang = lang;
  return tesseractWorker;
}

// ============== CORE PROCESSING FUNCTIONS ==============

async function processCompressAggressive(pdfBytes, dpi = 150, quality = 0.7, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const newPdf = await PDFDocument.create();
  const scale = dpi / 72;
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages);
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
    const jpegBytes = await blob.arrayBuffer();
    const jpegImage = await newPdf.embedJpg(jpegBytes);
    const newPage = newPdf.addPage([jpegImage.width, jpegImage.height]);
    newPage.drawImage(jpegImage, { x: 0, y: 0, width: jpegImage.width, height: jpegImage.height });
  }
  return await newPdf.save({ useObjectStreams: true });
}

async function processCompressLight(pdfBytes) {
  const pdfLib = await PDFDocument.load(pdfBytes.slice(0), { ignoreEncryption: true });
  return await pdfLib.save({ useObjectStreams: true });
}

async function processExtractText(pdfBytes, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  let fullText = '';
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages);
    const page = await pdfDoc.getPage(i);
    const tc = await page.getTextContent();
    let lastY = null, pageText = '';
    for (const item of tc.items) {
      if (lastY !== null && Math.abs(item.transform[5] - lastY) > 2) pageText += '\n';
      pageText += item.str + ' ';
      lastY = item.transform[5];
    }
    fullText += `\n\n========== PÁGINA ${i} ==========\n\n${pageText.trim()}\n`;
  }
  return fullText;
}

async function processOcr(pdfBytes, lang = 'por', dpi = 200, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const worker = await getTesseractWorker(lang);
  const scale = dpi / 72;
  let fullText = '';
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages, 'OCR');
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const { data } = await worker.recognize(canvas);
    fullText += `\n\n========== PÁGINA ${i} ==========\n\n${data.text.trim()}\n`;
    canvas.width = 0; canvas.height = 0;
  }
  return fullText;
}

async function processOcrSelective(pdfBytes, lang = 'por', dpi = 200, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  let worker = null;
  let fullText = '';
  let nativeCount = 0, ocrCount = 0;
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages);
    const page = await pdfDoc.getPage(i);
    const tc = await page.getTextContent();
    const nativeText = tc.items.map(it => it.str).join(' ').trim();
    if (nativeText.length > 100) {
      // page has reliable native text
      let pageText = '', lastY = null;
      for (const item of tc.items) {
        if (lastY !== null && Math.abs(item.transform[5] - lastY) > 2) pageText += '\n';
        pageText += item.str + ' ';
        lastY = item.transform[5];
      }
      fullText += `\n\n========== PÁGINA ${i} (nativo) ==========\n\n${pageText.trim()}\n`;
      nativeCount++;
    } else {
      // OCR
      if (!worker) worker = await getTesseractWorker(lang);
      const viewport = page.getViewport({ scale: dpi/72 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      const { data } = await worker.recognize(canvas);
      fullText += `\n\n========== PÁGINA ${i} (OCR) ==========\n\n${data.text.trim()}\n`;
      canvas.width = 0; canvas.height = 0;
      ocrCount++;
    }
  }
  return { text: fullText, nativeCount, ocrCount };
}

async function processSearchablePdf(pdfBytes, lang = 'por', dpi = 200, quality = 0.85, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const worker = await getTesseractWorker(lang);
  const newPdf = await PDFDocument.create();
  const helvFont = await newPdf.embedFont(StandardFonts.Helvetica);
  const scale = dpi / 72;
  let totalWords = 0;
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (progressCb) progressCb(i, pdfDoc.numPages);
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const { data } = await worker.recognize(canvas);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
    const jpegBytes = await blob.arrayBuffer();
    const jpegImage = await newPdf.embedJpg(jpegBytes);
    const newPage = newPdf.addPage([jpegImage.width, jpegImage.height]);
    newPage.drawImage(jpegImage, { x: 0, y: 0, width: jpegImage.width, height: jpegImage.height });

    // Embed invisible text layer at word positions
    if (data.words) {
      for (const word of data.words) {
        if (!word.text || !word.bbox) continue;
        const txt = word.text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '');
        if (!txt.trim()) continue;
        const { x0, y0, x1, y1 } = word.bbox;
        const h = y1 - y0;
        const pdfY = jpegImage.height - y1;
        try {
          newPage.drawText(txt, {
            x: x0, y: pdfY,
            size: Math.max(2, h * 0.7),
            font: helvFont,
            opacity: 0.001,
            color: rgb(1,1,1)
          });
          totalWords++;
        } catch(e) {}
      }
    }
    canvas.width = 0; canvas.height = 0;
  }
  return { bytes: await newPdf.save({ useObjectStreams: true }), totalWords };
}

async function processSplit(pdfBytes, fileName, chunkSize, progressCb = null) {
  const pdfLib = await PDFDocument.load(pdfBytes.slice(0), { ignoreEncryption: true });
  const totalPages = pdfLib.getPageCount();
  const numChunks = Math.ceil(totalPages / chunkSize);
  const baseName = fileName.replace(/\.pdf$/i, '');
  const parts = [];
  for (let c = 0; c < numChunks; c++) {
    if (progressCb) progressCb(c + 1, numChunks);
    const start = c * chunkSize;
    const end = Math.min(start + chunkSize, totalPages);
    const newPdf = await PDFDocument.create();
    const idx = Array.from({length: end - start}, (_, i) => start + i);
    const pages = await newPdf.copyPages(pdfLib, idx);
    pages.forEach(p => newPdf.addPage(p));
    parts.push({ name: `${baseName}_parte${String(c+1).padStart(2,'0')}_pgs${start+1}-${end}.pdf`, bytes: await newPdf.save() });
  }
  return parts;
}

async function processToImages(pdfBytes, dpi = 150, quality = 0.85, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const scale = dpi / 72;

// Detect event headers in PJe/eSAJ/PROJUDI documents
async function processIndexAutos(pdfBytes, progressCb = null) {
  const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
  const numPages = pdfDoc.numPages;
  const events = [];
  const allPagesText = [];

  // Patterns ordered by specificity
  const patterns = [
    // PJe TRF/TJ classic: "Evento N - Tipo - DD/MM/AAAA"
    { re: /Evento\s+(\d+)[\s\-–·]+([^\n\-–]{3,80}?)[\s\-–·]+(\d{2}\/\d{2}\/\d{4})/i, fmt: m => ({ num: m[1], type: m[2].trim(), date: m[3] }) },
    // PJe alt: "Evento N - Tipo"
    { re: /Evento\s+(\d+)[\s\-–·]+([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^\n]{3,80})/i, fmt: m => ({ num: m[1], type: m[2].trim(), date: '' }) },
    // eSAJ: "fls. NNNN" with peça name nearby
    { re: /(?:Pe[çc]a|Documento)\s+(\d+)[\s\-–:]+([^\n]{3,80})/i, fmt: m => ({ num: m[1], type: m[2].trim(), date: '' }) },
    // Sequencial
    { re: /Sequencial\s+(\d+)[\s\-–:]+([^\n]{3,80})/i, fmt: m => ({ num: m[1], type: m[2].trim(), date: '' }) },
  ];

  // Also detect process number (CNJ format)
  const processRe = /(\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4})/;
  let detectedProcessNumber = null;

  for (let i = 1; i <= numPages; i++) {
    if (progressCb) progressCb(i, numPages);
    const page = await pdfDoc.getPage(i);
    const tc = await page.getTextContent();
    const pageText = tc.items.map(it => it.str).join(' ');
    allPagesText.push(pageText);

    if (!detectedProcessNumber) {
      const pm = pageText.match(processRe);
      if (pm) detectedProcessNumber = pm[1];
    }

    // Check first 400 chars for header
    const headerSample = pageText.substring(0, 500);
    for (const p of patterns) {
      const m = headerSample.match(p.re);
      if (m) {
        const data = p.fmt(m);
        // Avoid duplicate consecutive events
        const last = events[events.length - 1];
        if (!last || last.eventNumber !== data.num || last.startPage !== i) {
          events.push({
            eventNumber: data.num,
            type: data.type,
            date: data.date,
            startPage: i,
            rawHeader: m[0].substring(0, 120)
          });
        }
        break;
      }
    }
  }

  // Set endPage for each event
  for (let i = 0; i < events.length; i++) {
    events[i].endPage = i < events.length - 1 ? events[i+1].startPage - 1 : numPages;
    events[i].pageCount = events[i].endPage - events[i].startPage + 1;
  }

  return { events, processNumber: detectedProcessNumber, totalPages: numPages, allPagesText };
}

// Detect jurisprudence citations
function detectCitations(text) {
  const patterns = {
    'Processo CNJ': /\b\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}\b/g,
    'AgRg/AgInt em REsp': /Ag(?:Rg|Int)\s+(?:no\s+)?(?:A?REsp)\s*(?:n[°º.]?\s*)?[\d.]+(?:\/[A-Z]{2})?/gi,
    'AgRg/AgInt em RE': /Ag(?:Rg|Int)\s+(?:no\s+)?A?RE\s*(?:n[°º.]?\s*)?[\d.]+(?:\/[A-Z]{2})?/gi,
    'REsp': /\bREsp\s*(?:n[°º.]?\s*)?[\d.]+(?:\/[A-Z]{2})?/gi,
    'AREsp': /\bAREsp\s*(?:n[°º.]?\s*)?[\d.]+(?:\/[A-Z]{2})?/gi,
    'RE': /\bRE\s*(?:n[°º.]?\s*)?[\d.]{4,}(?:\/[A-Z]{2})?/gi,
    'ARE': /\bARE\s*(?:n[°º.]?\s*)?[\d.]+(?:\/[A-Z]{2})?/gi,
    'HC': /\bHC\s*(?:n[°º.]?\s*)?[\d.]{4,}(?:\/[A-Z]{2})?/gi,
    'MS': /\bMS\s*(?:n[°º.]?\s*)?[\d.]{4,}(?:\/[A-Z]{2})?/gi,
    'ADI': /\bADI\s*(?:n[°º.]?\s*)?[\d.]+/gi,
    'ADC': /\bADC\s*(?:n[°º.]?\s*)?[\d.]+/gi,
    'ADPF': /\bADPF\s*(?:n[°º.]?\s*)?[\d.]+/gi,
    'Tema STF': /Tema\s+(?:n[°º.]?\s*)?(\d+)\s+(?:do\s+|da\s+)?STF/gi,
    'Tema STJ': /Tema\s+(?:n[°º.]?\s*)?(\d+)\s+(?:do\s+|da\s+)?STJ/gi,
    'Tema (genérico)': /Tema\s+(?:n[°º.]?\s*)?\d{1,4}\b/gi,
    'Súmula Vinculante': /S[úu]mula\s+Vinculante\s+(?:n[°º.]?\s*)?\d+/gi,
    'Súmula STF': /S[úu]mula\s+(?:n[°º.]?\s*)?\d+\s+(?:do\s+|da\s+)?STF/gi,
    'Súmula STJ': /S[úu]mula\s+(?:n[°º.]?\s*)?\d+\s+(?:do\s+|da\s+)?STJ/gi,
    'Súmula TST': /S[úu]mula\s+(?:n[°º.]?\s*)?\d+\s+(?:do\s+|da\s+)?TST/gi,
    'Súmula (genérica)': /S[úu]mula\s+(?:n[°º.]?\s*)?\d+/gi,
  };
  const found = {};
  for (const [type, re] of Object.entries(patterns)) {
    const matches = [...text.matchAll(re)];
    if (matches.length) {
      const unique = [...new Set(matches.map(m => m[0].trim().replace(/\s+/g, ' ')))];
      found[type] = unique.sort();
    }
  }
  return found;
}

// Anonymize sensitive data
function anonymizeText(text) {
  return text
    // CPF formatted: 123.456.789-01
    .replace(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g, '[CPF]')
    // CNPJ formatted: 12.345.678/0001-90
    .replace(/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/g, '[CNPJ]')
    // CNPJ raw 14 digits
    .replace(/\b\d{14}\b/g, '[CNPJ?]')
    // CPF raw 11 digits (be careful not to match other things — only when preceded by CPF context or surrounded by whitespace)
    .replace(/(?<![\d.\-/])\d{11}(?![\d.\-/])/g, '[CPF?]')
    // RG: varies by state; common formats
    .replace(/\b\d{1,2}\.?\d{3}\.?\d{3}-?[\dXx]\b/g, m => m.replace(/\d/g, '#').replace(/[Xx]/g, '#') === m ? m : '[RG]')
    // Phone: (11) 91234-5678 or (11) 1234-5678
    .replace(/\(\d{2}\)\s*9?\d{4}-?\d{4}/g, '[TEL]')
    // CEP
    .replace(/\b\d{5}-?\d{3}\b/g, '[CEP]')
    // Email
    .replace(/\b[\w._%+-]+@[\w.-]+\.[A-Za-z]{2,}\b/g, '[EMAIL]')
    // Bank
    .replace(/Ag[êe]ncia\s*:?\s*\d{1,5}[-\s]?\d?/gi, 'Agência: [AG]')
    .replace(/(C\/C|Conta\s+Corrente|Conta)\s*:?\s*\d{4,}[-\s]?\d/gi, 'Conta: [CC]')
    // Credit card-like
    .replace(/\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/g, '[CARTÃO]');
}

// Computus (Anonymous Gregorian) — calcula a data da Páscoa para qualquer ano.
function easterDate(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

function _addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function ymdKey(d) {
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${da}`;
}

const FERIADOS_NACIONAIS_FIXOS = [
  { md: '01-01', desc: 'Confraternização Universal' },
  { md: '04-21', desc: 'Tiradentes' },
  { md: '05-01', desc: 'Dia do Trabalho' },
  { md: '09-07', desc: 'Independência do Brasil' },
  { md: '10-12', desc: 'N. S. Aparecida' },
  { md: '11-02', desc: 'Finados' },
  { md: '11-15', desc: 'Proclamação da República' },
  { md: '11-20', desc: 'Consciência Negra' },
  { md: '12-25', desc: 'Natal' }
];

const _feriadosCache = new Map();

function feriadosDoAno(year) {
  if (_feriadosCache.has(year)) return _feriadosCache.get(year);
  const map = new Map();
  for (const f of FERIADOS_NACIONAIS_FIXOS) {
    map.set(`${year}-${f.md}`, { desc: f.desc, tipo: 'nacional' });
  }
  const easter = easterDate(year);
  map.set(ymdKey(_addDays(easter, -48)), { desc: 'Carnaval (segunda)', tipo: 'forense' });
  map.set(ymdKey(_addDays(easter, -47)), { desc: 'Carnaval (terça)',   tipo: 'forense' });
  map.set(ymdKey(_addDays(easter,  -2)), { desc: 'Sexta-Feira Santa',   tipo: 'forense' });
  map.set(ymdKey(_addDays(easter,  60)), { desc: 'Corpus Christi',      tipo: 'forense' });
  _feriadosCache.set(year, map);
  return map;
}

function isFeriado(d) {
  return feriadosDoAno(d.getFullYear()).has(ymdKey(d));
}
function getFeriado(d) {
  return feriadosDoAno(d.getFullYear()).get(ymdKey(d)) || null;
}
// Recesso forense: 20/12 a 20/01 inclusive (Lei 5.010/66 art. 62 + CPC art. 220)
function isRecessoForense(d) {
  const m = d.getMonth() + 1, day = d.getDate();
  return (m === 12 && day >= 20) || (m === 1 && day <= 20);
}
function isFimDeSemana(d) {
  const w = d.getDay();
  return w === 0 || w === 6;
}
function isDiaUtil(d, _tribunal) {
  if (isFimDeSemana(d)) return false;
  if (isFeriado(d))     return false;
  if (isRecessoForense(d)) return false;
  return true;
}

function proximoDiaUtil(d, tribunal) {
  let r = new Date(d); r.setHours(12, 0, 0, 0);
  while (!isDiaUtil(r, tribunal)) r = _addDays(r, 1);
  return r;
}

function adicionarDiasUteis(start, dias, tribunal) {
  let r = new Date(start); r.setHours(12, 0, 0, 0);
  let added = 0;
  while (added < dias) {
    r = _addDays(r, 1);
    if (isDiaUtil(r, tribunal)) added++;
  }
  return r;
}

// Heurística pra inferir tribunal a partir da string court do processo
function inferirTribunal(court) {
  if (!court) return 'NACIONAL';
  const t = String(court).toUpperCase();
  if (t.includes('TJGO') || t.includes('GOIÁS') || t.includes('GOIAS')) return 'TJGO';
  if (t.includes('TJDFT') || t.includes('TJDF') || t.includes('DISTRITO FEDERAL') || t.includes('BRASÍLIA')) return 'TJDFT';
  if (t.match(/TRF\s*-?\s*1/)) return 'TRF1';
  if (t.match(/TRF\s*-?\s*2/)) return 'TRF2';
  if (t.match(/TRF\s*-?\s*3/)) return 'TRF3';
  if (t.match(/TRF\s*-?\s*4/)) return 'TRF4';
  if (t.match(/TRF\s*-?\s*5/)) return 'TRF5';
  if (t.match(/TRF\s*-?\s*6/)) return 'TRF6';
  if (t.includes('STJ')) return 'STJ';
  if (t.includes('STF')) return 'STF';
  if (t.includes('TST')) return 'TST';
  if (t.match(/TRT\s*-?\s*\d+/)) return t.match(/TRT\s*-?\s*\d+/)[0].replace(/\s|-/g, '');
  if (t.includes('TJSP')) return 'TJSP';
  return 'NACIONAL';
}

const _DIAS_SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function diaSemana(d) { return _DIAS_SEMANA[d.getDay()]; }

// Cálculo completo aplicando art. 219 e 224 CPC
function calcularDataFatal(opts) {
  const dataPublicacao = opts.dataPublicacao instanceof Date ? new Date(opts.dataPublicacao) : new Date(opts.dataPublicacao);
  dataPublicacao.setHours(12, 0, 0, 0);
  const prazoDias = opts.emDobro ? opts.prazoDias * 2 : opts.prazoDias;
  const unidade = opts.unidade || 'UTEIS';
  const tribunal = opts.tribunal || 'NACIONAL';

  // Marco inicial = "dia do começo" no art. 224 CPC: primeiro dia útil seguinte
  // à publicação. ESSE DIA É EXCLUÍDO da contagem (art. 224 caput).
  const marcoInicial = proximoDiaUtil(_addDays(dataPublicacao, 1), tribunal);

  const exclusoes = [];
  let dataFatal;

  if (unidade === 'CORRIDOS') {
    // dias corridos: marco excluído → data fatal = marco + prazoDias dias corridos
    dataFatal = _addDays(marcoInicial, prazoDias);
    // se cair em dia não útil, prorroga (art. 224 §1º CPC)
    while (!isDiaUtil(dataFatal, tribunal)) dataFatal = _addDays(dataFatal, 1);
  } else {
    // dias úteis: marco excluído → contar prazoDias dias úteis a partir do dia seguinte
    dataFatal = new Date(marcoInicial);
    let contados = 0;
    while (contados < prazoDias) {
      dataFatal = _addDays(dataFatal, 1);
      if (isDiaUtil(dataFatal, tribunal)) {
        contados++;
      } else {
        const f = getFeriado(dataFatal);
        if (f) exclusoes.push({ data: ymdKey(dataFatal), desc: f.desc });
        else if (isRecessoForense(dataFatal)) exclusoes.push({ data: ymdKey(dataFatal), desc: 'Recesso forense' });
      }
    }
  }

  return {
    dataPublicacao, marcoInicial, dataFatal,
    prazoDias, unidade, tribunal, emDobro: !!opts.emDobro,
    exclusoes
  };
}

function gerarDiarioCalculo(calc) {
  const partes = [];
  partes.push(`Publicado ${formatDate(calc.dataPublicacao)} (${diaSemana(calc.dataPublicacao)}).`);
  partes.push(`Marco inicial: ${formatDate(calc.marcoInicial)} (${diaSemana(calc.marcoInicial)}).`);
  partes.push(`Prazo: ${calc.prazoDias} dia${calc.prazoDias !== 1 ? 's' : ''} ${calc.unidade === 'UTEIS' ? 'úteis' : 'corridos'}${calc.emDobro ? ' (em dobro)' : ''}.`);
  if (calc.exclusoes && calc.exclusoes.length) {
    const tipos = [...new Set(calc.exclusoes.map(e => e.desc))];
    partes.push(`Excluídos: ${tipos.join(', ')}, sábados e domingos.`);
  } else if (calc.unidade === 'UTEIS') {
    partes.push('Excluídos sábados e domingos.');
  }
  partes.push(`Data fatal: ${formatDate(calc.dataFatal)} (${diaSemana(calc.dataFatal)}).`);
  return partes.join(' ');
}

// Compatibilidade — código legado chama addBusinessDays(date, days).
// Agora respeita feriados nacionais + forenses + recesso (mais correto que antes).
function addBusinessDays(date, days) {
  return adicionarDiasUteis(new Date(date), days, 'NACIONAL');
}

// ====================================================================
// Suite de validação do cálculo de data fatal — Sprint 2 / Fase 4
// ====================================================================
// Chamar no console: __testarCalculo()
// Imprime tabela com cada caso, esperado vs. calculado, e um veredito final.
// Briefing pede 100% de acerto neste módulo — qualquer divergência precisa
// ser investigada antes de seguir para Sprint 3 (motor de lembretes).
//
// Nota técnica sobre CORRIDOS atravessando recesso forense (caso 14):
// O comportamento implementado prorroga a data fatal para o próximo dia
// útil quando ela cai dentro do recesso (art. 224 §1º CPC), mas NÃO suspende
// a contagem durante o intervalo 20/12–20/01. Essa é a interpretação
