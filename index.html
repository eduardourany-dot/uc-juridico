async function exportarBalanceteCSV() {
  const f = state._balanceteFiltro || {};
  const [transacoes, categorias, bancos] = await Promise.all([
    DB.getAllTransacoes(), DB.getAllCategoriasFin(), DB.getAllBancos()
  ]);
  const catById = {}; categorias.forEach(c => catById[c.id] = c);
  const bancoById = {}; bancos.forEach(b => bancoById[b.id] = b);

  let inicio, fim, labelPeriodo;
  if (f.mes === 0) {
    inicio = `${f.ano}-01-01`; fim = `${f.ano}-12-31`;
    labelPeriodo = `Ano ${f.ano}`;
  } else {
    const mm = String(f.mes).padStart(2, '0');
    const ultimoDia = String(_ultimoDiaDoMes(f.ano, f.mes - 1)).padStart(2, '0');
    inicio = `${f.ano}-${mm}-01`; fim = `${f.ano}-${mm}-${ultimoDia}`;
    labelPeriodo = `${f.ano}-${mm}`;
  }
  const noPeriodo = transacoes.filter(t => (t.data || '') >= inicio && (t.data || '') <= fim);

  const rows = [['Período', labelPeriodo]];
  rows.push([]);
  rows.push(['Resumo']);
  const recReal = noPeriodo.filter(t => t.tipo === 'receita' && t.status === 'realizado').reduce((s,t) => s + Number(t.valor), 0);
  const recPrev = noPeriodo.filter(t => t.tipo === 'receita' && t.status === 'previsto').reduce((s,t) => s + Number(t.valor), 0);
  const despReal = noPeriodo.filter(t => t.tipo === 'despesa' && t.status === 'realizado').reduce((s,t) => s + Number(t.valor), 0);
  const despPrev = noPeriodo.filter(t => t.tipo === 'despesa' && t.status === 'previsto').reduce((s,t) => s + Number(t.valor), 0);
  rows.push(['Receitas recebidas', recReal.toFixed(2).replace('.', ',')]);
  rows.push(['Receitas previstas', recPrev.toFixed(2).replace('.', ',')]);
  rows.push(['Despesas pagas', despReal.toFixed(2).replace('.', ',')]);
  rows.push(['Despesas em aberto', despPrev.toFixed(2).replace('.', ',')]);
  rows.push(['Resultado (recebido − pagas)', (recReal - despReal).toFixed(2).replace('.', ',')]);
  rows.push([]);
  rows.push(['Por categoria']);
  rows.push(['Categoria','Tipo','Realizado','Previsto','Total']);
  const porCat = {};
  noPeriodo.forEach(t => {
    const k = t.categoriaId || '_';
    if (!porCat[k]) porCat[k] = { previsto: 0, realizado: 0, tipo: t.tipo };
    porCat[k][t.status === 'realizado' ? 'realizado' : 'previsto'] += Number(t.valor);
  });
  Object.entries(porCat)
    .map(([k, v]) => [catById[k]?.nome || '— sem categoria —', v.tipo,
      v.realizado.toFixed(2).replace('.', ','),
      v.previsto.toFixed(2).replace('.', ','),
      (v.previsto + v.realizado).toFixed(2).replace('.', ',')])
    .sort((a, b) => parseFloat(b[4].replace(',', '.')) - parseFloat(a[4].replace(',', '.')))
    .forEach(r => rows.push(r));

  rows.push([]);
  rows.push(['Por banco (apenas realizados)']);
  rows.push(['Banco','Receitas','Despesas','Saldo']);
  const porBanco = {};
  noPeriodo.forEach(t => {
    if (t.tipoConta !== 'banco' || !t.contaId || t.status !== 'realizado') return;
    const k = t.contaId;
    if (!porBanco[k]) porBanco[k] = { receitas: 0, despesas: 0 };
    porBanco[k][t.tipo === 'receita' ? 'receitas' : 'despesas'] += Number(t.valor);
  });
  Object.entries(porBanco).forEach(([k, v]) => {
    rows.push([
      bancoById[k]?.nome || '— removido —',
      v.receitas.toFixed(2).replace('.', ','),
      v.despesas.toFixed(2).replace('.', ','),
      (v.receitas - v.despesas).toFixed(2).replace('.', ',')
    ]);
  });

  _baixarCSV(`balancete_${labelPeriodo}.csv`, rows);
  toast('Balancete exportado', labelPeriodo, 'success');
}

// Adiciona N meses a uma data ISO (YYYY-MM-DD), preservando o dia
function _addMonthsISO(isoDate, months) {
  const d = new Date(isoDate + 'T12:00:00');
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0,10);
}

// Gera array de parcelas iguais com vencimentos mensais
function _gerarParcelas(valorTotal, numParcelas, primeiroVencimento) {
  const valorParcela = Math.round((valorTotal / numParcelas) * 100) / 100;
  const ajusteUltima = valorTotal - (valorParcela * numParcelas); // resíduo de centavos
  const parcelas = [];
  for (let i = 1; i <= numParcelas; i++) {
    parcelas.push({
      numero: i,
      valor: i === numParcelas ? valorParcela + ajusteUltima : valorParcela,
      vencimento: _addMonthsISO(primeiroVencimento, i - 1),
      status: 'previsto',
      transacaoId: null
    });
  }
  return parcelas;
}

async function novoHonorarioFlow(opts) {
  // Compat: chamada com string = processoIdFixo (forma antiga, ainda usada
  // pela aba "Honorários" do processo). Forma nova: { processoIdFixo?, clienteIdFixo? }.
  if (typeof opts === 'string') opts = { processoIdFixo: opts };
  const { processoIdFixo, clienteIdFixo } = opts || {};

  const [clientes, processos] = await Promise.all([
    DB.getAllClientes(), DB.getAllProcesses()
  ]);
  if (clientes.length === 0) {
    toast('Cadastre um cliente primeiro', 'Vá em /clientes e adicione', 'error');
    return;
  }

  // Determina cliente padrão
  let clienteIdInicial = clienteIdFixo || '';
  let processosCobertosIniciais = [];
  if (processoIdFixo) {
    const proc = processos.find(p => p.id === processoIdFixo);
    if (proc) {
      clienteIdInicial = clienteIdInicial || proc.clienteId || '';
      processosCobertosIniciais = [processoIdFixo];
    }
  }

  const cliOpts = clientes
    .filter(c => c.ativo !== false)
    .sort((a,b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'))
    .map(c => ({ value: c.id, label: c.nome }));

  const hojeISO = new Date().toISOString().slice(0,10);
  const proxMes = _addMonthsISO(hojeISO, 1);

  const fields = [
    ...(clienteIdFixo ? [] : [
      { label: 'Cliente', name: 'clienteId', type: 'select', default: clienteIdInicial,
        options: [{ value: '', label: '— escolher —' }, ...cliOpts] }
    ]),
    { label: 'Tipo de honorário', name: 'tipoHonorario', type: 'select', default: 'fixo', options: [
      { value: 'fixo', label: 'Fixo (valor pré-definido)' },
      { value: 'percentual', label: 'Percentual sobre valor da causa' },
      { value: 'exito', label: 'Êxito (success fee)' },
      { value: 'misto', label: 'Misto (combinação)' }
    ]},
    { label: 'Valor total (R$)', name: 'valorTotal', type: 'number', default: '', placeholder: '5000,00' },
    { label: 'Número de parcelas', name: 'numParcelas', type: 'number', default: '1', min: '1', max: '60' },
    { label: 'Vencimento da 1ª parcela', name: 'primeiroVencimento', type: 'date', default: proxMes },
    { label: 'Observações (opcional)', name: 'observacoes', placeholder: 'Forma de pagamento, condições, etc.' }
  ];

  // Intro contextual
  const intro = (() => {
    const partes = [];
    if (clienteIdFixo) {
      const c = clientes.find(x => x.id === clienteIdFixo);
      if (c) partes.push(`Cliente: <strong>${escapeHtml(c.nome)}</strong>`);
    }
    if (processoIdFixo) {
      const p = processos.find(x => x.id === processoIdFixo);
      if (p) partes.push(`Processo coberto: <strong>${escapeHtml(p.cnj || p.name || '—')}</strong>`);
    }
    if (partes.length === 0) partes.push('Vincule honorário a um cliente. Lista de processos cobertos pode ser editada depois.');
    return partes.join(' · ');
  })();

  const r = await showModal('Novo honorário', fields, { confirmLabel: 'Cadastrar', intro });
  if (!r) return;

  let clienteId, tipo, valor, numParcelas, primeiroVenc, observacoes;
  if (clienteIdFixo) {
    [tipo, valor, numParcelas, primeiroVenc, observacoes] = r;
    clienteId = clienteIdFixo;
  } else {
    [clienteId, tipo, valor, numParcelas, primeiroVenc, observacoes] = r;
  }

  if (!clienteId) { toast('Escolha um cliente', '', 'error'); return; }
  const valorNum = parseFloat(valor);
  if (!valorNum || valorNum <= 0) { toast('Valor inválido', '', 'error'); return; }
  const n = Math.max(1, Math.min(60, parseInt(numParcelas) || 1));
  if (!primeiroVenc) { toast('Data de vencimento obrigatória', '', 'error'); return; }

  const cliente = clientes.find(c => c.id === clienteId);
  const honorario = {
    id: uid(),
    clienteId,
    clienteNome: cliente?.nome || '',
    processosCobertos: processosCobertosIniciais,
    tipoHonorario: tipo || 'fixo',
    valorTotal: valorNum,
    parcelas: _gerarParcelas(valorNum, n, primeiroVenc),
    observacoes: (observacoes || '').trim(),
    createdAt: Date.now()
  };
  await DB.saveHonorario(honorario);
  toast('Honorário cadastrado', `${n} parcela(s) de ${brl(honorario.parcelas[0].valor)}`, 'success');

  // Re-renderiza onde está
  if (state.currentRoute === 'process') {
    state._processView.honorarios = await DB.getHonorariosByProcess(state.currentProcessId);
    renderProcessTabContent();
  } else {
    renderFinanceiro();
  }
}

// Vincula/desvincula processo do array processosCobertos do honorário.
async function vincularProcessoHonorario(honorarioId) {
  const [honorarios, processos, clientes] = await Promise.all([
    DB.getAllHonorarios(), DB.getAllProcesses(), DB.getAllClientes()
  ]);
  const h = honorarios.find(x => x.id === honorarioId);
  if (!h) return;

  // Mostra processos do mesmo cliente prioritariamente, mas permite escolher qualquer um
  const procsDoCliente = h.clienteId ? processos.filter(p => p.clienteId === h.clienteId) : [];
  const outrosProcs = processos.filter(p => !procsDoCliente.includes(p));
  const cobertos = new Set(_processosDoHonorario(h));

  const opts = [
    { value: '', label: '— escolher processo pra vincular —' },
    ...procsDoCliente.filter(p => !cobertos.has(p.id)).map(p => ({
      value: p.id, label: '★ ' + (p.cnj ? p.cnj + ' · ' : '') + (p.name || '—') + ' (mesmo cliente)'
    })),
    ...outrosProcs.filter(p => !cobertos.has(p.id)).map(p => ({
      value: p.id, label: (p.cnj ? p.cnj + ' · ' : '') + (p.name || '—') + (p.client ? ' · ' + p.client : '')
    }))
  ];

  if (opts.length === 1) {
    toast('Nenhum processo disponível', 'Todos os processos já estão vinculados ou não há processos cadastrados.', 'info');
    return;
  }

  const cli = h.clienteId ? clientes.find(c => c.id === h.clienteId) : null;
  const r = await showModal('Vincular processo ao honorário', [
    { label: 'Processo', name: 'processoId', type: 'select', default: '', options: opts }
  ], {
    confirmLabel: 'Vincular',
    intro: cli
      ? `Cliente: <strong>${escapeHtml(cli.nome)}</strong> · ★ = processos do mesmo cliente`
      : 'Honorário sem cliente vinculado — qualquer processo aparece na lista'
  });
  if (!r) return;
  const [processoId] = r;
  if (!processoId) { toast('Escolha um processo', '', 'error'); return; }

  if (!Array.isArray(h.processosCobertos)) h.processosCobertos = _processosDoHonorario(h);
  if (!h.processosCobertos.includes(processoId)) h.processosCobertos.push(processoId);
  await DB.saveHonorario(h);
  toast('Processo vinculado', '', 'success');
  renderFinanceiro();
}

async function desvincularProcessoHonorario(honorarioId, processoId) {
  const honorarios = await DB.getAllHonorarios();
  const h = honorarios.find(x => x.id === honorarioId);
  if (!h) return;
  const ok = await confirmDialog('Desvincular processo?',
    'O processo deixa de estar coberto por este honorário, mas as transações de pagamento já criadas permanecem.', false);
  if (!ok) return;
  if (!Array.isArray(h.processosCobertos)) h.processosCobertos = _processosDoHonorario(h);
  h.processosCobertos = h.processosCobertos.filter(pid => pid !== processoId);
  await DB.saveHonorario(h);
  toast('Processo desvinculado', '', 'success');
  renderFinanceiro();
}

async function marcarParcelaPaga(honorarioId, numeroParcela) {
  const [honorarios, bancos, categorias] = await Promise.all([
    DB.getAllHonorarios(), DB.getAllBancos(), DB.getAllCategoriasFin()
  ]);
  const h = honorarios.find(x => x.id === honorarioId);
  if (!h) return;
  const parc = (h.parcelas || []).find(p => p.numero === numeroParcela);
  if (!parc) return;
  if (parc.status === 'pago') { toast('Parcela já está paga', '', 'info'); return; }
  if (bancos.length === 0) {
    toast('Cadastre um banco primeiro', '', 'error');
    return;
  }
  const catReceita = categorias.find(c => c.tipo === 'receita' && /honorário/i.test(c.nome)) ||
                     categorias.find(c => c.tipo === 'receita');
  const hojeISO = new Date().toISOString().slice(0,10);
  const r = await showModal(`Marcar parcela ${numeroParcela} como paga`, [
    { label: 'Data do recebimento', type: 'date', default: hojeISO },
    { label: 'Conta que recebeu', type: 'select', default: bancos[0].id, options:
      bancos.map(b => ({ value: b.id, label: '🏦 ' + b.nome }))
    },
    { label: 'Valor recebido (R$)', type: 'number', default: String(parc.valor), placeholder: 'Em geral igual ao valor da parcela' },
    { label: 'Observação (opcional)', default: '' }
  ], {
    confirmLabel: 'Confirmar pagamento',
    intro: `Vencimento: <strong>${formatDate(parc.vencimento)}</strong> · Valor previsto: <strong>${brl(parc.valor)}</strong>`
  });
  if (!r) return;
  const [dataRecebimento, contaId, valor, obs] = r;
  const valorRecebido = parseFloat(valor) || parc.valor;

  // Determina processoId pra transação:
  // - Se está abrindo dentro de um processo, usa esse
  // - Senão, se há exatamente 1 processo coberto, usa ele
  // - Senão, deixa null (cliente sem processo específico)
  const procsCobertos = _processosDoHonorario(h);
  let processoIdTransacao = null;
  if (state.currentRoute === 'process' && state.currentProcessId && procsCobertos.includes(state.currentProcessId)) {
    processoIdTransacao = state.currentProcessId;
  } else if (procsCobertos.length === 1) {
    processoIdTransacao = procsCobertos[0];
  }

  // Cria transação de receita automaticamente
  const transacao = {
    id: uid(),
    tipo: 'receita',
    valor: valorRecebido,
    data: dataRecebimento || hojeISO,
    categoriaId: catReceita?.id || null,
    contaId,
    tipoConta: 'banco',
    clienteId: h.clienteId || null,
    clienteNome: h.clienteNome || null,
    processoId: processoIdTransacao,
    honorarioId: h.id,
    parcelaNumero: numeroParcela,
    descricao: `Honorário · parcela ${numeroParcela}/${h.parcelas.length}${obs ? ' · ' + obs : ''}`,
    status: 'realizado',
    createdAt: Date.now()
  };
  await DB.saveTransacao(transacao);

  // Atualiza parcela
  parc.status = 'pago';
  parc.transacaoId = transacao.id;
  parc.dataRecebimento = transacao.data;
  parc.valorRecebido = valorRecebido;
  await DB.saveHonorario(h);

  toast('Pagamento registrado', `${brl(valorRecebido)} · transação criada em receita`, 'success');
  if (state.currentRoute === 'process') {
    state._processView.honorarios = await DB.getHonorariosByProcess(state.currentProcessId);
    renderProcessTabContent();
  } else {
    renderFinanceiro();
  }
}

async function desfazerPagamentoParcela(honorarioId, numeroParcela) {
  const honorarios = await DB.getAllHonorarios();
  const h = honorarios.find(x => x.id === honorarioId);
  if (!h) return;
  const parc = (h.parcelas || []).find(p => p.numero === numeroParcela);
  if (!parc || parc.status !== 'pago') return;
  const ok = await confirmDialog('Desfazer pagamento?',
    'A transação de receita criada será removida e a parcela voltará para "previsto". Use isso pra corrigir lançamentos errados.',
    true);
  if (!ok) return;
  if (parc.transacaoId) {
    try { await DB.deleteTransacao(parc.transacaoId); } catch(e) { console.warn(e); }
  }
  parc.status = 'previsto';
  delete parc.transacaoId;
  delete parc.dataRecebimento;
  delete parc.valorRecebido;
  await DB.saveHonorario(h);
  toast('Pagamento desfeito', '', 'info');
  if (state.currentRoute === 'process') {
    state._processView.honorarios = await DB.getHonorariosByProcess(state.currentProcessId);
    renderProcessTabContent();
  } else {
    renderFinanceiro();
  }
}

];

function _agTipoMeta(tipo) {
  return COMPROMISSO_TIPOS.find(t => t.value === tipo) || COMPROMISSO_TIPOS[5];
}
function _agStatusMeta(status) {
  return COMPROMISSO_STATUS.find(s => s.value === status) || COMPROMISSO_STATUS[0];
}

// Marco de compromisso (T-1 / T-0 / T+1) baseado em dataHoraInicio.
// Não dispara em status terminal (realizado/cancelado).
function _marcoDoCompromisso(c, hoje) {
  if (!c || !c.dataHoraInicio) return null;
  if (c.status === 'realizado' || c.status === 'cancelado') return null;
  const today = hoje || (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
  const inicio = new Date(c.dataHoraInicio);
  inicio.setHours(0, 0, 0, 0);
  const days = Math.ceil((inicio - today) / 86400000);
  if (days === 1) return 'T-1';
  if (days === 0) return 'T-0';
  if (days === -1) return 'T+1';
  return null;
}

async function renderAgenda() {
  const [compromissos, processos, clientes, deadlines] = await Promise.all([
    DB.getAllCompromissos(), DB.getAllProcesses(), DB.getAllClientes(), DB.getAllDeadlines()
  ]);
  const procById = {}; processos.forEach(p => procById[p.id] = p);
  const cliById = {}; clientes.forEach(c => cliById[c.id] = c);

  // Atualiza badge nav
  const today = new Date(); today.setHours(0,0,0,0);
  const proximos7 = compromissos.filter(c => {
    if (c.status === 'cancelado' || c.status === 'realizado') return false;
    const dt = new Date(c.dataHoraInicio || 0);
    const diff = Math.ceil((dt - today) / 86400000);
    return diff >= 0 && diff <= 7;
  });
  const navBadge = $('navAgendaCount');
  if (navBadge) {
    if (proximos7.length > 0) { navBadge.textContent = proximos7.length; navBadge.classList.remove('hidden'); }
    else navBadge.classList.add('hidden');
  }

  state._agFiltro = state._agFiltro || {
    periodo: 'prox30',  // semana | prox30 | mes | custom | todos
    dataInicio: '', dataFim: '',
    tipo: 'todos',
    status: 'ativos',  // ativos = exclui cancelado+realizado
    responsavel: '',
    busca: '',
    incluirPrazos: true   // overlay de prazos ativos (read-only)
  };
  const f = state._agFiltro;
  if (f.incluirPrazos === undefined) f.incluirPrazos = true;

  // v6.30: modo de visualização (lista vs calendário) + mês de referência
  if (!state._agViewMode) state._agViewMode = 'lista';
  if (!state._agCalRef) {
    const t = new Date();
    state._agCalRef = { ano: t.getFullYear(), mes: t.getMonth() };
  }
  const viewMode = state._agViewMode;
  const calRef = state._agCalRef;

  // Resolve range de datas
  let dataInicioISO = '', dataFimISO = '';
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (viewMode === 'calendario') {
    // Calendário sempre mostra o mês de calRef inteiro, ignora f.periodo
    const ini = new Date(calRef.ano, calRef.mes, 1);
    const fim = new Date(calRef.ano, calRef.mes + 1, 0);
    dataInicioISO = ini.toISOString().slice(0, 10);
    dataFimISO = fim.toISOString().slice(0, 10);
  } else if (f.periodo === 'semana') {
    dataInicioISO = hoje.toISOString().slice(0, 10);
    dataFimISO = new Date(hoje.getTime() + 7 * 86400000).toISOString().slice(0, 10);
  } else if (f.periodo === 'prox30') {
    dataInicioISO = hoje.toISOString().slice(0, 10);
    dataFimISO = new Date(hoje.getTime() + 30 * 86400000).toISOString().slice(0, 10);
  } else if (f.periodo === 'mes') {
    dataInicioISO = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0, 10);
    dataFimISO = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).toISOString().slice(0, 10);
  } else if (f.periodo === 'custom') {
    dataInicioISO = f.dataInicio || '';
    dataFimISO = f.dataFim || '';
  }

  let filtrados = compromissos.slice();
  if (f.tipo !== 'todos') filtrados = filtrados.filter(c => c.tipo === f.tipo);
  if (f.status === 'ativos') filtrados = filtrados.filter(c => c.status !== 'cancelado' && c.status !== 'realizado');
  else if (f.status !== 'todos') filtrados = filtrados.filter(c => c.status === f.status);
  if (f.responsavel) filtrados = filtrados.filter(c => c.responsavel === f.responsavel);
  if (dataInicioISO) filtrados = filtrados.filter(c => (c.dataHoraInicio || '').slice(0, 10) >= dataInicioISO);
  if (dataFimISO) filtrados = filtrados.filter(c => (c.dataHoraInicio || '').slice(0, 10) <= dataFimISO);
  if (f.busca && f.busca.trim()) {
    const q = f.busca.trim().toLowerCase();
    filtrados = filtrados.filter(c =>
      (c.titulo || '').toLowerCase().includes(q) ||
      (c.local || '').toLowerCase().includes(q) ||
      (c.observacoes || '').toLowerCase().includes(q)
    );
  }
  filtrados.sort((a, b) => (a.dataHoraInicio || '').localeCompare(b.dataHoraInicio || ''));

  // ===== Overlay de prazos ativos =====
  // Read-only: mostra prazo no dia da deadlineDate. Editar/cumprir continua
  // em /prazos. O filtro "Tipo" só esconde quando o usuário escolhe um
  // tipo específico de compromisso (não 'todos').
  let prazosOverlay = [];
  if (f.incluirPrazos && f.tipo === 'todos') {
    prazosOverlay = (deadlines || []).filter(d => prazoEstaAtivo(d));
    if (f.responsavel) prazosOverlay = prazosOverlay.filter(d => d.advogadoResponsavel === f.responsavel);
    if (dataInicioISO) prazosOverlay = prazosOverlay.filter(d => (d.deadlineDate || '').slice(0, 10) >= dataInicioISO);
    if (dataFimISO) prazosOverlay = prazosOverlay.filter(d => (d.deadlineDate || '').slice(0, 10) <= dataFimISO);
    if (f.busca && f.busca.trim()) {
      const q = f.busca.trim().toLowerCase();
      prazosOverlay = prazosOverlay.filter(d =>
        (d.description || '').toLowerCase().includes(q) ||
        (d.type || '').toLowerCase().includes(q) ||
        (procById[d.processId]?.name || '').toLowerCase().includes(q) ||
        (procById[d.processId]?.cnj || '').toLowerCase().includes(q)
      );
    }
  }

  // Stats
  const venceram = compromissos.filter(c => {
    if (c.status === 'cancelado' || c.status === 'realizado') return false;
    return new Date(c.dataHoraInicio || 0) < new Date();
  }).length;

  // Agrupa por dia (ISO YYYY-MM-DD) — compromissos + prazos misturados
  const porDia = {};
  for (const c of filtrados) {
    const dia = (c.dataHoraInicio || '').slice(0, 10);
    if (!porDia[dia]) porDia[dia] = [];
    porDia[dia].push({ kind: 'compromisso', item: c, ts: c.dataHoraInicio || '' });
  }
  for (const d of prazosOverlay) {
    const dia = (d.deadlineDate || '').slice(0, 10);
    if (!porDia[dia]) porDia[dia] = [];
    // Sort key: prazo aparece no fim do dia (sem hora específica)
    porDia[dia].push({ kind: 'prazo', item: d, ts: dia + 'T23:59:00' });
  }
  // Ordenar dentro de cada dia
  Object.values(porDia).forEach(arr => arr.sort((a, b) => (a.ts || '').localeCompare(b.ts || '')));
  const diasOrdenados = Object.keys(porDia).sort();

  const calMesLabel = new Date(calRef.ano, calRef.mes, 1)
    .toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  $('appContent').innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="smallcaps-prefix">Agenda</span></h1>
        <p class="page-subtitle">${compromissos.length} compromisso(s) · ${proximos7.length} nos próximos 7 dias${prazosOverlay.length ? ' · ⏰ ' + prazosOverlay.length + ' prazo(s) na visão' : ''}${venceram > 0 ? ' · <span style="color: var(--uc-red);">⚠ ' + venceram + ' compromisso(s) venceu(ram) sem marcação</span>' : ''}</p>
      </div>
      <div class="flex gap-2 items-center">
        <div style="display: inline-flex; border: 1px solid var(--uc-line); border-radius: 6px; overflow: hidden;">
          <button class="btn ${viewMode === 'lista' ? 'btn-primary' : 'btn-ghost'} btn-sm" style="border-radius: 0; min-width: 80px;" onclick="_setAgViewMode('lista')">📋 Lista</button>
          <button class="btn ${viewMode === 'calendario' ? 'btn-primary' : 'btn-ghost'} btn-sm" style="border-radius: 0; min-width: 100px;" onclick="_setAgViewMode('calendario')">📅 Calendário</button>
        </div>
        <button class="btn btn-primary" onclick="novoCompromissoFlow()">+ Novo compromisso</button>
      </div>
    </div>

    ${viewMode === 'calendario' ? `
      <div class="card mb-3" style="padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
        <div class="flex gap-2 items-center">
          <button class="btn btn-ghost btn-sm" onclick="_navegarMesAgenda(-1)" title="Mês anterior">‹</button>
          <strong style="font-size: 16px; text-transform: capitalize; min-width: 160px; text-align: center;">${calMesLabel}</strong>
          <button class="btn btn-ghost btn-sm" onclick="_navegarMesAgenda(1)" title="Próximo mês">›</button>
          <button class="btn btn-outline btn-sm" onclick="_irParaMesAtualAgenda()" title="Voltar pra hoje">Hoje</button>
        </div>
        <div class="flex gap-2 items-center flex-wrap" style="font-size: 12px;">
          <select class="select" style="font-size: 12px;" onchange="_setAgFiltro('tipo', this.value)">
            <option value="todos" ${f.tipo === 'todos' ? 'selected' : ''}>Todos os tipos</option>
            ${COMPROMISSO_TIPOS.map(t => `<option value="${t.value}" ${f.tipo === t.value ? 'selected' : ''}>${t.icon} ${t.label}</option>`).join('')}
          </select>
          <select class="select" style="font-size: 12px;" onchange="_setAgFiltro('responsavel', this.value)">
            <option value="" ${!f.responsavel ? 'selected' : ''}>Todos responsáveis</option>
            ${ADVOGADOS.map(n => `<option value="${escapeHtml(n)}" ${f.responsavel === n ? 'selected' : ''}>${escapeHtml(n.split(' ')[0])} ${escapeHtml(n.split(' ').slice(-1)[0])}</option>`).join('')}
          </select>
          <select class="select" style="font-size: 12px;" onchange="_setAgFiltro('status', this.value)">
            <option value="ativos" ${f.status === 'ativos' ? 'selected' : ''}>Ativos</option>
            <option value="todos" ${f.status === 'todos' ? 'selected' : ''}>Todos status</option>
            ${COMPROMISSO_STATUS.map(s => `<option value="${s.value}" ${f.status === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}
          </select>
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
            <input type="checkbox" ${f.incluirPrazos ? 'checked' : ''} onchange="_setAgFiltro('incluirPrazos', this.checked)" style="cursor: pointer;">
            <span>⏰ Prazos</span>
          </label>
        </div>
      </div>
      ${_renderAgendaCalendario(porDia, hoje, calRef, procById, cliById)}
    ` : `
    <div class="card mb-3" style="padding: 10px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; align-items: end;">
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Período</label>
          <select class="select" onchange="_setAgFiltro('periodo', this.value)">
            <option value="semana" ${f.periodo === 'semana' ? 'selected' : ''}>Próximos 7 dias</option>
            <option value="prox30" ${f.periodo === 'prox30' ? 'selected' : ''}>Próximos 30 dias</option>
            <option value="mes" ${f.periodo === 'mes' ? 'selected' : ''}>Este mês</option>
            <option value="custom" ${f.periodo === 'custom' ? 'selected' : ''}>Custom</option>
            <option value="todos" ${f.periodo === 'todos' ? 'selected' : ''}>Todos</option>
          </select>
        </div>
        ${f.periodo === 'custom' ? `
          <div><label class="label" style="font-size: 11px; margin-bottom: 4px;">De</label><input type="date" class="input" value="${f.dataInicio || ''}" onchange="_setAgFiltro('dataInicio', this.value)"></div>
          <div><label class="label" style="font-size: 11px; margin-bottom: 4px;">Até</label><input type="date" class="input" value="${f.dataFim || ''}" onchange="_setAgFiltro('dataFim', this.value)"></div>
        ` : ''}
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Tipo</label>
          <select class="select" onchange="_setAgFiltro('tipo', this.value)">
            <option value="todos" ${f.tipo === 'todos' ? 'selected' : ''}>Todos</option>
            ${COMPROMISSO_TIPOS.map(t => `<option value="${t.value}" ${f.tipo === t.value ? 'selected' : ''}>${t.icon} ${t.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Status</label>
          <select class="select" onchange="_setAgFiltro('status', this.value)">
            <option value="ativos" ${f.status === 'ativos' ? 'selected' : ''}>Ativos</option>
            <option value="todos" ${f.status === 'todos' ? 'selected' : ''}>Todos</option>
            ${COMPROMISSO_STATUS.map(s => `<option value="${s.value}" ${f.status === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label" style="font-size: 11px; margin-bottom: 4px;">Responsável</label>
          <select class="select" onchange="_setAgFiltro('responsavel', this.value)">
            <option value="" ${!f.responsavel ? 'selected' : ''}>Todos</option>
            ${ADVOGADOS.map(n => `<option value="${escapeHtml(n)}" ${f.responsavel === n ? 'selected' : ''}>${escapeHtml(n.split(' ')[0])} ${escapeHtml(n.split(' ').slice(-1)[0])}</option>`).join('')}
          </select>
        </div>
        <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 200px;">
            <label class="label" style="font-size: 11px; margin-bottom: 4px;">Buscar</label>
            <input type="text" class="input" value="${escapeHtml(f.busca || '')}" placeholder="Título, local, observações" oninput="_setAgFiltroDebounced('busca', this.value)">
          </div>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--uc-graphite); padding-bottom: 6px; user-select: none;">
            <input type="checkbox" ${f.incluirPrazos ? 'checked' : ''} onchange="_setAgFiltro('incluirPrazos', this.checked)" style="cursor: pointer;">
            <span>⏰ Incluir prazos do processo${f.tipo !== 'todos' ? ' <em style="color: var(--uc-warm-gray);">(oculto: filtro de tipo)</em>' : ''}</span>
          </label>
        </div>
      </div>
    </div>

    ${(filtrados.length === 0 && prazosOverlay.length === 0) ? `
      <div class="empty-state">
        <p class="empty-state-msg">${compromissos.length === 0 ? 'Nenhum compromisso cadastrado. Use o botão "+ Novo compromisso" para começar.' : 'Nenhum compromisso ou prazo com esses filtros.'}</p>
      </div>
    ` : diasOrdenados.map(dia => {
      const dt = new Date(dia + 'T12:00:00');
      const labelDia = dt.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      const isHoje = dia === hoje.toISOString().slice(0, 10);
      const isPassado = dia < hoje.toISOString().slice(0, 10);
      return `
        <div style="margin-bottom: 18px;">
          <h3 style="font-size: 13px; font-weight: 600; color: ${isHoje ? 'var(--uc-red)' : isPassado ? 'var(--uc-warm-gray)' : 'var(--uc-black)'}; margin: 0 0 8px; text-transform: capitalize;">
            ${isHoje ? '📍 ' : ''}${labelDia}${isHoje ? ' (hoje)' : ''}
          </h3>
          ${porDia[dia].map(entry => entry.kind === 'compromisso'
            ? _renderCompromissoCard(entry.item, procById, cliById)
            : _renderPrazoNaAgenda(entry.item, procById, today)
          ).join('')}
        </div>
      `;
    }).join('')}
    `}
  `;
  // Salva refs pra modais de dia consultarem sem refazer fetch
  state._agData = { porDia, procById, cliById, today };
}

// Toggle entre lista e calendário
function _setAgViewMode(mode) {
  state._agViewMode = mode;
  renderAgenda();
}
function _navegarMesAgenda(delta) {
  const ref = state._agCalRef || { ano: new Date().getFullYear(), mes: new Date().getMonth() };
  let novoAno = ref.ano, novoMes = ref.mes + delta;
  if (novoMes < 0) { novoMes = 11; novoAno--; }
  if (novoMes > 11) { novoMes = 0; novoAno++; }
  state._agCalRef = { ano: novoAno, mes: novoMes };
  renderAgenda();
}
function _irParaMesAtualAgenda() {
  const t = new Date();
  state._agCalRef = { ano: t.getFullYear(), mes: t.getMonth() };
  renderAgenda();
}

// Grid 7×N do mês. Cada célula com até 3 chips visíveis + "+N mais".
function _renderAgendaCalendario(porDia, hoje, calRef, procById, cliById) {
  const ano = calRef.ano, mes = calRef.mes;
  const primeiroDia = new Date(ano, mes, 1);
  const ultimoDia = new Date(ano, mes + 1, 0);
  const totalDias = ultimoDia.getDate();
  // Domingo = 0 ... Sábado = 6
  const offsetInicio = primeiroDia.getDay();
  // Total de células = múltiplo de 7 que cobre o mês
  const totalCelulas = Math.ceil((offsetInicio + totalDias) / 7) * 7;

  const hojeISO = hoje.toISOString().slice(0, 10);
  const semana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  const celulas = [];
  for (let i = 0; i < totalCelulas; i++) {
    const diaNum = i - offsetInicio + 1;
    if (diaNum < 1 || diaNum > totalDias) {
      celulas.push({ vazio: true, dia: null });
      continue;
    }
    const dt = new Date(ano, mes, diaNum);
    const iso = dt.toISOString().slice(0, 10);
    const eventos = porDia[iso] || [];
    const dow = dt.getDay();
    celulas.push({
      vazio: false,
      diaNum,
      iso,
      eventos,
      isHoje: iso === hojeISO,
      isPassado: iso < hojeISO,
      isFimSemana: dow === 0 || dow === 6
    });
  }

  return `
    <style>
      .ag-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--uc-line); border: 1px solid var(--uc-line); border-radius: 6px; overflow: hidden; }
      .ag-cal-head { background: var(--uc-cream); padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--uc-warm-gray); text-transform: uppercase; letter-spacing: 0.5px; }
      .ag-cal-cell { background: var(--uc-paper); min-height: 110px; padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; transition: background 0.1s; position: relative; }
      .ag-cal-cell:hover { background: var(--uc-cream); }
      .ag-cal-cell.vazio { background: var(--uc-cream); cursor: default; }
      .ag-cal-cell.vazio:hover { background: var(--uc-cream); }
      .ag-cal-cell.passado .ag-cal-day { color: var(--uc-warm-gray); }
      .ag-cal-cell.fimsemana { background: var(--uc-cream); }
      .ag-cal-cell.hoje { background: var(--uc-amber-soft); }
      .ag-cal-cell.hoje .ag-cal-day { color: var(--uc-red); font-weight: 700; }
      .ag-cal-day { font-size: 13px; font-weight: 600; color: var(--uc-graphite); }
      .ag-cal-chip { font-size: 10px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; cursor: pointer; }
      .ag-cal-chip.compromisso { background: var(--uc-cream); border-left: 3px solid var(--uc-gold); color: var(--uc-graphite); }
      .ag-cal-chip.prazo { background: var(--uc-amber-soft); border-left: 3px solid var(--uc-amber); color: var(--uc-graphite); }
      .ag-cal-chip.prazo.urgente { background: var(--uc-red-soft); border-left-color: var(--uc-red); }
      .ag-cal-mais { font-size: 10px; color: var(--uc-gold); padding: 2px 0; font-weight: 500; }
      @media (max-width: 768px) {
        .ag-cal-cell { min-height: 70px; padding: 4px 2px; }
        .ag-cal-chip { font-size: 9px; padding: 1px 3px; }
        .ag-cal-day { font-size: 11px; }
      }
    </style>
    <div class="ag-cal-grid">
      ${semana.map(d => `<div class="ag-cal-head">${d}</div>`).join('')}
      ${celulas.map(c => {
        if (c.vazio) return `<div class="ag-cal-cell vazio"></div>`;
        const cls = ['ag-cal-cell'];
        if (c.isHoje) cls.push('hoje');
        if (c.isPassado) cls.push('passado');
        if (c.isFimSemana) cls.push('fimsemana');
        const visiveis = c.eventos.slice(0, 3);
        const restantes = c.eventos.length - visiveis.length;
        return `
          <div class="${cls.join(' ')}" onclick="_abrirDiaAgenda('${c.iso}')">
            <div class="ag-cal-day">${c.diaNum}</div>
            ${visiveis.map(e => {
              if (e.kind === 'compromisso') {
                const meta = _agTipoMeta(e.item.tipo);
                const hora = e.item.dataHoraInicio ? new Date(e.item.dataHoraInicio).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
                return `<div class="ag-cal-chip compromisso" style="border-left-color: ${meta.cor};" onclick="event.stopPropagation(); editarCompromisso('${e.item.id}')">${meta.icon} ${hora ? hora + ' ' : ''}${escapeHtml((e.item.titulo || meta.label).slice(0, 22))}</div>`;
              } else {
                const d = e.item;
                const dl = new Date(d.deadlineDate); dl.setHours(0,0,0,0);
                const days = Math.ceil((dl - hoje) / 86400000);
                const urgente = days <= 1;
                return `<div class="ag-cal-chip prazo${urgente ? ' urgente' : ''}" onclick="event.stopPropagation(); _abrirDiaAgenda('${c.iso}')" title="⏰ Prazo">⏰ ${escapeHtml((d.description || d.type || 'Prazo').slice(0, 22))}</div>`;
              }
            }).join('')}
            ${restantes > 0 ? `<div class="ag-cal-mais">+${restantes} mais</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
    <p class="help-text" style="margin-top: 12px; text-align: center;">
      Clique em um dia para ver detalhes · clique em um compromisso para editar
    </p>
  `;
}

// Modal com tudo daquele dia (compromissos + prazos), reusa cards completos
function _abrirDiaAgenda(iso) {
  const data = state._agData;
  if (!data) return;
  const eventos = data.porDia[iso] || [];
  const dt = new Date(iso + 'T12:00:00');
  const labelDia = dt.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal scroll-thin" style="max-width: 700px;">
      <h3 class="modal-title" style="text-transform: capitalize;">${escapeHtml(labelDia)}</h3>
      <p class="help-text" style="margin-bottom: 12px;">${eventos.length} item(s)${eventos.length > 0 ? '' : ' · nada agendado'}</p>
      <div style="margin-bottom: 16px;">
        ${eventos.length === 0 ? `
          <p style="color: var(--uc-warm-gray); padding: 16px; text-align: center;">Sem eventos neste dia.</p>
        ` : eventos.map(e => e.kind === 'compromisso'
          ? _renderCompromissoCard(e.item, data.procById, data.cliById)
          : _renderPrazoNaAgenda(e.item, data.procById, data.today)
        ).join('')}
      </div>
      <div class="flex gap-2">
        <button class="btn btn-outline" id="_diaFechar" style="flex: 1;">Fechar</button>
        <button class="btn btn-primary" id="_diaNovo" style="flex: 1;">+ Novo compromisso neste dia</button>
      </div>
    </div>
  `;
  $('modalContainer').appendChild(modal);
  const cleanup = () => modal.remove();
  document.getElementById('_diaFechar').onclick = cleanup;
  document.getElementById('_diaNovo').onclick = () => {
    cleanup();
    state._agNovoCompromissoDataInicial = iso;
    novoCompromissoFlow();
  };
}

// Card de prazo dentro da agenda — v6.29: botões inline pra cumprir/suspender/cancelar
// sem precisar navegar pra /prazos. Mantém o → como atalho pra ver o histórico
// completo do prazo no contexto do processo.
function _renderPrazoNaAgenda(d, procById, today) {
  const proc = (d.processId && procById && typeof procById === 'object') ? procById[d.processId] : null;
  const visual = recomputarStatusVisual(d, today);
  const dl = new Date(d.deadlineDate);
  dl.setHours(0,0,0,0);
  const days = Math.ceil((dl - today) / 86400000);
  let cor = '#4a7c4a', badgeClass = 'badge-green', label = days + 'd';
  if (visual === 'expirado') { cor = '#a8472d'; badgeClass = 'badge-red'; label = 'vencido há ' + Math.abs(days) + 'd'; }
  else if (visual === 'iminente') { cor = '#a8472d'; badgeClass = 'badge-red'; label = days === 0 ? 'HOJE' : 'AMANHÃ'; }
  else if (visual === 'vincendo') { cor = '#b87f1c'; badgeClass = 'badge-amber'; label = days + 'd'; }
  else if (visual === 'suspenso') { cor = '#6b6b68'; badgeClass = 'badge-gray'; label = 'suspenso'; }
  const procLabel = proc ? (proc.cnj || proc.name || 'processo') : '(processo removido)';

  // Ações contextuais idênticas ao card no /prazos. Suspenso → reabrir/cancelar.
  // Pendente/visual ativo → cumprir/suspender/cancelar.
  let acoes = '';
  if (visual === 'suspenso') {
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); reabrirPrazo('${d.id}')" title="Reabrir prazo" style="padding: 2px 6px;">▶</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalCancelar('${d.id}')" title="Cancelar com motivo" style="padding: 2px 6px;">⊘</button>`;
  } else if (prazoEstaAtivo(d)) {
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalCumprimento('${d.id}')" title="Marcar como cumprido (data + protocolo)" style="padding: 2px 6px;">✓</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalSuspender('${d.id}')" title="Suspender (pausa lembretes)" style="padding: 2px 6px;">⏸</button>`;
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); abrirModalCancelar('${d.id}')" title="Cancelar com motivo" style="padding: 2px 6px;">⊘</button>`;
  }
  if (proc) {
    acoes += `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); navigate('process', { currentProcessId: '${proc.id}' })" title="Abrir processo" style="padding: 2px 6px;">↗</button>`;
  }

  return `
    <div class="card" style="margin-bottom: 8px; padding: 12px; border-left: 4px solid ${cor}; background: var(--uc-cream);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap;">
            <span style="font-size: 14px;">⏰</span>
            <span class="badge badge-gray" style="font-size: 9px; background: var(--uc-graphite); color: var(--uc-cream);">PRAZO</span>
            <strong style="color: var(--uc-black); font-size: 14px;">${escapeHtml(d.description || d.type || 'Prazo')}</strong>
            <span class="badge ${badgeClass}" style="font-size: 9px;">${label}</span>
            ${d.emDobro ? '<span class="badge badge-amber" style="font-size: 9px;">DOBRO</span>' : ''}
          </div>
          <div style="font-size: 12px; color: var(--uc-warm-gray);">
            ${d.advogadoResponsavel ? '👤 ' + escapeHtml(d.advogadoResponsavel.split(' ')[0]) : ''}
            ${proc ? ` · <a onclick="event.stopPropagation(); navigate('process', { currentProcessId: '${proc.id}' })" style="cursor:pointer; color:var(--uc-gold);">${escapeHtml(procLabel)}</a>` : ` · <span style="color: var(--uc-warm-gray);">${escapeHtml(procLabel)}</span>`}
            · vence ${escapeHtml((d.deadlineDate || '').slice(0, 10))}
          </div>

async function novoCompromissoFlow(opts) {
  if (typeof opts === 'string') opts = { processoIdFixo: opts };

  const [processos, clientes] = await Promise.all([
    DB.getAllProcesses(), DB.getAllClientes()
  ]);
  const procOpts = [
    { value: '', label: '— sem processo —' },
    ...processos.sort((a,b) => (a.name || '').localeCompare(b.name || '', 'pt-BR'))
      .map(p => ({ value: p.id, label: (p.cnj ? p.cnj + ' · ' : '') + (p.name || '—') }))
  ];
  const cliOpts = [
    { value: '', label: '— sem cliente —' },
    ...clientes.filter(c => c.ativo !== false).sort((a,b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'))

    dataInicialISO = d.toISOString().slice(0, 16);
    delete state._agNovoCompromissoDataInicial;  // consumido
  } else {
    const amanha = new Date();
    amanha.setDate(amanha.getDate() + 1);
    amanha.setHours(9, 0, 0, 0);
    amanha.setMinutes(amanha.getMinutes() - amanha.getTimezoneOffset());
    dataInicialISO = amanha.toISOString().slice(0, 16);

    { label: 'Título', name: 'titulo', placeholder: 'Ex: Audiência de instrução · Reunião com cliente · Diligência cartório' },
    { label: 'Início (data e hora)', name: 'dataHoraInicio', type: 'datetime-local', default: amanhaISO },
    { label: 'Fim (opcional)', name: 'dataHoraFim', type: 'datetime-local', default: '' },
    { label: 'Local', name: 'local', placeholder: 'Sala do tribunal · endereço · link Zoom · etc.' },
    { label: 'Processo vinculado', name: 'processoId', type: 'select', default: processoIdFixo || '', options: procOpts },
    { label: 'Cliente vinculado', name: 'clienteId', type: 'select', default: clienteIdInicial, options: cliOpts },
    { label: 'Responsável', name: 'responsavel', type: 'select', default: meuNome,
      options: [{ value: '', label: '— não atribuído —' }, ...ADVOGADOS.map(n => ({ value: n, label: n }))] },
    { label: 'Status', name: 'status', type: 'select', default: 'agendado',
      options: COMPROMISSO_STATUS.map(s => ({ value: s.value, label: s.label })) },
    { label: 'Observações', name: 'observacoes', type: 'textarea', rows: 3 }
  ], {
    confirmLabel: 'Cadastrar',
    intro: 'Compromissos disparam push (T-1 dia anterior) e push+email (T-0 dia/horário) automaticamente.'
  });
  if (!r) return;
  const [tipo, titulo, dataHoraInicio, dataHoraFim, local, processoId, clienteId, responsavel, status, observacoes] = r;
  if (!titulo?.trim()) { toast('Título obrigatório', '', 'error'); return; }
  if (!dataHoraInicio) { toast('Data e hora de início obrigatórias', '', 'error'); return; }

    id: uid(),
    tipo: tipo || 'outro',
    titulo: titulo.trim(),
    dataHoraInicio: new Date(dataHoraInicio).toISOString(),
    dataHoraFim: dataHoraFim ? new Date(dataHoraFim).toISOString() : null,

  else if (state.currentRoute === 'process') renderProcessTabContent();

// Resumo consolidado do mês: pulso financeiro, processual, cliente e
// equipe. Diferente do dashboard inicial (tático/urgente), este é
// estratégico e retrospectivo. Comparativo automático com mês anterior.

// Helpers de range mensal
function _mesRange(ano, mes /* 0-11 */) {
  const inicio = new Date(ano, mes, 1);
  const fim = new Date(ano, mes + 1, 0, 23, 59, 59, 999);
  return { inicioMs: inicio.getTime(), fimMs: fim.getTime(),
    inicioISO: inicio.toISOString().slice(0,10), fimISO: fim.toISOString().slice(0,10) };
}
function _mesLabel(ano, mes) {
  return new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}
function _isInRange(ts, range) {
  if (!ts) return false;
  const ms = typeof ts === 'number' ? ts : new Date(ts).getTime();
  return ms >= range.inicioMs && ms <= range.fimMs;
}
function _isDateInRange(iso, range) {
  if (!iso) return false;
  const s = String(iso).slice(0, 10);
  return s >= range.inicioISO && s <= range.fimISO;
}
function _delta(atual, anterior) {
  if (anterior === 0) return atual === 0 ? 0 : 100;
  return ((atual - anterior) / Math.abs(anterior)) * 100;
}
function _renderDelta(d, casas) {
  if (d === 0) return '<span style="color: var(--uc-warm-gray);">—</span>';
  const s = (d > 0 ? '+' : '') + d.toFixed(casas || 1) + '%';
  const cor = d > 0 ? 'var(--uc-green)' : 'var(--uc-red)';
  return `<span style="color: ${cor}; font-weight: 600;">${s}</span>`;
}

async function renderRelatorio() {
  // Estado: mês selecionado (default = mês atual)
  if (!state._relatorioRef) {
    const hoje = new Date();
    state._relatorioRef = { ano: hoje.getFullYear(), mes: hoje.getMonth() };
  }
  const { ano, mes } = state._relatorioRef;
  const range = _mesRange(ano, mes);
  const rangePrev = _mesRange(mes === 0 ? ano - 1 : ano, mes === 0 ? 11 : mes - 1);

  // Carrega tudo em paralelo
  const [processos, prazos, honorarios, compromissos, transacoes, clientes, comunicacoes] = await Promise.all([
    DB.getAllProcesses(),
    DB.getAllDeadlines(),
    DB.getAllHonorarios(),
    DB.getAllCompromissos(),
    DB.getAllTransacoes(),
    DB.getAllClientes(),
    DB.getAllComunicacoes ? DB.getAllComunicacoes() : Promise.resolve([])
  ]);

  // ====== Stats principais ======
  const procsNovos = processos.filter(p => _isInRange(p.createdAt, range));
  const procsNovosPrev = processos.filter(p => _isInRange(p.createdAt, rangePrev));

  const prazosCumpridos = prazos.filter(d => d.status === 'cumprido' && _isDateInRange(d.cumprimento?.dataCumprimento, range));
  const prazosCumpridosPrev = prazos.filter(d => d.status === 'cumprido' && _isDateInRange(d.cumprimento?.dataCumprimento, rangePrev));
  const prazosPerdidos = prazos.filter(d => d.status === 'perdido' && _isDateInRange(d.deadlineDate, range));
  const prazosCancelados = prazos.filter(d => d.status === 'cancelado' && _isInRange(d.cancelamento?.canceladoEm, range));

  // Honorários recebidos = parcelas com status 'pago' cuja data de pagamento cai no mês
  let honRecebido = 0, honRecebidoPrev = 0, parcelasPagas = 0, parcelasPagasPrev = 0;
  honorarios.forEach(h => {
    (h.parcelas || []).forEach(p => {
      if (p.status !== 'pago') return;
      const dataPg = p.dataPagamento || p.dataPg || p.pagoEm;
      if (_isDateInRange(dataPg, range) || _isInRange(dataPg, range)) {
        honRecebido += Number(p.valor) || 0;
        parcelasPagas++;
      } else if (_isDateInRange(dataPg, rangePrev) || _isInRange(dataPg, rangePrev)) {
        honRecebidoPrev += Number(p.valor) || 0;
        parcelasPagasPrev++;
      }
    });
  });

  // Honorários a receber neste mês (vencimento)
  let honAReceber = 0, parcelasAReceber = 0;
  honorarios.forEach(h => {
    (h.parcelas || []).forEach(p => {
      if (p.status === 'pago') return;
      if (_isDateInRange(p.vencimento, range)) {
        honAReceber += Number(p.valor) || 0;
        parcelasAReceber++;
      }
    });
  });

  const compsDoMes = compromissos.filter(c => _isDateInRange(c.dataHoraInicio, range));
  const compsDoMesPrev = compromissos.filter(c => _isDateInRange(c.dataHoraInicio, rangePrev));
  const compsRealizados = compsDoMes.filter(c => c.status === 'realizado').length;
  const compsCancelados = compsDoMes.filter(c => c.status === 'cancelado').length;

  // Financeiro consolidado (mês corrente)
  const transMes = transacoes.filter(t => _isDateInRange(t.data, range) && t.status === 'realizado');
  const transMesPrev = transacoes.filter(t => _isDateInRange(t.data, rangePrev) && t.status === 'realizado');
  const receita = transMes.filter(t => t.tipo === 'receita').reduce((s, t) => s + Number(t.valor || 0), 0);
  const despesa = transMes.filter(t => t.tipo === 'despesa').reduce((s, t) => s + Number(t.valor || 0), 0);
  const saldo = receita - despesa;
  const receitaPrev = transMesPrev.filter(t => t.tipo === 'receita').reduce((s, t) => s + Number(t.valor || 0), 0);
  const despesaPrev = transMesPrev.filter(t => t.tipo === 'despesa').reduce((s, t) => s + Number(t.valor || 0), 0);

  // Cliente
  const cliNovos = clientes.filter(c => _isInRange(c.createdAt, range));
  const comsDoMes = (comunicacoes || []).filter(c => _isInRange(c.data || c.createdAt, range));
  const followUpsPendentes = (comunicacoes || []).filter(c => c.proximaAcao && !c.proximaAcaoFeita).length;

  // ====== Distribuições ======
  // Por advogado: prazos cumpridos no mês
  const cumpridosPorAdv = {};
  prazosCumpridos.forEach(d => {
    const proc = processos.find(p => p.id === d.processId);
    const adv = proc?.advogadoResponsavel || '— sem titular —';
    cumpridosPorAdv[adv] = (cumpridosPorAdv[adv] || 0) + 1;
  });
  const topAdvCumpridos = Object.entries(cumpridosPorAdv).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // Carga atual: prazos ativos por advogado (estado atual, não do mês)
  const cargaPorAdv = {};
  prazos.filter(prazoEstaAtivo).forEach(d => {
    const proc = processos.find(p => p.id === d.processId);
    const adv = proc?.advogadoResponsavel || '— sem titular —';
    cargaPorAdv[adv] = (cargaPorAdv[adv] || 0) + 1;
  });
  const cargaSorted = Object.entries(cargaPorAdv).sort((a, b) => b[1] - a[1]);

  // Distribuição por área dos novos processos
  const porArea = {};
  procsNovos.forEach(p => {
    const area = p.area || '— sem área —';
    porArea[area] = (porArea[area] || 0) + 1;
  });
  const areaSorted = Object.entries(porArea).sort((a, b) => b[1] - a[1]);

  // Top clientes (por nº processos no mês ou honorários no mês)

    if (!p.clienteId) return;
    cliNovosProc[p.clienteId] = (cliNovosProc[p.clienteId] || 0) + 1;

    const adv = c.responsavel || '— sem responsável —';
    compsPorAdv[adv] = (compsPorAdv[adv] || 0) + 1;
  });
  const compsSorted = Object.entries(compsPorAdv).sort((a, b) => b[1] - a[1]);

  const ehMesAtual = ano === new Date().getFullYear() && mes === new Date().getMonth();

  $('appContent').innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="smallcaps-prefix">Relatório</span></h1>
        <p class="page-subtitle">Resumo executivo · ${_mesLabel(ano, mes)}${ehMesAtual ? ' <span class="badge badge-gold" style="font-size:9px;">EM CURSO</span>' : ''}</p>
      </div>
      <div class="flex gap-2 items-center">
        <button class="btn btn-ghost btn-sm" onclick="_navegarMesRelatorio(-1)" title="Mês anterior">‹</button>
        <input type="month" class="input" style="max-width: 160px;" value="${ano}-${String(mes+1).padStart(2,'0')}" onchange="_setMesRelatorio(this.value)">
        <button class="btn btn-ghost btn-sm" onclick="_navegarMesRelatorio(1)" title="Próximo mês">›</button>
        <button class="btn btn-outline btn-sm" onclick="_exportarRelatorioCsv()" title="Exportar resumo em CSV">⬇ CSV</button>
      </div>
    </div>

    <!-- Stats principais (4 cards comparativos) -->
    <div class="grid gap-3 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <div class="stat-card">

function _setMesRelatorio(yyyymm) {
  const [a, m] = (yyyymm || '').split('-').map(Number);
  if (!a || !m) return;
  state._relatorioRef = { ano: a, mes: m - 1 };
  renderRelatorio();
}
function _navegarMesRelatorio(delta) {
  const ref = state._relatorioRef || { ano: new Date().getFullYear(), mes: new Date().getMonth() };
  let novoAno = ref.ano, novoMes = ref.mes + delta;
  if (novoMes < 0) { novoMes = 11; novoAno--; }
  if (novoMes > 11) { novoMes = 0; novoAno++; }
  state._relatorioRef = { ano: novoAno, mes: novoMes };
  renderRelatorio();
}
async function _exportarRelatorioCsv() {
  const { ano, mes } = state._relatorioRef || { ano: new Date().getFullYear(), mes: new Date().getMonth() };
  const range = _mesRange(ano, mes);
  const [processos, prazos, honorarios, compromissos, transacoes, clientes] = await Promise.all([
    DB.getAllProcesses(), DB.getAllDeadlines(), DB.getAllHonorarios(),
    DB.getAllCompromissos(), DB.getAllTransacoes(), DB.getAllClientes()
  ]);
  const procsNovos = processos.filter(p => _isInRange(p.createdAt, range));
  const cumpridos = prazos.filter(d => d.status === 'cumprido' && _isDateInRange(d.cumprimento?.dataCumprimento, range));
  const perdidos = prazos.filter(d => d.status === 'perdido' && _isDateInRange(d.deadlineDate, range));
  let honRec = 0; honorarios.forEach(h => (h.parcelas || []).forEach(p => {
    if (p.status === 'pago' && (_isDateInRange(p.dataPagamento || p.dataPg || p.pagoEm, range) || _isInRange(p.dataPagamento || p.pagoEm, range))) honRec += Number(p.valor) || 0;
  }));
  const compsMes = compromissos.filter(c => _isDateInRange(c.dataHoraInicio, range));
  const transMes = transacoes.filter(t => _isDateInRange(t.data, range) && t.status === 'realizado');
  const receita = transMes.filter(t => t.tipo === 'receita').reduce((s, t) => s + Number(t.valor || 0), 0);
  const despesa = transMes.filter(t => t.tipo === 'despesa').reduce((s, t) => s + Number(t.valor || 0), 0);
  const cliNovos = clientes.filter(c => _isInRange(c.createdAt, range));

  let csv = 'Indicador;Valor\n';
  csv += `Mês de referência;${_mesLabel(ano, mes)}\n`;
  csv += `Processos novos;${procsNovos.length}\n`;
  csv += `Prazos cumpridos;${cumpridos.length}\n`;
  csv += `Prazos perdidos;${perdidos.length}\n`;
  csv += `Honorários recebidos (R$);${honRec.toFixed(2)}\n`;
  csv += `Receita realizada (R$);${receita.toFixed(2)}\n`;
  csv += `Despesa realizada (R$);${despesa.toFixed(2)}\n`;
  csv += `Saldo do mês (R$);${(receita - despesa).toFixed(2)}\n`;
  csv += `Compromissos no mês;${compsMes.length}\n`;
  csv += `Compromissos realizados;${compsMes.filter(c => c.status === 'realizado').length}\n`;
  csv += `Novos clientes;${cliNovos.length}\n`;

  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `relatorio_${ano}_${String(mes+1).padStart(2,'0')}.csv`);
  toast('Exportado', '', 'success');
}

// Compõe endereço em uma linha
function _composeEnderecoCli(cli) {
  if (!cli) return '';
  if (typeof _composeEndereco === 'function') return _composeEndereco(cli);
  const partes = [];
  if (cli.logradouro) partes.push(cli.logradouro + (cli.numero ? ', ' + cli.numero : ''));
  if (cli.complemento) partes.push(cli.complemento);
  if (cli.bairro) partes.push(cli.bairro);
  if (cli.cidade) partes.push(cli.cidade + (cli.uf ? '/' + cli.uf : ''));
  if (cli.cep) partes.push('CEP ' + cli.cep);
  return partes.join(' · ');
}

// Substitui {{tag}} pelos valores. Tags não resolvidos viram `[FALTANDO: tag]`
// (visível no preview pra forçar correção manual).
function _aplicarPlaceholders(template, ctx) {
  return String(template || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, key) => {
    const v = ctx[key];
    if (v === undefined) return `[FALTANDO: ${key}]`;
    return v === null ? '' : String(v);
  });
}

        return Object.entries(grupos).map(([g, items]) => `
          <div style="margin-bottom: 8px;">
            <strong style="font-size: 11px; color: var(--uc-graphite);">${escapeHtml(g)}:</strong>
            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;">
              ${items.map(p => `<code style="font-size: 11px; padding: 2px 6px; background: var(--uc-paper); color: var(--uc-graphite); border: 1px solid var(--uc-line); border-radius: 3px; cursor: copy;" onclick="navigator.clipboard.writeText('${p.tag}'); toast('Copiado', '${p.tag}', 'success')" title="${escapeHtml(p.desc)}">${escapeHtml(p.tag)}</code>`).join('')}
            </div>
          </div>
        `).join('');
      })()}
    </div>
  `;
}
